ion helper.\n- tests/test_skeleton.py — a couple of quick smoke tests: GET /login → 200 contains \"Sign in\"; login with mgr/mgr → 302 to /tasks and cookie set; bad login → 200 with \"Invalid credentials\". These are real runnable tests so `runtime.py test` passes.\n\nThen run `python3 harness/runtime.py test` to confirm discovery + pass, record in log, then commit.\n\nAlso record request mechanics in evidence/test-engineer/d002-request-mechanics.md.\n\nLet me check what role canApprove does — Role.java. Actually I know from AuthFilter comment: managers or admins. Let me quickly peek at Role.java to be precise. Not strictly needed. I'll grab it quickly along with writing files.\n\nLet me write the files now. Keep them small.\n\nFor the login helper: use urllib with HTTPCookieProcessor and a custom redirect handler that doesn't follow redirects (so we can see 302 Location). \n\nBase URL from env or default http://127.0.0.1:8080.\n\nTest skeleton code:\n\n```python\nimport http.cookiejar\nimport os\nimport unittest\nimport urllib.parse\nimport urllib.request\n\nBASE_URL = os.environ.get(\"TT_BASE_URL\", \"http://127.0.0.1:8080\")\n\n\nclass NoRedirect(urllib.request.HTTPRedirectHandler):\n    def redirect_request(self, req, fp, code, msg, headers, newurl):\n        return None\n\n\nclass HttpCase(unittest.TestCase):\n    \"\"\"Base for real-HTTP tests against the running task-tracker.\"\"\"\n\n    def setUp(self):\n        self.jar = http.cookiejar.CookieJar()\n        self.opener = urllib.request.build_opener(\n            urllib.request.HTTPCookieProcessor(self.jar), NoRedirect())\n\n    def request(self, method, path, params=None):\n        data = None if params is None else urllib.parse.urlencode(params).encode()\n        req = urllib.request.Request(BASE_URL + path, data=data, method=method)\n        try:\n            return self.opener.open(req, timeout=10)\n        except urllib.error.HTTPError as e:  # 4xx/5xx are answers, not crashes\n            return e\n\n    def login(self, username, password):\n        \"\"\"POST /login; returns response (302 + JSESSIONID on success).\"\"\"\n        return self.request(\"POST\", \"/login\", {\"username\": username, \"password\": password})\n```\n\nAnd test_skeleton.py:\n\n```python\nimport unittest\n\nfrom tests.httpcase import HttpCase\n\n\nclass TestSkeleton(HttpCase):\n    \"\"\"Smoke tests proving the harness slice works; EARS-tagged tests land in d00N.\"\"\"\n\n    def test_login_page_served(self):\n        resp = self.request(\"GET\", \"/login\")\n        self.assertEqual(resp.status, 200)\n        self.assertIn(b\"Sign in\", resp.read())\n\n    def test_login_success_sets_session_and_redirects(self):\n        resp = self.login(\"mgr\", \"mgr\")\n        self.assertEqual(resp.status, 302)\n        self.assertEqual(resp.headers[\"Location\"], \"/tasks\")  # maybe full URL? sendRedirect(contextPath + \"/tasks\") — Tomcat makes it absolute? Actually Tomcat sendRedirect converts to absolute URL in Location header. Let me not over-assert; assert endswith(\"/tasks\").\n        self.assertTrue(any(c.name == \"JSESSIONID\" for c in self.jar))\n\n    def test_login_failure_returns_200_with_error(self):\n        resp = self.login(\"mgr\", \"wrong\")\n        self.assertEqual(resp.status, 200)\n        self.assertIn(b\"Invalid credentials\", resp.read())\n\n    def test_protected_page_redirects_when_anonymous(self):\n        resp = self.request(\"GET\", \"/tasks\")\n        self.assertEqual(resp.status, 302)\n```\n\nNote: discovery: `unittest.defaultTestLoader.discover(str(OUTPUTS / \"tests\"))` — start dir tests/, top_level_dir defaults to start dir. Imports within discovered modules: `from tests.httpcase import HttpCase` — with top_level_dir = tests dir, the package name would be wrong. Hmm. discover(start_dir) with no top_level_dir sets top_level_dir = start_dir, inserts start_dir into sys.path, and modules are imported as top-level `test_skeleton`. Then `from tests.httpcase import ...` would import a second copy via OUTPUTS in sys.path (runtime.py inserts OUTPUTS at sys.path[0]). That works — `tests` package resolves via OUTPUTS path. But wait, would there be a module identity issue with HttpCase? test module imported as `test_skeleton` importing `tests.httpcase` — fine, no conflict.\n\nAlternatively simpler: use relative import? Discovery with top_level_dir=start_dir imports test_skeleton as top-level module, so relative imports fail. Use `from httpcase import HttpCase` — since start_dir (tests/) is inserted into sys.path, `httpcase` is importable as top-level. That's simplest and robust. But if tests later get run via other means (e.g., `python -m unittest discover` from repo root), top-level module `httpcase` still works since discover inserts start dir. OK, but both work. I'll use `from httpcase import HttpCase`? Hmm — cleaner is to make the helper importable both ways: in test file do try/except import:\n\n```python\ntry:\n    from tests.httpcase import HttpCase\nexcept ImportError:\n    from httpcase import HttpCase\n```\n\nKeep it simple — use the try/except. Fine.\n\nNote tests/ needs no __init__.py for discover when top_level_dir == start_dir (it handles directories without __init__ in py3 via namespace... actually discover requires start_dir importable OR it's fine if start_dir is not a package when top_level_dir is start_dir itself). It worked in practice generally. I'll skip __init__.py... but if I later use `from tests.httpcase`, tests/ needs __init__.py to be a package (or namespace package works in py3 without __init__). Namespace packages work without __init__.py. Keep it simple: add tests/__init__.py anyway? Discover with start_dir having __init__.py: module name becomes tests.test_skeleton if top_level_dir is parent... but top_level_dir defaults to start_dir, so with __init__.py present discover may still treat modules as top-level. Doesn't matter. I'll add __init__.py and use try/except import.\n\nActually simplest robust: s hod=method)\n        try:\n            return self.opener.open(req, timeout=10)\n        except urllib.error.HTTPError as exc:  # 4xx/5xx are answers, not crashes\n            return exc\n\n    def login(self, username, password):\n        \"\"\"POST /login. Success: 302 to /tasks + JSESSIONID cookie.\n        Failure: 200, login page with 'Invalid credentials'.\"\"\"\n        return self.request(\"POST\", \"/login\", {\"username\": username, \"password\": password})\n\n    def task_action(self, task_id, action, **extra):\n        \"\"\"POST /tasks/action as the currently logged-in user.\"\"\"\n        params = {\"id\": str(task_id), \"action\": action}\n        params.update(extra)\n        return self.request(\"POST\", \"/tasks/action\", params)\n\n    def session_cookie(self):\n        return next((c for c in self.jar if c.name == \"JSESSIONID\"), None)\n"},"command":"home/rishi/outputs/tests/httpcase.py"},"result":{"text":"Wrote file successfully.","isError":false,"ts":"2026-11-02T20:05:38.329Z","durationMs":7},"i":41,"workMs":7},{"kind":"tool_call","ts":"2026-11-02T20:05:43.164Z","tool":{"name":"write","callId":"call_26a26b0f0478407c98a622aa","input":{"filePath":"/home/rishi/outputs/tests/test_skeleton.py","content":"\"\"\"Harness smoke tests: prove real-HTTP + session-cookie plumbing works.\n\nEARS-tagged rule tests land in a follow-up dispatch; this module keeps\n`python3 harness/runtime.py test` non-empty and validates the login helper.\n\"\"\"\nimport unittest\n\ntry:  # imported as top-level module by unittest discovery (start dir = tests/)\n    from httpcase import HttpCase\nexcept ImportError:  # imported as part of the tests package\n    from tests.httpcase import HttpCase\n\n\nclass TestSkeleton(HttpCase):\n    def test_login_page_served(self):\n        resp = self.request(\"GET\", \"/login\")\n        self.assertEqual(resp.status, 200)\n        self.assertIn(b\"Sign in\", resp.read())\n\n    def test_anonymous_is_redirected_to_login(self):\n        re
