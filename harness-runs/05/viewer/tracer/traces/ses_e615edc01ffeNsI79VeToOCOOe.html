verified by\nharness integrity checks before and after every run).\n\n## Defect candidates (observed via real HTTP against the frozen app; source-confirmed)\n\n1. **Dangling destructive affordance — Delete link to an unmapped route**\n   `src/main/webapp/WEB-INF/jsp/projects.jsp` renders\n   `\u003ca href=\"${contextPath}/projects/delete?id=${p.id}\">Delete\u003c/a>` for every project,\n   but no servlet is mapped to `/projects/delete` in `web.xml` and `ProjectServlet`\n   implements no delete. Following the link gives HTTP 404. Test:\n   `test_projects.ProjectArchiveTests.test_s_proj_014_projects_delete_link_targets_an_unmapped_route`\n   (S-PROJ-014, characterization). Risk: users will click it; on a non-frozen build a\n   future mapping could make a GET link destructive (no CSRF token either).\n\n2. **Stored XSS via task title — list page renders titles unescaped**\n   `tasks.jsp` (and `task-form.jsp`) output `${t.title}` with plain EL, which does not\n   HTML-escape. A task titled `\u003cb>bold\u003c/b>` reaches the browser as raw HTML (verified).\n   The hand-rolled JSON escaper in `ApiTaskServlet.esc()` likewise only escapes `\\` and\n   `\"` and passes `\u003c`, `>`, `&` through (S-API-012, S-LIST-024, both characterization).\n   Any page rendering a user-controlled title without `\u003cc:out>`/`escapeXml` is\n   injectable by anyone who can create or edit a task.\n\n3. **Silent fallback for unknown sort tokens (policy ambiguity)**\n   `TaskDao.orderClause` maps any non-whitelisted `sort` token to the default\n   `updated_at DESC` instead of rejecting it (S-LIST-009, characterization). Injection\n   is correctly prevented by the whitelist, but an invalid token is silently accepted.\n   Flagging as an ambiguity: should unknown sorts 400 or fall back? Observed behavior\n   is documented as characterization, not as an intended requirement.\n\n4. **500 on malformed numeric inputs (uncaught NumberFormatException / IllegalArgumentException)**\n   Several handlers parse request parameters with `Long.parseLong` / `Long.valueOf` /\n   `java.sql.Date.valueOf` without catching conversion errors, yielding raw HTTP 500:\n   - `GET /tasks?assignee=abc` (TaskListServlet L31) — S-LIST-023\n   - `GET|POST /tasks/form` with `id=abc`, `projectId=abc`, `dueDate=not-a-date`\n     (TaskFormServlet L30/L50/L62) — S-FORM-004, S-FORM-014\n   - `POST /tasks/action` with `id=abc`, missing `id`, or `ids` containing `abc`\n     (TaskActionServlet L31, L83) — S-ACT-018, S-ACT-019, S-BULK-008\n   - `POST /tasks/form` with nonexistent `assigneeId` → FK violation surfaces as 500\n     (S-FORM-016)\n   Characterization only (no intended requirement states otherwise), but each is a\n   user-reachable 500 with a stack trace in the logs — defect candidates for input\n   validation rules.\n\n5. **GET /tasks/form?id=999 renders a blank \"New task\" form** instead of 404\n   (`tasks.findById` returns null and the JSP silently falls back to the blank form;\n   S-FORM-003, characterization). Same class of issue as the Delete link: silently\n   wrong UI state instead of an explicit error.\n\n## Unreachable / remaining uncovered branches (JaCoCo, all production Java)\n\nFinal counters (reports/coverage/summary.json): INSTRUCTION 1993/2155, BRANCH 168/188,\nLINE 452/500, METHOD 103/108, CLASS 17/17. Remaining gaps are:\n\n- **SQLException catch blocks** in `TaskDao`, `ProjectDao`, `PersonDao`, `Database`\n  (and `Database` connection-failure paths) — unreachable without inducing a DB fault;\n  the read-only `oracle_ro` connection path is exercised, error branches are not.\n- **`TaskDao.findByProject` and `ProjectDao.findById`** — dead from the HTTP surface:\n  no servlet calls either (projects page uses `findAll`/`exists`; form uses `findById`\n  of Task only). Candidates for dead-code findings.\n- **Defensive guards duplicated at DAO level**: `TaskDao.bulkClose` empty/null guard and\n  `updated_at` null branch (`map`, L236) — pre-empted by servlet-level checks and NOT\n  NULL constraints respectively.\n- **Servlet lifecycle / filter lifecycle** (`Filter.init`, `Filter.destroy`,\n  `BootstrapListener` internals) — container-driven, not reachable by HTTP tests.\n- **`TaskActionServlet.requireApprover` user==null half and L66/L78 committed-response\n  halves** — AuthFilter guarantees a user before the servlet runs; error paths already\n  committed the response. Unreachable via HTTP.\n- **`ApiTaskServlet.esc(null)`** — only called on NOT NULL columns; dueDate null is\n  handled by the ternary before `esc`.\n- **`LogoutServlet` session==null half** — AuthFilter redirects sessionless requests\n  before the servlet can run.\n\n## Policy ambiguities sent to the orchestrator\n\n- Unknown sort token: silent fallback (observed) vs explicit 400 (see item 3).\n- Failed login issues a container JSESSIONID cookie (JSP session autocreation) — the\n  session authenticates nothing (asserted), but \"no session on failed login\" is not\n  literally true; EARS rules should speak of \"no authenticated session\".\n- `POST /tasks/form` with `id=999` (nonexistent) runs an UPDATE matching no rows and\n  answers 302 as if saved (S-FORM-024) — should this be a 404?\n\n## Characterization vs intended requirements\n\nEvery test carries `kind` in `reports/tests/mapping.json`:\n`intended-requirement` (matches the rule the source implements) vs\n`characterization` (observed behavior labelled separately — the 500s, silent fallbacks,\nunescaped HTML, blank-form-on-missing-id, ghost-update cases above).\n","isError":false,"ts":"2026-11-02T23:39:19.462Z","durationMs":16},"tokens":{"input":2197,"output":129,"reasoning":110,"cacheRead":12100,"cacheWrite":0},"reportedCostUSD":0.00081205,"i":26,"workMs":342},{"kind":"meta","ts":"2026-11-02T23:39:19.485Z","text":"step finish — tool-calls","i":27},{"kind":"thinking","ts":"2026-11-02T23:39:20.222Z","text":"Now let me look at the full mapping.json to get the complete test list with ears IDs. And my current branch file onciles its mapping to YOUR ids.\"\n\nHmm wait — \"the engineer reconciles its mapping to YOUR ids\" — meaning I should NOT rewrite my specs; the engineer will fix their mapping to my IDs. But I need to link \"the accepted analyst S-IDs to the actually-executed engineer test IDs (from mapping.json)\". So in app-inventory.json, for each operation/row, I add execution links: analyst S-ID → engineer test ID(s) + result \"pass (run 05, engineer d002, 129/129)\" where executed.\n\nSo I need to map the engineer's provisional IDs to my IDs semantically. Let me read the rest of my specs (LIFE, BULK, QUERY, API, DATA) to complete the correspondence.\n\nAlso interesting: engineer's test names embed their provisional IDs (test_s_form_014_create_with_malformed_project_id_yields_500 → their S-FORM-014), but the mapping.json 'ear' field is the authoritative provisional ID. Note their test names sometimes mismatch their 'ear' field (e.g. test_s_proj_010 → ear S-PROJ-009). I should use the 'ear' field from mapping.json as the engineer's provisional ID.\n\nLet me read the remaining specs.","startTs":"2026-11-02T23:39:26.889Z","i":47,"workMs":2522},{"kind":"tool_call","ts":"2026-11-02T23:39:29.024Z","tool":{"name":"bash","callId":"chatcmpl-tool-b846b16cdae711f1","input":{"command":"for f in specs/LIFE.md specs/BULK.md specs/QUERY.md specs/API.md specs/DATA.md; do echo \"===== $f =====\"; cat \"$f\"; done","workdir":"/home/rishi/outputs"},"command":"for f in specs/LIFE.md specs/BULK.md specs/QUERY.md specs/API.md specs/DATA.md; do echo \"===== $f =====\"; cat \"$f\"; done"},"result":{"text":"===== specs/LIFE.md =====\n# LIFE — specifications\n\n## S-LIFE-001\n- **ID**: S-LIFE-001\n- **EARS statement**: WHEN action=start is posted for a task in status OPEN, THE SYSTEM SHALL set it to IN_PROGRESS and refresh updated_at; WHEN the task is in any other status, THE SYSTEM SHALL respond HTTP 409 and not write.\n- **Linked rule IDs**: R-LIFE-001\n- **Fixtures and inputs**: Task 1 seeded OPEN; TP 409.\n- **Linked rule IDs**: R-LIFE-003, R-AUTH-007\n- **Fixtures and inputs**: Task 3 seeded PENDING_APPROVAL; approve as admin (ADMIN) -> then as dev (MEMBER) on a freshly submitted task.\n- **Observable assertions**: 302 + readback DONE; MEMBER attempt 403; wrong-status attempt 409.\n- **Executable test IDs**: T-LIFE-005 (planned)\n\n## S-LIFE-006\n- **ID**: S-LIFE-006\n- **EARS statement**: WHEN an authorized approver posts action=reject for a PENDING_APPROVAL task, THE SYSTEM SHALL set it back to IN_PROGRESS; unauthorized actors get 403, wrong status gets 409.\n- **Linked rule IDs**: R-LIFE-004, R-AUTH-007\n- **Fixtures and inputs**: Task 3 PENDING_APPROVAL; reject as mgr (MANAGER); reject as view (VIEWER).\n- **Observable assertions**: 302 + readback IN_PROGRESS; VIEWER attempt 403.\n- **Executable test IDs**: T-LIFE-006 (planned)\n\n## S-LIFE-007\n- **ID**: S-LIFE-007\n- **EARS statement**: WHEN action=reopen is posted for a DONE task, THE SYSTEM SHALL set it to OPEN; for any other status THE SYSTEM SHALL respond HTTP 409.\n- **Linked rule IDs**: R-LIFE-005\n- **Fixtures and inputs**: Task 4 seeded DONE; POST action=reopen&id=4. Repeat on task 1.\n- **Observable assertions**: 302 + readback OPEN; repeat 409 \"expected DONE\".\n- **Executable test IDs**: T-LIFE-007 (planned)\n\n## S-LIFE-008\n- **ID**: S-LIFE-008\n- **EARS statement**: WHEN a successful action post includes return=detail, THE SYSTEM SHALL redirect to /tasks/form?id=\u003cid>; otherwise THE SYSTEM SHALL redirect to /tasks.\n- **Linked rule IDs**: R-LIFE-007\n- **Fixtures and inputs**: POST action=start&id=1&return=detail; then POST action=submit&id=1 (no return).\n- **Observable assertions**: Location headers /tasks/form?id=1 and /tasks respectively.\n- **Executable test IDs**: T-LIFE-008 (planned)\n\n## S-LIFE-009\n- **ID**: S-LIFE-009\n- **EARS statement**: WHEN the task list renders, THE SYSTEM SHALL show exactly the transition buttons valid for each row's current status (no-mutation observation case).\n- **Linked rule IDs**: R-LIFE-008\n- **Fixtures and inputs**: GET /tasks unfiltered (seeded tasks 1-4 span all four statuses).\n- **Observable assertions**: Row 1 shows only Start; row 2 only Submit; row 3 Approve+Reject; row 4 Reopen.\n- **Executable test IDs**: T-LIFE-009 (planned)\n===== specs/BULK.md =====\n# BULK — specifications\n\n## S-BULK-001\n- **ID**: S-BULK-001\n- **EARS statement**: WHEN action=bulkClose is posted with no ids, THE SYSTEM SHALL redirect to /tasks without modifying any task.\n- **Linked rule IDs**: R-BULK-001\n- **Fixtures and inputs**: POST /tasks/action action=bulkClose.\n- **Observable assertions**: 302 /tasks; API readback identical before/after.\n- **Executable test IDs**: T-BULK-001 (planned)\n\n## S-BULK-002\n- **ID**: S-BULK-002\n- **EARS statement**: WHEN action=bulkClose is posted with selected ids, THE SYSTEM SHALL set all selected non-DONE tasks to DONE in one update and redirect; WHEN any id is non-numeric, THE SYSTEM SHALL respond HTTP 500 without changing anything.\n- **Linked rule IDs**: R-BULK-002\n- **Fixtures and inputs**: (a) ids=1&ids=2; (b) ids=1&ids=abc.\n- **Observable assertions**: (a) 302; tasks 1,2 DONE in readback; (b) 500; both unchanged.\n- **Executable test IDs**: T-BULK-002 (planned)\n\n## S-BULK-003\n- **ID**: S-BULK-003\n- **EARS statement**: WHEN the bulkClose selection mixes statuses including DONE, THE SYSTEM SHALL close the non-DONE rows and leave DONE rows untouched, reporting nothing (mixed-state boundary).\n- **Linked rule IDs**: R-BULK-003\n- **Fixtures and inputs**: ids=3&ids=4 (task 3 PENDING_APPROVAL, task 4 DONE).\n- **Observable assertions**: 302; task 3 DONE, task 4 still DONE with unchanged updated_at.\n- **Executable test IDs**: T-BULK-003 (planned)\n\n## S-BULK-004\n- **ID**: S-BULK-004\n- **EARS statement**: WHEN a MEMBER posts action=bulkClose containing a PENDING_APPROVAL task, THE SYSTEM SHALL close it without a 403 (observed approval bypass, defect D-002 — expected per approval policy: 403).\n- **Linked rule IDs**: R-BULK-004, R-AUTH-008\n- **Fixtures and inputs**: Login as dev (MEMBER); POST action=bulkClose&ids=3.\n- **Observable assertions**: 302; task 3 DONE in readback; no 403 anywhere.\n- **Executable test IDs**: T-BULK-004 (planned)\n\n## S-BULK-005\n- **ID**: S-BULK-005\n- **EARS statement**: WHEN the task list renders, THE SYSTEM SHALL provide one bulkClose form with per-row checkboxes (render-only, no-mutation case).\n- **Linked rule IDs**: R-BULK-005\n- **Fixtures and inputs**: GET /tasks.\n- **Observable assertions**: form with hidden action=bulkClose; one checkbox name=ids value=\u003ctask id> per row; \"Close selected (bulk)\" button.\n- **Executable test IDs**: T-BULK-005 (planned)\n===== specs/QUERY.md =====\n# QUERY — specifications\n\n## S-QUERY-001\n- **ID**: S-QUERY-001\n- **EARS statement**: WHEN GET /tasks is requested with no filters, THE SYSTEM SHALL list every task ordered by updated_at descending (default sort), newest first.\n- **Linked rule IDs**: R-QUERY-001, R-QUERY-004\n- **Fixtures and inputs**: GET /tasks (seeded tasks 1-4 with staggered updated_at 09:00,12:00,15:00,18:00 — seed.sql:59-63).\n- **Observable assertions**: HTTP 200; row order 4,3,2,1 by default; all columns populated; task 4 due cell blank.\n- **Executable test IDs**: T-QUERY-001 (planned)\n\n## S-QUERY-002\n- **ID**: S-QUERY-002\n- **EARS statement**: WHEN GET /tasks?status=\u003cone of the four statuses>, THE SYSTEM SHALL list only tasks in that status; WHEN status is empty THE SYSTEM SHALL list all; WHEN status is unknown THE SYSTEM SHALL list none and return 200 (no error).\n- **Linked rule IDs**: R-QUERY-002\n- **Fixtures and inputs**: status=DONE; status=; status=BOGUS.\n- **Observable assertions**: Only task 4 / all tasks / empty table respectively.\n- **Executable test IDs**: T-QUERY-002 (planned)\n\n## S-QUERY-003\n- **ID**: S-QUERY-003\n- **EARS statement**: WHEN GET /tasks?assignee=\u003cid>, THE SYSTEM SHALL list only tasks assigned to that person; WHEN assignee is empty, all tasks; WHEN non-numeric, HTTP 500.\n- **Linked rule IDs**: R-QUERY-003\n- **Fixtures and inputs**: assignee=3 (tasks 1,2 seeded); assignee=; assignee=abc.\n- **Observable assertions**: Rows 1,2 only / all / 500.\n- **Executable test IDs**: T-QUERY-003 (planned)\n\n## S-QUERY-004\n- **ID**: S-QUERY-004\n- **EARS statement**: WHEN GET /tasks?sort=status, THE SYSTEM SHALL order rows by status then updated_at DESC; combined filters AND together (e.g. status=PENDING_APPROVAL&assignee=3).\n- **Linked rule IDs**: R-QUERY-004, R-QUERY-002, R-QUERY-003\n- **Fixtures and inputs**: sort=status; then status=PENDING_APPROVAL&assignee=3.\n- **Observable assertions**: Deterministic order for the seed set; combined query returns exactly task 3.\n- **Executable test IDs**: T-QUERY-004 (planned)\n\n## S-QUERY-005\n- **ID**: S-QUERY-005\n- **EARS statement**: WHEN GET /tasks?sort=priority, THE SYSTEM SHALL order HIGH before MEDIUM before LOW (semantic CASE order, not alphabetical), updated_at DESC within a group.\n- **Linked rule IDs**: R-QUERY-004\n- **Fixtures and inputs**: sort=priority over seeded tasks (HIGH 1,2; MEDIUM 3; LOW 4).\n- **Observable assertions**: Row order 1,2,3,4 (HIGH group newest-first).\n- **Executable test IDs**: T-QUERY-005 (planned)\n\n## S-QUERY-006\n- **ID**: S-QUERY-006\n- **EARS statement**: WHEN sort is due, due_date, title, or id, THE SYSTEM SHALL apply the matching whitelisted clause; WHEN sort is unknown, THE SYSTEM SHALL silently use the default updated_at DESC with HTTP 200.\n- **Linked rule IDs**: R-QUERY-004\n- **Fixtures and inputs**: sort=due; sort=due_date; sort=title; sort=id; sort=BOGUS.\n- **Observable assertions**: Task 3 (earliest due 2026-06-10) first under due; title order; id ascending; BOGUS behaves like default with no error.\n- **Executable test IDs**: T-QUERY-006 (planned)\n\n## S-QUERY-007\n- **ID**: S-QUERY-007\n- **EARS statement**: WHEN the default sort is in effect after a mutation, THE SYSTEM SHALL show the mutated task first (updated_at refreshed on write).\n- **Linked rule IDs**: R-QUERY-001, R-LIFE-001\n- **Fixtures and inputs**: POST action=start&id=1 then GET /tasks.\n- **Observable assertions**: Task 1 appears at the top of the list.\n- **Executable test IDs**: T-QUERY-007 (planned)\n\n## S-QUERY-008\n- **ID**: S-QUERY-008\n- **EARS statement**: WHEN the task list renders, THE SYSTEM SHALL show the filter/sort toolbar with the six whitelisted sort options and reflect the current selection (render-only).\n- **Linked rule IDs**: R-QUERY-005\n- **Fixtures and inputs**: GET /tasks?sort=priority&status=OPEN.\n- **Observable assertions**: Priority option selected; OPEN option selected; options list exactly updated/status/priority/due/title/id.\n- **Executable test IDs**: T-QUERY-008 (planned)\n===== specs/API.md =====\n# API — specifications\n\n## S-API-001\n- **ID**: S-API-001\n- **EARS statement**: WHEN GET /api/tasks is requested without any session, THE SYSTEM SHALL return HTTP 200 application/json with the task array (access-exemption case).\n- **Linked rule IDs**: R-API-001\n- **Fixtures and inputs**: Fresh anonymous client; GET /api/tasks.\n- **Observable assertions**: 200; Content-Type application/json; body is a JSON array of 4 seeded tasks.\n- **Executable test IDs**: T-API-001 (planned)\n\n## S-API-002\n- **ID**: S-API-002\n- **EARS statement**: WHEN GET /api/tasks?status=\u003cvalid status>, THE SYSTEM SHALL return only matching tasks; WHEN status is empty or absent, all tasks; WHEN status is unknown, an empty array with HTTP 200; assignee/sort params are ignored.\n- **Linked rule IDs**: R-API-002\n- **Fixtures and inputs**: status=DONE; status=; status=BOGUS; assignee=3&sort=title.\n- **Observable assertions**: [task 4] / [4 tasks] / [] / [4 tasks].\n- **Executable test IDs**: T-API-002 (planned)\n\n## S-API-003\n- **ID**: S-API-003\n- **EARS statement**: WHEN the API returns a task, THE SYSTEM SHALL include exactly the fields id,title,status,priority,assigneeId,projectId,dueDate,updatedAt and no description.\n- **Linked rule IDs**: R-API-003\n- **Fixtures and inputs**: GET /api/tasks.\n- **Observable assertions**: Every object has exactly those 8 keys; updatedAt matches /^\\d{4}-\\d{2}-\\d{2} \\d{2}:\\d{2}:\\d{2}$/.\n- **Executable test IDs**: T-API-003 (planned)\n\n## S-API-004\n- **ID**: S-API-004\n- **EARS statement**: WHEN a task has NULL assignee_id or due_date, THE SYSTEM SHALL emit JSON null for assigneeId/dueDate (null-handling case).\n- **Linked rule IDs**: R-API-004\n- **Fixtures and inputs**: GET /api/tasks (seed task 4: assignee 1... actually assignee_id=1, due_date NULL — for a NULL assignee, unassign task 4 via the form first).\n- **Observable assertions**: Task 4 object contains \"dueDate\":null; after unassigning, \"assigneeId\":null; body parses as JSON.\n- **Executable test IDs**: T-API-004 (planned)\n\n## S-API-005\n- **ID**: S-API-005\n- **EARS statement**: WHEN an exposed string contains a double quote or backslash, THE SYSTEM SHALL escape it and the body stays valid JSON; WHEN it contains a newline or control char, THE SYSTEM SHALL emit it raw and the body ceases to be valid JSON (observed defect, escaping boundary).\n- **Linked rule IDs**: R-API-005\n- **Fixtures and inputs**: POST /tasks/form title=Quote\"Test&projectId=1 -> GET /api/tasks parses; POST title=Line1\\nLine2 (literal newline) -> GET /api/tasks fails JSON parse.\n- **Observable assertions**: First body parses and title round-trips; second body contains a raw line break inside a string token.\n- **Executable test IDs**: T-API-005 (planned)\n===== specs/DATA.md =====\n# DATA — specifications\n\n## S-DATA-001\n- **ID**: S-DATA-001\n- **EARS statement**: WHEN the application starts, THE SYSTEM SHALL wait for the external database (retrying ~30s) and SHALL NOT create or alter any schema itself.\n- **Linked rule IDs**: R-DATA-001\n- **Fixtures and inputs**: Deployment against a schema-loaded Postgres (schema.sql+seed.sql+oracle-ro.sql).\n- **Observable assertions**: App serves requests once DB is up; task/project/person tables pre-exist with seed rows; no DDL from the app side.\n- **Executable test IDs**: T-DATA-001 (planned)\n\n## S-DATA-002\n- **ID**: S-DATA-002\n- **EARS statement**: WHEN login credentials match a seeded person row (plaintext compare), THE SYSTEM SHALL authenticate all four roles; anything else is refused with \"Invalid credentials\".\n- **Linked rule IDs**: R-DATA-002, R-AUTH-003, R-AUTH-004\n- **Fixtures and inputs**: POST /login for admin/admin, mgr/mgr, dev/dev, view/view; one wrong-password case.\n- **Observable assertions**: Four 302s to /tasks; failure case 200 with error text.\n- **Executable test IDs**: T-DATA-002 (planned)\n\n## S-DATA-003\n- **ID**: S-DATA-003\n- **EARS statement**: WHEN a project is created via the web, THE SYSTEM SHALL store state ACTIVE; WHEN archived, THE SYSTEM SHALL move it to ARCHIVED with no forward path back (DB CHECK + WHERE state='ACTIVE').\n- **Linked rule IDs**: R-DATA-003, R-PROJ-002, R-PROJ-004\n- **Fixtures and inputs**: Create then archive one project; re-archive it.\n- **Observable assertions**: state transitions ACTIVE->ARCHIVED only; second archive is a silent no-op.\n- **Executable test IDs**: T-DATA-003 (planned)\n\n## S-DATA-004\n- **ID**: S-DATA-004\n- **EARS statement**: WHEN a task write violates a column constraint (width, CHECK, FK, NOT NULL), THE SYSTEM SHALL surface HTTP 500 through the servlet and leave the table unchanged (constraint-backstop case).\n- **Linked rule IDs**: R-DATA-004, R-FORM-005, R-FORM-010\n- **Fixtures and inputs**: priority=URGENT; title 257 chars; assigneeId=9999; projectId=999.\n- **Observable assertions**: All HTTP 500; row counts unchanged.\n- **Executable test IDs**: T-DATA-004 (planned)\n\n## S-DATA-005\n- **ID**: S-DATA-005\n- **EARS statement**: WHEN tasks are read back, THE SYSTEM SHALL map NULL assignee_id/due_date to nulls, expose joined assigneeName
