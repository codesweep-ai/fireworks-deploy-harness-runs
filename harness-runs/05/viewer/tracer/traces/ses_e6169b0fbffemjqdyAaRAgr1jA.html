\"3\">${task.updatedAt}\u003c/td>\u003c/tr>\n        \u003c/table>\n        \u003cdiv class=\"transitions\">\n          \u003cform method=\"post\" action=\"${pageContext.request.contextPath}/tasks/action\" style=\"display:inline;margin:0;\">\n            \u003cinput type=\"hidden\" name=\"id\" value=\"${task.id}\"/>\n            \u003cinput type=\"hidden\" name=\"return\" value=\"detail\"/>\n            \u003cc:if test=\"${task.status == 'OPEN'}\">\n              \u003cbutton name=\"action\" value=\"start\">Start\u003c/button>\n            \u003c/c:if>\n            \u003cc:if test=\"${task.status == 'IN_PROGRESS'}\">\n              \u003cbutton name=\"action\" value=\"submit\">Submit for approval\u003c/button>\n            \u003c/c:if>\n            \u003cc:if test=\"${task.status == 'PENDING_APPROVAL'}\">\n              \u003cbutton name=\"action\" value=\"approve\">Approve\u003c/button>\n              \u003cbutton name=\"action\" value=\"reject\">Reject\u003c/button>\n            \u003c/c:if>\n            \u003cc:if test=\"${task.status == 'DONE'}\">\n              \u003cbutton name=\"action\" value=\"reopen\">Reopen\u003c/button>\n            \u003c/c:if>\n          \u003c/form>\n        \u003c/div>\n      \u003c/div>\n    \u003c/c:if>\n\n    \u003cform method=\"post\" action=\"${pageContext.request.contextPath}/tasks/form\">\n      \u003cc:if test=\"${not empty task}\">\u003cinput type=\"hidden\" name=\"id\" value=\"${task.id}\"/>\u003c/c:if>\n\n      \u003cdiv class=\"formrow\">\n        \u003clabel>Title *\u003c/label>\n        \u003cinput type=\"text\" name=\"title\" value=\"${task.title}\"/>\n      \u003c/div>\n\n      \u003cdiv class=\"formrow\">\n        \u003clabel>Description\u003c/label>\n        \u003ctextarea name=\"description\" rows=\"3\">${task.description}\u003c/textarea>\n      \u003c/div>\n\n      \u003cdiv class=\"formrow\">\n        \u003clabel>Project *\u003c/label>\n        \u003cselect name=\"projectId\">\n          \u003cc:forEach var=\"p\" rc/main/java/com/acme/tracker/web/TaskListServlet.java\"\n```\n\nThat's 18 files including AuthFilter.java. Good.\n\nTechnical/no-executable-counter files:\n- model/Person.java, Project.java, Role.java, Task.java — mostly getters/setters; Role has canApprove() with a branch (executable). TaskStatus — constants only, no executable code. Person/Project/Task — getters/setters are executable but typically trivial.\n- db/BootstrapListener.java — contextInitialized calls awaitReady; contextDestroyed is a no-op (no executable lines in contextDestroyed).\n- db/Database.java — static init, getConnection, awaitReady (loop with try/catch), env().\n\nThe denominator for the Java metric: all production classes compiled into the WAR. Note also inner classes: TaskDao, etc. don't have inner classes. There may be an anonymous class? No. But there might be synthetic classes. The JaCoCo XML will report per-class counters; I should audit that the number of classes in the JaCoCo report matches the 18 sources (plus possible $1 classes).\n\nImportant subtlety: The JaCoCo report in coverage() uses \"--classfiles /usr/local/tomcat/webapps/ROOT/WEB-INF/classes\" — the compiled production classes. The denominator = all classes under WEB-INF/classes. I will audit the XML report: list of sourcefiles == 18, and check for any class not corresponding to a scope.javaSources file (or vice versa).\n\nAlso note: enum Role will generate a synthetic values()/valueOf() — those count as missed/covered lines but they're part of the class. Switch on enum (none in code — TaskActionServlet uses string switch, fine).\n\nNow, per-family plan. Families:\n1. authentication/session/logout/access exemptions\n2. projects list/create/archive/validation\n3. task form read/create/edit/validation/defaults/nullable fields\n4. task start/submit/approve/reject/reopen/state guards/not-found/unknown actions\n5. bulk close empty/selected/mixed states/roles\n6. task status-assignee filters and every whitelisted/default sort\n7. public JSON API readback/filter/escaping/nulls\n8. database constraints/mapping/technical branches and observable JSP output\n\nFor each: source inspection targets, mapping completeness checks, representative assertions, one-real-request-per-route evidence.\n\nI should also note the edge cases I want to challenge:\n- Missing filters/sorts: unknown sort token → falls to default (updated desc) — is it tested? Invalid status filter value → returns empty list (no error). assignee as non-numeric → NumberFormatException → 500. Test expectations?\n- Nullable fields: dueDate invalid format → Date.valueOf throws IllegalArgumentException → 500. assigneeId non-numeric → NumberFormatException.\n- Invalid inputs: title whitespace-only → \"Title is required\". projectId non-numeric → NumberFormatException → 500 (not graceful fail). Negative/zero id.\n- Session/logout: logout invalidates; after logout, /tasks redirects to /login. /api/tasks is exempt — accessible logged out. /styles.css exempt. /login exempt. index.jsp — welcome file → is it exempt? path \"/\" — welcome file index.jsp; the filter maps /* and exempts only /login, /api/, .css. A request to \"/\" gets servlet path... Actually for welcome file, getServletPath() may be \"/index.jsp\" — ends with \".jsp\" not \".css\" → not exempt → redirect to login. And \"/index.jsp\" directly → redirect. So unauthenticated / → 302 to /login.\n- GET /logout requires session? LogoutServlet does getSession(false) — fine without session.\n- CSRF: no CSRF token — mutations via GET? No, mutations are POST. But POST /tasks/action with action=bulkClose requires session (not exempt). approve/reject require canApprove in filter AND in servlet (requireApprover). Note: filter blocks approve/reject for non-approvers; servlet double-checks. bulkClose: no role restriction — any authenticated user (including VIEWER) can bulk close! That's a potential business-rule question — is it a defect or intended? TaskActionServlet.handleBulkClose has no role cters. So a task title with a literal newline would produce invalid JSON. Challenge this! Also unicode. Also title with \u003c/script> irrelevant. But newline → broken JSON readback — a real potential defect candidate. Also UTF-8 handling: setCharacterEncoding(\"UTF-8\") for response; request parsing of UTF-8 title with special chars — Tomcat request encoding defaults to UTF-8 in 8+? Not necessarily for POST forms without request.setCharacterEncoding. Title \"Tâche €\" via POST form may be decoded ISO-8859-1 depending on Tomcat version defaults. Challenge with a real request.\n- API status filter: search(status, null, null) — status not whitelisted; any string → matches CHECK constraint values or empty. Invalid status → empty array, 200.\n- API projectId is written raw (not esc, not null-checked) — projectId is NOT NULL in DB so fine.\n- updatedAt: `u.toString().substring(0, 19)` — timestamps have format \"yyyy-MM-dd HH:mm:ss.fffffffff\" (nano) — first 19 chars = \"yyyy-MM-dd HH:mm:ss\" (19 chars: 4+1+2+1+2+1+2+1+2+1+2 = 19). OK.\n- Tasks list: assignee filter by id; assignee that has no tasks → empty list.\n- Sorts: every whitelisted token: updated (default), status, priority, due, due_date, title, id. Also \"sort=\" empty → default. Unknown \"sort=zzz\" → default. Priority sort semantic HIGH>MEDIUM>LOW via CASE. Due sort: NULL due dates sort first (ASC in PostgreSQL: NULLS LAST for ASC by default! In PostgreSQL, NULLS LAST is default for ASC). Task 4 has NULL due date. So due sort → NULLs last in PG. Check tests assert correct order.\n- Task form GET ?id=999999 → task attribute null → renders \"New task\" form (not an error). Check tests.\n- POST /tasks/form with id of nonexistent task → tasks.update → UPDATE ... WHERE id=? → no rows updated, no error → redirect to form?id=\u003cnonexistent> → renders as new task. Silent no-op. Challenge.\n- POST /tasks/form with nonexistent projectId → projects.exists false → \"A task must belong to an existing project\" → forward with error. With projectId non-numeric → Long.parseLong throws NumberFormatException → 500. Challenge: is that tested/intended?\n- Project archive: idempotent-ish (WHERE state='ACTIVE'), archive nonexistent → no-op redirect. POST /projects create with name → owner from session user; description nullable. Duplicate project names allowed (no UNIQUE).\n- ProjectDao.findAll ORDER BY p.name — alphabetical.\n- Auth: login with wrong password → forward with \"Invalid credentials\" (200, not 302). Login sets session attribute user (Person object with plaintext compare in SQL).\n- Role check: only approve/reject restricted. VIEWER can create tasks? ProjectServlet create — no role check. Viewer can create projects. Task create/edit — no role check. Challenge: rules may claim something else.\n- web.xml: welcome file index.jsp. AuthFilter exempts .css. Request to /styles.css directly exempt.\n- HTTP methods: GET /tasks/action → 405 (doPost only). GET /api/tasks works; POST /api/tasks → 405.\n- SQL: PersonDao.authenticate uses parameters; fine. TaskDao.search whitelists sort. bulkClose concatenates only \"?\" placeholders. No injection surfaces except... `status` filter is parameterized. OK.\n- Database constraints: FK violation on task create with bogus project via direct API? Not exposed via API. schema CHECK constraints. Task description VARCHAR(4000) — title 256; create task with >256 title → SQLException → RuntimeException → 500. Challenge.\n- JSP output: XSS — tasks.jsp outputs ${t.title} unescaped (JSTL ${} does NOT escape). So stored XSS via task title in HTML UI. That's a legacy app characteristic; rules may note it. This is observable JSP output behavior — check what rules claim. Actually wait — JSTL c:out escapes, but ${t.title} in EL doesn't escape. So XSS is present. That's an app characteristic, not necessarily a defect to fix (frozen app).\n- oracle_ro.sql: creates read-only user for verification queries.\n\nI also need to verify \"all source files are accounted for, including technical/unreachable branches\". Source inventory: 18 java + 8 view sources + 3 SQL + pom + build scripts. The inventory file is rules/app-inventory.json (authored by analyst) — I audit it when it appears.\n\nNow, the Java denominator: 18 javaSources. Classes in JaCoCo report: each source → 1 class (no inner classes; Role enum → Role.class only? Java enums with bodies... Role has no constant bodies, so Role.class + maybe Role$1? No. String switch generates synthetic $SwitchMap class! TaskActionServlet uses a string switch on `action` → javac generates TaskActionServlet$1.class (the switch map holder). So WEB-INF/classes will contain 19 class files. JaCoCo reports classes per sourcefile; the synthetic $1 class has no source file. It will add a class entry without sourcefile. Its lines are... the synthetic class contains no executable lines typically. I should account for it in the audit: 18 sources → expect 18 sourcefile entries; 19 class entries (one synthetic, zero executable lines). Note this in plan.\n\nFiles with no executable counter (line counter zero): TaskStatus.java (constants only — no executable lines), Person/Project/Task getters/setters ARE executable (they appear as lines). BootstrapListener.contextDestroyed has no lines. Database's private constructor is executable.\n\nLet me write plan.md now. Then poll for orchestrator ref. While waiting, I can also probe the running app (on base commit — wait, the running app is the frozen app; the tests aren't there yet. The engineer will push tests to... my repo? No — the orchestrator pushes the integration commit with tests to refs/campaign/orchestrator. So tests directory in my clone is empty until I adopt the integration tree. I can't run the suite until the push arrives.\n\nMeanwhile, I can do my own independent probing of the app with curl — that's \"one-real-request-per-route evidence\" which I control. Let me do that too.\n\nLet me write plan.md first.","startTs":"2026-11-02T23:27:34.245Z","i":78,"workMs":20050},{"kind":"assistant","ts":"2026-11-02T23:28:14.622Z","text":"Now writing the verification plan:","startTs":"2026-11-02T23:27:53.772Z","i":79,"workMs":20854},{"kind":"tool_call","ts":"2026-11-02T23:28:14.619Z","tool":{"name":"write","callId":"chatcmpl-tool-b4f29dd0d12a45f3","input":{"content":"# Independent verification plan — run 05 (dispatch d002)\n\nVerifier: `verifier`. This file is the apparatus checklist; executed evidence\nlives in `evidence/verifier/` and is referenced from the per-family tables below.\n\nGround rules:\n\n- I do not author or modify tests, rules, specs, or app sources. I inspect,\n  execute, and record.\n- Verification target is the **integration commit** pushed by the orchestrator to\n  `refs/campaign/orchestrator` (adopted tree), run against the frozen app at\n  `~/app` (commit `eee783057ec28d28fb36ec05484de9b4b40ceb9c`) on my own runtime.\n- Accept only evidence I actually reproduced (command + stdout/exit code) or\n  inspected (file + line). Anything else is named as unverified.\n\n## 1. Execution protocol\n\n| Step | Command (from `~/outputs`) | Purpose |\n|------|-----------------------------|---------|\n| Integrity | `python3 harness/runtime.py start` | frozen-source hash check + locked images + ready check (see `evidence/verifier/source-integrity.md`) |\n| Fresh data | `python3 harness/runtime.py reset` | re-applies schema+seed, 4 tasks |\n| Suite run 1 | `python3 harness/runtime.py test` | full integrated suite, fresh DB state |\n| Suite run 2 | `python3 harness/runtime.py reset && python3 harness/runtime.py test` | order/state independence (same result on a second fresh DB; also detects seed-order dependence) |\n| Coverage | `python3 harness/runtime.py coverage` | dumps JaCoCo tcpserver exec → `reports/coverage/{jacoco.exec,report.xml,summary.json,html}` |\n| Re-check | `python3 harness/check-frozen-app.py ~/app` | integrity after all runs |\n\nTwo attempts per stable verification item, 3 minutes each (`_campaign/policy.json`).\n\n## 2. Production Java denominator (computed from frozen source)\n\n`scope.json` lists **18 javaSources**. Every file must be accounted for,\nincluding ones with no meaningful executable counter:\n\n| # | Source file | Role | Expected in JaCoCo? |\n|---|-------------|------|---------------------|\n| 1 | `dao/PersonDao.java` | authenticate/findAll/map | yes — lines + branches |\n| 2 | `dao/ProjectDao.java` | findAll/findById/exists/create/archive/map | yes |\n| 3 | `dao/TaskDao.java` | search/CRUD/bulkClose/orderClause/map | yes |\n| 4 | `db/BootstrapListener.java` | contextInitialized → awaitReady; contextDestroyed is an **empty no-op** (no executable line) | yes, but `contextDestroyed` must show no missed lines |\n| 5 | `db/Database.java` | static driver load, getConnection, awaitReady loop, env() | yes; the `ClassNotFoundException` branch is a **technical branch** (unreachable with the driver on the classpath) — flagged, not demanded |\n| 6 | `model/Person.java` | getters/setters only (trivial executable lines) | yes, low value |\n| 7 | `model/Project.java` | getters/setters | yes, low value |\n| 8 | `model/Task.java` | getters/setters | yes, low value |\n| 9 | `model/Role.java` | enum; `canApprove()` has a real 2-way branch (ADMIN/MANAGER vs MEMBER/VIEWER) | yes |\n| 10 | `model/TaskStatus.java` | string constants only — **no executable lines at all** (private ctor never called; class not even loaded at runtime unless referenced; constants are inlined) | sourcefile entry expected with **zero or near-zero counters**; do not treat as a coverage gap |\n| 11 | `web/ApiTaskServlet.java` | JSON readback + `esc()` | yes |\n| 12 | `web/AuthFilter.java` | exemptions, redirect, approve/reject role gate | yes |\n| 13 | `web/LoginServlet.java` | GET forward, POST auth fail/success | yes |\n| 14 | `web/LogoutServlet.java` | invalidate + redirect; `session != null` branch with a pre-login GET is a real branch | yes |\n| 15 | `web/ProjectServlet.java` | list/create/archive | yes |\n| 16 | `web/TaskActionServlet.java` | transitions, guards, bulkClose | yes; string-switch generates a synthetic `TaskActionServlet$1.class` (no sourcefile, no lines) — audit note below |\n| 17 | `web/TaskFormServlet.java` | GET form, POST validation/create/update | yes |\n| 18 | `web/TaskListServlet.java` | filter/sort passthrough | yes |\n\nDenominator audit procedure: parse `reports/coverage/report.xml` and check\n\n1. `sourcefile` count under the root `counter`-bearing package tree == 18, names\n   exactly the 18 `scope.json` javaSources;\n2. no *production* class is absent (a missing classfile silently shrinks the\n   denominator);\n3. the synthetic `TaskActionServlet$1` (string-switch) may appear as a class with\n   no sourcefile — record it, it contributes no lines;\n4. `TaskStatus.java` / empty-method bodies are **not** counted as coverage debt;\n5. classes under `WEB-INF/lib` or test classes are outside the metric (the\n   frozen `src/test/java/.../LifecycleTest.java` is not compiled into the WAR).\n\n**Scope caveat (recorded up front):** the JaCoCo metric covers compiled Java\nonly. JSP translation units, SQL (schema/seed), CSS, and business rules encoded\npurely in SQL CHECK constraints or JSTL are *outside* it. Those are verified\nbehaviorally (HTTP + DB evidence) per family below. Java line/branch coverage\nmust never be quoted as whole-app coverage.\n\n## 3. Per-family checklist\n\nFor each family: (a) source/spec/test mapping inspection, (b) representative\nassertion quality, (c) one-real-request-per-route evidence, (d) my own\nindependent probe (curl + psql via `runtime.py sql/fixture`).\n\n### F1. authentication / session / logout / access exemptions\n\n- Sources: `AuthFilter.java` (exempts `/login`, `/api/*`, `*.css`),\n  `LoginServlet`, `LogoutServlet`, `web.xml` mapping `/*`, `PersonDao.authenticate`.\n- Mapping: every rule/spec cites these; check mapping.json links resolve to\n  executed tests.\n- Assertions: wrong password → 200 + \"Invalid credentials\" (forward, not\n  redirect); success → 302 `/tasks` + session cookie; unauthenticated GET\n  `/tasks`, `/tasks/form`, `/projects`, `/logout`-less session → 302 `/login`;\n  `/api/tasks` and `/styles.css` reachable with **no** cookie (exemption);\n  logout invalidates (reusing the old cookie → redirect to login).\n- Route evidence: one real request per route — `/login` GET+POST, `/logout` GET.\n- Independent probes: viewer/dev may read pages; expired/garbage JSESSIONID.\n\n### F2. projects list / create / archive / validation\n\n- Sources: `ProjectServlet.java`, `ProjectDao.java` (create forces\n  state='ACTIVE'; archive is `WHERE state='ACTIVE'` so re-archive is a silent\n  no-op; name is trimmed/validated; description nullable).\n- Assertions: blank name → 400 \"Project name is required\"; create → redirect +\n  row in DB with owner = session user; archive → state ARCHIVED; archive\n  already-archived → silent no-op (row unchanged); archive nonexistent id →\n  redirect, no error.\n- Route evidence: GET `/projects`, POST `/projects` (create + archive).\n- Challenges: duplicate names allowed? (no UNIQUE); viewer can create projects\n  (no role gate) — check what the rules claim vs source.\n\n### F3. task form read / create / edit / validation / defaults / nullable\n\n- Sources: `TaskFormServlet.java` (GET prefill; POST: title required,\n  projectId must exist, priority default MEDIUM, assignee nullable, dueDate\n  nullable; update path keeps status/updated_at refresh in DAO), `task-form.jsp`.\n- Assertions: title whitespace-only → error forward; nonexistent project →\n  error forward; create → redirect `?saved=1`, row status OPEN, priority\n  default MEDIUM when blank; edit → fields persisted, status unchanged;\n  assignee \"(unassigned)\" → NULL in DB; empty dueDate → NULL.\n- Route evidence: GET `/tasks/form` (new + `?id=`), POST create + update.\n- Challenges (invalid inputs): non-numeric `projectId`/`assigneeId` →\n  NumberFormatException → HTTP 500; malformed dueDate (`2026-13-99`) →\n  `IllegalArgumentException` → 500; GET `?id=\u003cbogus>` renders as \"New task\"\n  (null attribute) rather than an error; POST with `id` of a nonexistent task →\n  UPDATE matches 0 rows → silent success. Record which of these the suite\n  actually pins down and which are untested behavior.\n\n### F4. task start / submit / approve / reject / reopen / guards / not-found / unknown\n\n- Sources: `TaskActionServlet.java` (guard: 409 with expected status; 404\n  unknown id; 400 unknown/missing action; approve+reject require\n  `canApprove()` — enforced in the filter **and** re-checked in the servlet),\n  `TaskStatus` constants, schema CHECK.\n- Assertions: full legal chain OPEN→IN_PROGRESS→PENDING_APPROVAL→DONE→OPEN;\n  each illegal transition → 409 and status unchanged in DB; 404 for missing id;\n  400 for unknown action; approve/reject as MEMBER/VIEWER → 403 (filter), as\n  MANAGER/ADMIN → allowed.\n- Route evidence: POST `/tasks/action` with each action.\n- Note (technical branch): the servlet's `requireApprover` 403 path is masked\n  by the filter's earlier 403 for normal requests — defense in depth; a row in\n  the JaCoCo report for it is expected to be partially red. Flag as\n  defense-in-depth, not necessarily a test gap.\n- Challenges: `id` missing → 500 (NumberFormatException); `return=detail`\n  redirect target; missing `action` → 400 via `default` (empty string).\n\n### F5. bulk close (empty / selected / mixed states / roles)\n\n- Sources: `TaskActionServlet.handleBulkClose`, `TaskDao.bulkClose`\n  (`status \u003c> 'DONE' AND id IN (...)` — single UPDATE; already-DONE rows are\n  silently skipped; updated_at bumped only for closed rows).\n- Assertions: no `ids` → redirect, nothing changed; select mix of DONE and\n  non-DONE → non-DONE become DONE, DONE row untouched; nonexistent ids\n  ignored; any authenticated role may bulk-close (no `canApprove` gate —\n  contrast with approve/reject; verify rules tor audit detail in\n`evidence/verifier/coverage-audit.md`: 18/18 scope.json sourcefiles present,\n`CLASS=17` because `TaskStatus.java` compiles to a class with zero executable\nlines. No synthetic switch classes (string-switch, no enum-switch in sources).\n\n### Explicitly uncovered (missed lines / partial branches), by file\n\n- `dao/TaskDao.java` (14 lines): `findByProject` body (32) — **never called by\n  any servlet or test** (dead via HTTP); all six `catch (SQLException)` blocks\n  (70-71, 109-110, 122-123, 144-145, 199-200, 215-216) — technical; `bulkClose`\n  null/empty early-return (130) — unreachable via servlet (servlet pre-checks);\n  null-timestamp ternary (236) — `updated_at` is NOT NULL by schema.\n- `dao/ProjectDao.java` (15 lines): `findById` body (34-38) — **never called by\n  any servlet or test**; four catch blocks (27-28, 40-41, 52-53, 69-70, 81-82).\n- `db/Database.java` (12 lines): `ClassNotFoundException` branch (25-26) —\n  technical, driver always present; `awaitReady` failure-retry loop (48-55, 58)\n  — DB is up before app starts, so the retry path is untestable in this harness\n  without fault injection; `env()` empty-default ternary (63).\n- `web/TaskActionServlet.java` (2 lines, 6 branches): `requireApprover`\n  403 lines (94-95) and its `user == null` arm — **masked by AuthFilter's\n  earlier 403** (defense-in-depth, only reachable if the filter were bypassed);\n  `resp.isCommitted()` arm (66); bulkClose null/empty arm (78) — covered only as\n  the null-vs-length branch, servlet-level empty case sends no ids → covered;\n  guard-fail arms of lines 49/54 (approve/reject with wrong status while also\n  being an approver).\n- `web/TaskFormServlet.java` (4 branches): `projectIdParam == null` arm (50) —\n  unreachable via form (field always posted) but reachable via crafted request;\n  update-vs-create `idParam == null` arm is covered both ways (65); `trim(null)`\n  (86) / `orDefault(null)` (90) null arms.\n- `web/ApiTaskServlet.java`: `esc(
