to /tasks; subsequent GET /tasks returns 200 with \"Devon Member\" in the header.\n- **Executable test IDs**: T-AUTH-004 (planned)\n\n## S-AUTH-005\n- **ID**: S-AUTH-005\n- **EARS statement**: WHEN POST /login carries invalid credentials, THE SYSTEM SHALL re-render the login form with \"Invalid credentials\" and not create a session user.\n- **Linked rule IDs**: R-AUTH-004\n- **Fixtures and inputs**: POST username=dev, password=wrong.\n- **Observable assertions**: HTTP 200; body contains \"Invalid credentials\"; GET /tasks afterwards still 302s to /login.\n- **Executable test IDs**: T-AUTH-005 (planned)\n\n## S-AUTH-006\n- **ID**: S-AUTH-006\n- **EARS statement**: WHEN GET /login is requested, THE SYSTEM SHALL render the sign-in form without mutating any data.\n- **Linked rule IDs**: R-AUTH-005\n- **Fixtures and inputs**: GET /login.\n- **Observable assertions**: HTTP 200; body contains name=\"username\" and name=\"password\" inputs.\n- **Executable test IDs**: T-AUTH-006 (planned)\n\n## S-AUTH-007\n- **ID**: S-AUTH-007\n- **EARS statement**: WHEN GET /logout is requested, THE SYSTEM SHALL invalidate the session and redirect to /login; when no session exists it SHALL still redirect without error.\n- **Linked rule IDs**: R-AUTH-006\n- **Fixtures and inputs**: Authenticated session; then GET /logout; then GET /tasks. Repeat with no session.\n- **Observable assertions**: 302 to /login in both cases; after logout GET /tasks is 302 to /login.\n- **Executable test IDs**: T-AUTH-007 (planned)\n\n## S-AUTH-008\n- **ID**: S-AUTH-008\n- **EARS statement**: WHEN a user whose role is not ADMIN or MANAGER posts action=approve or action=reject to /tasks/action, THE SYSTEM SHALL respond HTTP 403 and leave the task status unchanged.\n- **Linked rule IDs**: R-AUTH-007\n- **Fixtures and inputs**: Login as dev (MEMBER); task 3 is seeded PENDING_APPROVAL; POST /tasks/action id=3&action=approve.\n- **Observable assertions**: HTTP 403; GET /api/tasks shows task 3 still PENDING_APPROVAL.\ th (NULL and '' render identically; distinguish via API/DB if available — else record as screen-equivalent).\n- **Executable test IDs**: T-PROJ-006 (planned)\n\n## S-PROJ-007\n- **ID**: S-PROJ-007\n- **EARS statement**: WHEN a user clicks the Delete link for a project, THE SYSTEM SHALL return HTTP 404 because no handler is mapped to /projects/delete (defect D-001, observed).\n- **Linked rule IDs**: R-PROJ-006\n- **Fixtures and inputs**: Authenticated GET /projects/delete?id=1.\n- **Observable assertions**: HTTP 404; project 1 still exists and unchanged.\n- **Executable test IDs**: T-PROJ-007 (planned)\n\n## S-PROJ-008\n- **ID**: S-PROJ-008\n- **EARS statement**: WHEN a task is created or edited with projectId pointing at an ARCHIVED project, THE SYSTEM SHALL accept it (observed; no state check exists).\n- **Linked rule IDs**: R-PROJ-007\n- **Fixtures and inputs**: POST /tasks/form title=Ghost&projectId=3 (project 3 ARCHIVED).\n- **Observable assertions**: 302 to form?id=...&saved=1; task persisted with project_name 'Legacy Archive'.\n- **Executable test IDs**: T-PROJ-008 (planned)\n=== specs/FORM.md ===\n# FORM — specifications\n\n## S-FORM-001\n- **ID**: S-FORM-001\n- **EARS statement**: WHEN GET /tasks/form is requested without id, THE SYSTEM SHALL render the New task form; WHEN id names an existing task, THE SYSTEM SHALL pre-fill every field and show the detail panel.\n- **Linked rule IDs**: R-FORM-001\n- **Fixtures and inputs**: (a) GET /tasks/form; (b) GET /tasks/form?id=2 (seed: Wire up SSO, IN_PROGRESS, HIGH, assignee 3, project 1, due 2026-06-20).\n- **Observable assertions**: (a) heading \"New task\", empty title input; (b) heading \"Task #2: Wire up SSO\", status badge IN_PROGRESS, title input value \"Wire up SSO\", priority HIGH selected.\n- **Executable test IDs**: T-FORM-001 (planned)\n\n## S-FORM-002\n- **ID**: S-FORM-002\n- **EARS statement**: WHEN GET /tasks/form?id names a nonexistent task, THE SYSTEM SHALL render the New task form (observed mislabel); WHEN id is non-numeric, THE SYSTEM SHALL return HTTP 500.\n- **Linked rule IDs**: R-FORM-002\n- **Fixtures and inputs**: GET /tasks/form?id=999; GET /tasks/form?id=abc.\n- **Observable assertions**: (a) 200 with \"New task\"; (b) HTTP 500.\n- **Executable test IDs**: T-FORM-002 (planned)\n\n## S-FORM-003\n- **ID**: S-FORM-003\n- **EARS statement**: WHEN POST /tasks/form has a blank title, THE SYSTEM SHALL re-render the form with \"Title is required\" and persist nothing.\n- **Linked rule IDs**: R-FORM-003\n- **Fixtures and inputs**: POST title=\"   \" projectId=1 (and title absent).\n- **Observable assertions**: 200; body contains \"Title is required\"; task count unchanged.\n- **Executable test IDs**: T-FORM-003 (planned)\n\n## S-FORM-004\n- **ID**: S-FORM-004\n- **EARS statement**: WHEN POST /tasks/form has a missing, empty, or nonexistent projectId, THE SYSTEM SHALL re-render with \"A task must belong to an existing project\"; WHEN projectId is non-numeric, THE SYSTEM SHALL return HTTP 500.\n- **Linked rule IDs**: R-FORM-004\n- **Fixtures and inputs**: POST title=T with projectId= (empty), projectId=999, projectId=abc.\n- **Observable assertions**: 200 error render for first two; 500 for last; nothing persisted.\n- **Executable test IDs**: T-FORM-004 (planned)\n\n## S-FORM-005\n- **ID**: S-FORM-005\n- **EARS statement**: WHEN POST /tasks/form omits priority, THE SYSTEM SHALL store MEDIUM; WHEN priority is not LOW/MEDIUM/HIGH, THE SYSTEM SHALL fail with HTTP 500 from the DB CHECK and persist nothing (observed gap, defect D-004).\n- **Linked rule IDs**: R-FORM-005\n- **Fixtures and inputs**: (a) POST title=T&projectId=1 (no priority); (b) POST title=U&projectId=1&priority=URGENT.\n- **Observable assertions**: (a) created, priority MEDIUM; (b) HTTP 500, no new row.\n- **Executable test IDs**: T-FORM-005 (planned)\n\n## S-FORM-006\n- **ID**: S-FORM-006\n- **EARS statement**: WHEN POST /tasks/form has empty assigneeId, THE SYSTEM SHALL store NULL (unassigned); WHEN assigneeId is non-numeric or references no person, THE SYSTEM SHALL return HTTP 500.\n- **Linked rule IDs**: R-FORM-006\n- **Fixtures and inputs**: (a) assigneeId=; (b) assigneeId=x; (c) assigneeId=9999.\n- **Observable assertions**: (a) created with '(unassigned)' in detail panel and assigneeId null in API readback; (b),(c) HTTP 500.\n- **Executable test IDs**: T-FORM-006 (planned)\n\n## S-FORM-007\n- **ID**: S-FORM-007\n- **EARS statement**: WHEN POST /tasks/form has empty dueDate, THE SYSTEM SHALL store NULL; WHEN dueDate is not an ISO date, THE SYSTEM SHALL return HTTP 500.\n- **Linked rule IDs**: R-FORM-007\n- **Fixtures and inputs**: (a) dueDate=; (b) dueDate=31/12/2026.\n- **Observable assertions**: (a) created, dueDate null in API; (b) HTTP 500.\n- **Executable test IDs**: T-FORM-007 (planned)\n\n## S-FORM-008\n- **ID**: S-FORM-008\n- **EARS statement**: WHEN POST /tasks/form carries no id, THE SYSTEM SHALL create the task with status OPEN and redirect to /tasks/form?id=\u003cnew>&saved=1.\n- **Linked rule IDs**: R-FORM-008\n- **Fixtures and inputs**: POST title=Fresh&projectId=1&priority=LOW&assigneeId=3&dueDate=2026-12-01.\n- **Observable assertions**: 302 with saved=1; detail shows status OPEN; \"Saved.\" banner visible.\n- **Executable test IDs**: T-FORM-008 (planned)\n\n## S-FORM-009\n- **ID**: S-FORM-009\n- **EARS statement**: WHEN POST /tasks/form carries an existing id, THE SYSTEM SHALL update title/description/priority/assignee/dueDate but leave status unchanged and bump updated_at.\n- **Linked rule IDs**: R-FORM-008\n- **Fixtures and inputs**: Task id=1 (OPEN, HIGH); POST id=1&title=Renamed&projectId=1&priority=LOW&assigneeId=&dueDate=.\n- **Observable assertions**: 302 saved=1; detail shows title Renamed, priority LOW, unassigned, no due date, status STILL OPEN; updated_at advanced vs API readback baseline.\n- **Executable test IDs**: T-FORM-009 (planned)\n\n## S-FORM-010\n- **ID**: S-FORM-010\n- **EARS statement**: WHEN a stored field exceeds its column width (title>256, description>4000), THE SYSTEM SHALL fail with HTTP 500 from the DB and persist nothing (boundary).\n- **Linked rule IDs**: R-FORM-008\n- **Fixtures and inputs**: POST title=\u003c257 chars>&projectId=1; POST title=T&projectId=1&description=\u003c4001 chars>.\n- **Observable assertions**: HTTP 500; no row created.\n- **Executable test IDs**: T-FORM-010 (planned)\n=== specs/LIFE.md ===\n# LIFE — specifications\n\n## S-LIFE-001\n- **ID**: S-LIFE-001\n- **EARS statement**: WHEN action=start is posted for a task in status OPEN, THE SYSTEM SHALL set it to IN_PROGRESS and refresh updated_at; WHEN the task is in any other status, THE SYSTEM SHALL respond HTTP 409 and not write.\n- **Linked rule IDs**: R-LIFE-001\n- **Fixtures and inputs**: Task 1 seeded OPEN; POST action=start&id=1. Then repeat on task 2 (IN_PROGRESS) and task 4 (DONE).\n- **Observable assertions**: First call 302; API readback shows task 1 IN_PROGRESS with newer updatedAt; repeats give 409 with \"expected OPEN\"; task 2/4 unchanged.\n- **Executable test IDs**: T-LIFE-001 (planned)\n\n## S-LIFE-002\n- **ID**: S-LIFE-002\n- **EARS statement**: WHEN action=submit is posted for a task in status IN_PROGRESS, THE SYSTEM SHALL set it to PENDING_APPROVAL; otherwise THE SYSTEM SHALL respond HTTP 409.\n- **Linked rule IDs**: R-LIFE-002\n- **Fixtures and inputs**: Task 2 seeded IN_PROGRESS; POST action=submit&id=2. Repeat on task 1 (OPEN).\n- **Observable assertions**: 302 then readback PENDING_APPROVAL; repeat 409 \"expected IN_PROGRESS\".\n- **Executable test IDs**: T-LIFE-002 (planned)\n\n## S-LIFE-003\n- **ID**: S-LIFE-003\n- **EARS statement**: WHEN a lifecycle action names an unknown task id, THE SYSTEM SHALL respond HTTP 404 \"No such task\"; WHEN the id is non-numeric, THE SYSTEM SHALL respond HTTP 500.\n- **Linked rule IDs**: R-LIFE-006\n- **Fixtures and inputs**: POST action=start&id=999; POST action=start&id=abc.\n- **Observable assertions**: 404 / 500; no rows changed.\n- **Executable test IDs**: T-LIFE-003 (planned)\n\n## S-LIFE-004\n- **ID**: S-LIFE-004\n- **EARS statement**: WHEN the action parameter is absent or not a recognized token, THE SYSTEM SHALL respond HTTP 400 naming the action and write nothing.\n- **Linked rule IDs**: R-LIFE-006\n- **Fixtures and inputs**: POST /tasks/action (no action); POST action=teleport&id=1.\n- **Observable assertions**: 400; body contains \"Unknown action: teleport\" / \"Unknown action: null\".\n- **Executable test IDs**: T-LIFE-004 (planned)\n\n## S-LIFE-005\n- **ID**: S-LIFE-005\n- **EARS statement**: WHEN an ADMIN or MANAGER posts action=approve for a PENDING_APPROVAL task, THE SYSTEM SHALL set it to DONE; WHEN the actor's role is MEMBER or VIEWER, THE SYSTEM SHALL respond HTTP 403; WHEN the status differs, HTTP 409.\n- **Linked rule IDs**: R-LIFE-003, R-AUTH-007\n- **Fixtures and inputs**: Task 3 seeded PENDING_APPROVAL; approve as admin (ADMIN) -> then as dev (MEMBER) on a freshly submitted task.\n- **Observable assertions**: 302 + readback DONE; MEMBER attempt 403; wrong-status attempt 409.\n- **Executable test IDs**: T-LIFE-005 (planned)\n\n## S-LIFE-006\n- **ID**: S-LIFE-006\n- **EARS statement**: WHEN an authorized approver posts action=reject for a PENDING_APPROVAL task, THE SYSTEM SHALL set it back to IN_PROGRESS; unauthorized actors get 403, wrong status gets 409.\n- **Linked rule IDs**: R-LIFE-004, R-AUTH-007\n- **Fixtures and inputs**: Task 3 PENDING_APPROVAL; reject as mgr (MANAGER); reject as view (VIEWER).\n- **Observable assertions**: 302 + readback IN_PROGRESS; VIEWER attempt 403.\n- **Executable test IDs**: T-LIFE-006 (planned)\n\n## S-LIFE-007\n- **ID**: S-LIFE-007\n- **EARS statement**: WHEN action=reopen is posted for a DONE task, THE SYSTEM SHALL set it to OPEN; for any other status THE SYSTEM SHALL respond HTTP 409.\n- **Linked rule IDs**: R-LIFE-005\n- **Fixtures and inputs**: Task 4 seeded DONE; POST action=reopen&id=4. Repeat on task 1.\n- **Observable assertions**: 302 + readback OPEN; repeat 409 \"expected DONE\".\n- **Executable test IDs**: T-LIFE-007 (planned)\n\n## S-LIFE-008\n- **ID**: S-LIFE-008\n- **EARS statement**: WHEN a successful action post includes return=detail, THE SYSTEM SHALL redirect to /tasks/form?id=\u003cid>; otherwise THE SYSTEM SHALL redirect to /tasks.\n- **Linked rule IDs**: R-LIFE-007\n- **Fixtures and inputs**: POST action=start&id=1&return=detail; then POST action=submit&id=1 (no return).\n- **Observable assertions**: Location headers /tasks/form?id=1 and /tasks respectively.\n- **Executable test IDs**: T-LIFE-008 (planned)\n\n## S-LIFE-009\n- **ID**: S-LIFE-009\n- **EARS statement**: WHEN the task list renders, THE SYSTEM SHALL show exactly the transition buttons valid for each row's current status (no-mutation observation case).\n- **Linked rule IDs**: R-LIFE-008\n- **Fixtures and inputs**: GET /tasks unfiltered (seeded tasks 1-4 span all four statuses).\n- **Observable assertions**: Row 1 shows only Start; row 2 only Submit; row 3 Approve+Reject; row 4 Reopen.\n- **Executable test IDs**: T-LIFE-009 (planned)\n=== specs/BULK.md ===\n# BULK — specifications\n\n## S-BULK-001\n- **ID**: S-BULK-001\n- **EARS statement**: WHEN action=bulkClose is posted with no ids, THE SYSTEM SHALL redirect to /tasks without modifying any task.\n- **Linked rule IDs**: R-BULK-001\n- **Fixtures and inputs**: POST /tasks/action action=bulkClose.\n- **Observable assertions**: 302 /tasks; API readback identical before/after.\n- **Executable test IDs**: T-BULK-001 (planned)\n\n## S-BULK-002\n- **ID**: S-BULK-002\n- **EARS statement**: WHEN action=bulkClose is posted with selected ids, THE SYSTEM SHALL set all selected non-DONE tasks to DONE in one update and redirect; WHEN any id is non-numeric, THE SYSTEM SHALL respond HTTP 500 without changing anything.\n- **Linked rule IDs**: R-BULK-002\n- **Fixtures and inputs**: (a) ids=1&ids=2; (b) ids=1&ids=abc.\n- **Observable assertions**: (a) 302; tasks 1,2 DONE in readback; (b) 500; both unchanged.\n- **Executable test IDs**: T-BULK-002 (planned)\n\n## S-BULK-003\n- **ID**: S-BULK-003\n- **EARS statement**: WHEN the bulkClose selection mixes statuses including DONE, THE SYSTEM SHALL close the non-DONE rows and leave DONE rows untouched, reporting nothing (mixed-state boundary).\n- **Linked rule IDs**: R-BULK-003\n- **Fixtures and inputs**: ids=3&ids=4 (task 3 PENDING_APPROVAL, task 4 DONE).\n- **Observable assertions**: 302; task 3 DONE, task 4 still DONE with unchanged updated_at.\n- **Executable test IDs**: T-BULK-003 (planned)\n\n## S-BULK-004\n- **ID**: S-BULK-004\n- **EARS statement**: WHEN a MEMBER posts action=bulkClose containing a PENDING_APPROVAL task, THE SYSTEM SHALL close it without a 403 (observed approval bypass, defect D-002 — expected per approval policy: 403).\n- **Linked rule IDs**: R-BULK-004, R-AUTH-008\n- **Fixtures and inputs**: Login as dev (MEMBER); POST action=bulkClose&ids=3.\n- **Observable assertions**: 302; task 3 DONE in readback; no 403 anywhere.\n- **Executable test IDs**: T-BULK-004 (planned)\n\n## S-BULK-005\n- **ID**: S-BULK-005\n- **EARS statement**: WHEN the task list renders, THE SYSTEM SHALL provide one bulkClose form with per-row checkboxes (render-only, no-mutation case).\n- **Linked rule IDs**: R-BULK-005\n- **Fixtures and inputs**: GET /tasks.\n- **Observable assertions**: form with hidden action=bulkClose; one checkbox name=ids value=\u003ctask id> per row; \"Close selected (bulk)\" button.\n- **Executable test IDs**: T-BULK-005 (planned)\n=== specs/QUERY.md ===\n# QUERY — specifications\n\n## S-QUERY-001\n- **ID**: S-QUERY-001\n- **EARS statement**: WHEN GET /tasks is requested with no filters, THE SYSTEM SHALL list every task ordered by updated_at descending (default sort), newest first.\n- **Linked rule IDs**: R-QUERY-001, R-QUERY-004\n- **Fixtures and inputs**: GET /tasks (seeded tasks 1-4 with staggered updated_at 09:00,12:00,15:00,18:00 — seed.sql:59-63).\n- **Observable assertions**: HTTP 200; row order 4,3,2,1 by default; all columns populated; task 4 due cell blank.\n- **Executable test IDs**: T-QUERY-001 (planned)\n\n## S-QUERY-002\n- **ID**: S-QUERY-002\n- **EARS statement**: WHEN GET /tasks?status=\u003cone of the four statuses>, THE SYSTEM SHALL list only tasks in that status; WHEN status is empty THE SYSTEM SHALL list all; WHEN status is unknown THE SYSTEM SHALL list none and return 200 (no error).\n- **Linked rule IDs**: R-QUERY-002\n- **Fixtures and inputs**: status=DONE; status=; status=BOGUS.\n- **Observable assertions**: Only task 4 / all tasks / empty table respectively.\n- **Executable test IDs**: T-QUERY-002 (planned)\n\n## S-QUERY-003\n- **ID**: S-QUERY-003\n- **EARS statement**: WHEN GET /tasks?assignee=\u003cid>, THE SYSTEM SHALL list only tasks assigned to that person; WHEN assignee is empty, all tasks; WHEN non-numeric, HTTP 500.\n- **Linked rule IDs**: R-QUERY-003\n- **Fixtures and inputs**: assignee=3 (tasks 1,2 seeded); assignee=; assignee=abc.\n- **Observable assertions**: Rows 1,2 only / all / 500.\n- **Executable test IDs**: T-QUERY-003 (planned)\n\n## S-QUERY-004\n- **ID**: S-QUERY-004\n- **EARS statement**: WHEN GET /tasks?sort=status, THE SYSTEM SHALL order rows by status then updated_at DESC; combined filters AND together (e.g. status=PENDING_APPROVAL&assignee=3).\n- **Linked rule IDs**: R-QUERY-004, R-QUERY-002, R-QUERY-003\n- **Fixtures and inputs**: sort=status; then status=PENDING_APPROVAL&assignee=3.\n- **Observable assertions**: Deterministic order for the seed set; combined query returns exactly task 3.\n- **Executable test IDs**: T-QUERY-004 (planned)\n\n## S-QUERY-005\n- **ID**: S-QUERY-005\n- **EARS statement**: WHEN GET /tasks?sort=priority, THE SYSTEM SHALL order HIGH before MEDIUM before LOW (semantic CASE order, not alphabetical), updated_at DESC within a group.\n- **Linked rule IDs**: R-QUERY-004\n- **Fixtures and inputs**: sort=priority over seeded tasks (HIGH 1,2; MEDIUM 3; LOW 4).\n- **Observable assertions**: Row order 1,2,3,4 (HIGH group newest-first).\n- **Executable test IDs**: T-QUERY-005 (planned)\n\n## S-QUERY-006\n- **ID**: S-QUERY-006\n- **EARS statement**: WHEN sort is due, due_date, title, or id, THE SYSTEM SHALL apply the matching whitelisted clause; WHEN sort is unknown, THE SYSTEM SHALL silently use the default updated_at DESC with HTTP 200.\n- **Linked rule IDs**: R-QUERY-004\n- **Fixtures and inputs**: sort=due; sort=due_date; sort=title; sort=id; sort=BOGUS.\n- **Observable assertions**: Task 3 (earliest due 2026-06-10) first under due; title order; id ascending; BOGUS behaves like default with no error.\n- **Executable test IDs**: T-QUERY-006 (planned)\n\n## S-QUERY-007\n- **ID**: S-QUERY-007\n- **EARS statement**: WHEN the default sort is in effect after a mutation, THE SYSTEM SHALL show the mutated task first (updated_at refreshed on write).\n- **Linked rule IDs**: R-QUERY-001, R-LIFE-001\n- **Fixtures and inputs**: POST action=start&id=1 then GET /tasks.\n- **Observable assertions**: Task 1 appears at the top of the list.\n- **Executable test IDs**: T-QUERY-007 (planned)\n\n## S-QUERY-008\n- **ID**: S-QUERY-008\n- **EARS statement**: WHEN the task list renders, THE SYSTEM SHALL show the filter/sort toolbar with the six whitelisted sort options and reflect the current selection (render-only).\n- **Linked rule IDs**: R-QUERY-005\n- **Fixtures and inputs**: GET /tasks?sort=priority&status=OPEN.\n- **Observable assertions**: Priority option selected; OPEN option selected; options list exactly updated/status/priority/due/title/id.\n- **Executable test IDs**: T-QUERY-008 (planned)\n=== specs/API.md ===\n# API — specifications\n\n## S-API-001\n- **ID**: S-API-001\n- **EARS statement**: WHEN GET /api/tasks is requested without any session, THE SYSTEM SHALL return HTTP 200 application/json with the task array (access-exemption case).\n- **Linked rule IDs**: R-API-001\n- **Fixtures and inputs**: Fresh anonymous client; GET /api/tasks.\n- **Observable assertions**: 200; Content-Type application/json; body is a JSON array of 4 seeded tasks.\n- **Executable test IDs**: T-API-001 (planned)\n\n## S-API-002\n- **ID**: S-API-002\n- **EARS statement**: WHEN GET /api/tasks?status=\u003cvalid status>, THE SYSTEM SHALL return only matching tasks; WHEN status is empty or absent, all tasks; WHEN status is unknown, an empty array with HTTP 200; assignee/sort params are ignored.\n- **Linked rule IDs**: R-API-002\n- **Fixtures and inputs**: status=DONE; status=; status=BOGUS; assignee=3&sort=title.\n- **Observable assertions**: [task 4] / [4 tasks] / [] / [4 tasks].\n- **Executable test IDs**: T-API-002 (planned)\n\n## S-API-003\n- **ID**: S-API-003\n- **EARS statement**: WHEN the API returns a task, THE SYSTEM SHALL include exactly the fields id,title,status,priority,assigneeId,projectId,dueDate,updatedAt and no description.\n- **Linked rule IDs**: R-API-003\n- **Fixtures and inputs**: GET /api/tasks.\n- **Observable assertions**: Every object has exactly those 8 keys; updatedAt matches /^\\d{4}-\\d{2}-\\d{2} \\d{2}:\\d{2}:\\d{2}$/.\n- **Executable test IDs**: T-API-003 (planned)\n\n## S-API-004\n- **ID**: S-API-004\n- **EARS statement**: WHEN a task has NULL assignee_id or due_date, THE SYSTEM SHALL emit JSON null for assigneeId/dueDate (null-handling case).\n- **Linked rule IDs**: R-API-004\n- **Fixtures and inputs**: GET /api/tasks (seed task 4: assignee 1... actually assignee_id=1, due_date NULL — for a NULL assignee, unassign task 4 via the form first).\n- **Observable assertions**: Task 4 object contains \"dueDate\":null; after unassigning, \"assigneeId\":null; body parses as JSON.\n- **Executable test IDs**: T-API-004 (planned)\n\n## S-API-005\n- **ID**: S-API-005\n- **EARS statement**: WHEN an exposed string contains a double quote or backslash, THE SYSTEM SHALL escape it and the body stays valid JSON; WHEN it contains a newline or control char, THE SYSTEM SHALL emit it raw and the body ceases to be valid JSON (observed defect, escaping boundary).\n- **Linked rule IDs**: R-API-005\n- **Fixtures and inputs**: POST /tasks/form title=Quote\"Test&projectId=1 -> GET /api/tasks parses; POST title=Line1\\nLine2 (literal newline) -> GET /api/tasks fails JSON parse.\n- **Observable assertions**: First body parses and title round-trips; second body contains a raw line break inside a string token.\n- **Executable test IDs**: T-API-005 (planned)\n=== specs/DATA.md ===\n# DATA — specifications\n\n## S-DATA-001\n- **ID**: S-DATA-001\n- **EARS statement**: WHEN the application starts, THE SYSTEM SHALL wait for the external database (retrying ~30s) and SHALL NOT create or alter any schema itself.\n- **Linked rule IDs**: R-DATA-001\n- **Fixtures and inputs**: Deployment against a schema-loaded Postgres (schema.sql+seed.sql+oracle-ro.sql).\n- **Observable assertions**: App serves requests once DB is up; task/project/person tables pre-exist with seed rows; no DDL from the app side.\n- **Executable test IDs**: T-DATA-001 (planned)\n\n## S-DATA-002\n- **ID**: S-DATA-002\n- **EARS statement**: WHEN login credentials match a seeded person row (plaintext compare), THE SYSTEM SHALL authenticate all four roles; anything else is refused with \"Invalid credentials\".\n- **Linked rule IDs**: R-DATA-002, R-AUTH-003, R-AUTH-004\n- **Fixtures and inputs**: POST /login for admin/admin, mgr/mgr, dev/dev, view/view; one wrong-password case.\n- **Observable assertions**: Four 302s to /tasks; failure case 200 with error text.\n- **Executable test IDs**: T-DATA-002 (planned)\n\n## S-DATA-003\n- **ID**: S-DATA-003\n- **EARS statement**: WHEN a project is created via the web, THE SYSTEM SHALL store state ACTIVE; WHEN archived, THE SYSTEM SHALL move it to ARCHIVED with no forward path back (DB CHECK + WHERE state='ACTIVE').\n- **Linked rule IDs**: R-DATA-003, R-PROJ-002, R-PROJ-004\n- **Fixtures and inputs**: Create then archive one project; re-archive it.\n- **Observable assertions**: state transitions ACTIVE->ARCHIVED only; second archive is a silent no-op.\n- **Executable test IDs**: T-DATA-003 (planned)\n\n## S-DATA-004\n- **ID**: S-DATA-004\n- **EARS statement**: WHEN a task write violates a column constraint (width, CHECK, FK, NOT NULL), THE SYSTEM SHALL surface HTTP 500 through the servlet and leave the table unchanged (constraint-backstop case).\n- **Linked rule IDs**: R-DATA-004, R-FORM-005, R-FORM-010\n- **Fixtures and inputs**: priority=URGENT; title 257 chars; assigneeId=9999; projectId=999.\n- **Observable assertions**: All HTTP 500; row counts unchanged.\n- **Executable test IDs**: T-DATA-004 (planned)\n\n## S-DATA-005\n- **ID**: S-DATA-005\n- **EARS statement**: WHEN tasks are read back, THE SYSTEM SHALL map NULL assignee_id/due_date to nulls, expose joined assigneeName/projectName for display, and truncate updated_at to whole seconds.\n- **Linked rule IDs**: R-DATA-005\n- **Fixtures and inputs**: GET /tasks and GET /api/tasks after unassigning task 4.\n- **Observable assertions**: Task 4: unassigned display, dueDate null in API, updatedAt with 19-char format.\n- **Executable test IDs**: T-DATA-005 (planned)\n\n## S-DATA-006\n- **ID**: S-DATA-006\n- **EARS statement**: WHEN any task mutation runs (create/update/updateStatus/bulkClose), THE SYSTEM SHALL refresh updated_at; field-editing updates SHALL NOT change status and status updates SHALL NOT change fields.\n- **Linked rule IDs**: R-DATA-006, R-FORM-008, R-LIFE-001\n- **Fixtures and inputs**: Edit task 1 fields; then start it.\n- **Observable assertions**: updated_at advances on both writes; status unchanged by the edit, fields unchanged by start (readback compare).\n- **Executable test IDs**: T-DATA-006 (planned)\n\n## S-DATA-007\n- **ID**: S-DATA-007\n- **EARS statement**: (technical coverage) WHEN TaskDao.updateStatus is called directly, THE SYSTEM SHALL write any status without guard — inventory-only observation; no web-observable assertion.\n- **Linked rule IDs**: R-DATA-007\n- **Fixtures and inputs**: Java-level D ., add a reconciliation table (provisional ear → accepted analyst S-IDs) inside build_mapping.py, and after generating from docstrings, replace \"ear\" with the accepted S-ID(s), add \"earProvisional\" maybe, and add \"conflicts\" where observed behavior contradicts the analyst spec.\n\nWait, but the dispatch says \"Update tests/build_mapping.py docstrings only if trivially mechanical (S-ACT-→S-LIFE-, S-LIST-→S-QUERY-); otherwise mapping.json entries alone are fine.\" — this suggests the intended approach was: if the mapping were 1:1 aligned, just sed the docstrings; since it isn't, edit mapping.json entries. But then \"rerun build_mapping.py\" would clobber. Unless the rerun is meant to verify the generator still works and the count is right, and then... hmm.\n\nActually, let me reconsider. Maybe the intended flow is:\n\n- Rerun build_mapping.py (which regenerates mapping.json from docstrings with provisional ids),\n- then apply a reconciliation step.\n\nThe most robust approach: put the reconciliation INTO build_mapping.py as a data table + post-processing step, so that rerunning build_mapping.py produces the reconciled mapping.json deterministically and it can never drift. This satisfies both \"rerun build_mapping.py\" and \"mapping.json contains accepted S-IDs\". And it avoids editing 129 test docstrings (which would be error-prone and definitely not \"trivially mechanical\" given non-aligned numbering).\n\nI think that's the right engineering call: extend build_mapping.py with a RECONCILIATION dict mapping provisional ear → {\"ears\": [accepted S-IDs...], \"conflicts\": [...] optional}. Then the generator applies it. The \"statement\" and \"kind\" stay as generated from docstrings.\n\nAlso update the \"provisional\" flag / note in mapping.json to reflect reconciliation status. Let me design the output entry:\n\n```json\n{\n  \"test\": \"test_task_actions.TaskLifecycleTests.test_s_act_001_start_moves_open_task_to_in_progress_and_redirects_to_list\",\n  \"ear\": lic — noted as intended-by-comment (ApiTaskServlet.java:14-17) but security-relevant.\n- **Linked EARS IDs**: S-AUTH-001, S-AUTH-002\n\n## R-AUTH-002\n- **ID**: R-AUTH-002\n- **Statement**: A request to a non-exempt path with no session or no `user` session attribute is redirected (302) to `\u003cctx>/login`.\n- **Source citations**: AuthFilter.java:33-38\n- **Actors and preconditions**: Unauthenticated client; any path other than the R-AUTH-001 exemptions (e.g. `/tasks`, `/projects`, `/logout`, `/tasks/form`, `/tasks/action`).\n- **Trigger**: `getSession(false)` returns null or the `user` attribute is absent.\n- **Effects or refusal**: HTTP 302 to `/login`; no servlet runs; no mutation.\n- **Observed versus intended**: Observed.\n- **Linked EARS IDs**: S-AUTH-003\n\n## R-AUTH-003\n- **ID**: R-AUTH-003\n- **Statement**: POST `/login` with `username`/`password` matching a `person` row (plaintext comparison inside the SQL WHERE clause) stores the Person in a new session as `user` and redirects to `/tasks`.\n- **Source citations**: LoginServlet.java:23-35; PersonDao.java:16-29\n- **Actors and preconditions**: Any client; credentials for a seeded user (admin/admin, mgr/mgr, dev/dev, view/view — seed.sql:44-48).\n- **Trigger**: Valid POST /login credentials.\n- **Effects or refusal**: HTTP 302 to `\u003cctx>/tasks`; session attribute `user` set (`getSession(true)`); no DB write.\n- **Observed versus intended**: Observed. Plaintext password comparison (PersonDao.java:18) is a legacy security smell (defect candidate D-007).\n- **Linked EARS IDs**: S-AUTH-004\n\n## R-AUTH-004\n- **ID**: R-AUTH-004\n- **Statement**: POST `/login` with unknown/invalid credentials re-renders login.jsp with error message \"Invalid credentials\" at HTTP 200.\n- **Source citations**: LoginServlet.java:28-31; login.jsp:20\n- **Actors and preconditions**: Any client.\n- **Trigger**: `people.authenticate(...)` returns null.\n- **Effects or refusal**: No session created; no redirect; error paragraph rendered.\n- **Observed versus intended**: Observed.\n- **Linked EARS IDs**: S-AUTH-005\n\n## R-AUTH-005\n- **ID**: R-AUTH-005\n- **Statement**: GET `/login` forwards to login.jsp (username/password form posting back to `/login`).\n- **Source citations**: LoginServlet.java:17-20; login.jsp:22-32\n- **Actors and preconditions**: Any client.\n- **Trigger**: GET /login.\n- **Effects or refusal**: Login form rendered; no mutation.\n- **Observed versus intended**: Observed.\n- **Linked EARS IDs**: S-AUTH-006\n\n## R-AUTH-006\n- **ID**: R-AUTH-006\n- **Statement**: GET `/logout` invalidates the existing session (if any) and redirects to `/login`.\n- **Source citations**: LogoutServlet.java:12-18\n- **Actors and preconditions**: Authenticated (or anonymous) client; must pass AuthFilter (not exempt).\n- **Trigger**: GET /logout.\n- **Effects or refusal**: Session invalidated; subsequent access to protected paths redirects to /login; no DB write.\n- **Observed versus intended**: Observed. GET-based logout is a CSRF/logout-trick candidate (defect D-008).\n- **Linked EARS IDs**: S-AUTH-007\n\n## R-AUTH-007\n- **ID**: R-AUTH-007\n- **Statement**: Only ADMIN or MANAGER may perform `approve` or `reject` on `/tasks/action`; other roles get HTTP 403. Enforced twice: in AuthFilter and again in TaskActionServlet.requireApprover.\n- **Source citations**: AuthFilter.java:40-46; TaskActionServlet.java:91-98; Role.java:12-14\n- **Actors and preconditions**: Authenticated session user with role MEMBER or VIEWER (or a null user reaching the servlet directly).\n- **Trigger**: POST /tasks/action with action=approve or action=reject.\n- **Effects or refusal**: HTTP 403 \"Only managers or admins may approve or reject tasks\" (filter) / \"Approval requires a manager or admin\" (servlet); no status change.\n- **Observed versus intended**: Observed. This is the ONLY role-gated action in the app — do not generalize it to other paths.\n- **Linked EARS IDs**: S-AUTH-008, S-LIFE-005, S-LIFE-006\n\n## R-AUTH-008\n- **ID**: R-AUTH-008\n- **Statement**: There is no role restriction on any action other than approve/reject: task create/edit, start/submit/reopen, bulkClose, project create/archive are all available to every authenticated role including VIEWER.\n- **Source citations**: ProjectServlet.java:31-51 (no role checks); TaskFormServlet.java:38-75 (no role checks); TaskActionServlet.java:23-74 (only requireApprover gates approve/reject); AuthFilter.java:40-46 (only approve/reject gate)\n- **Actors and preconditions**: Any authenticated user of any role.\n- **Trigger**: Any mutation POST listed above.\n- **Effects or refusal**: Action executes normally; no refusal based on role.\n- **Observed versus intended**: Observed. Explicitly do NOT infer a read-only policy for VIEWER from its name or from the approval policy — cite this rule instead.\n- **Linked EARS IDs**: S-AUTH-009, S-BULK-004\n\n## R-AUTH-009\n- **ID**: R-AUTH-009\n- **Statement**: The authenticated pages display the session user's full name and role in the top nav, plus a logout link.\n- **Source citations**: _header.jspf:49-53\n- **Actors and preconditions**: Authenticated user viewing any authenticated JSP.\n- **Trigger**: Page render.\n- **Effects or refusal**: `${sessionScope.user.fullName} (${sessionScope.user.role})` and Logout link rendered.\n- **Observed versus intended**: Observed.\n- **Linked EARS IDs**: S-AUTH-010\n=== rules/PROJ.md ===\n# PROJ — projects list / create / archive / validation\n\n## R-PROJ-001\n- **ID**: R-PROJ-001\n- **Statement**: GET `/projects` lists ALL projects (ACTIVE and ARCHIVED) ordered by name, joined with owner full name, and forwards projects.jsp.\n- **Source citations**: ProjectServlet.java:23-28; ProjectDao.java:19-31 (`ORDER BY p.name`); projects.jsp:135-156\n- **Actors and preconditions**: Authenticated user.\n- **Trigger**: GET /projects.\n- **Effects or refusal**: HTTP 200 table with id/name/description/state/owner; no mutation.\n- **Observed versus intended**: Observed.\n- **Linked EARS IDs**: S-PROJ-001\n\n## R-PROJ-002\n- **ID**: R-PROJ-002\n- **Statement**: POST `/projects` with `action=archive&id=\u003cn>` sets state='ARCHIVED' only where state is currently 'ACTIVE'; for an unknown id or an already-ARCHIVED project the UPDATE matches zero rows and the servlet still redirects with no error.\n- **Source citations**: ProjectServlet.java:33-37; ProjectDao.java:75-84\n- **Actors and preconditions**: Authenticated user (any role — no gate, see R-AUTH-008).\n- **Trigger**: POST /projects action=archive.\n- **Effects or refusal**: project.state -> ARCHIVED (forward-only; no unarchive path exists anywhere in source); 302 /projects; silent no-op when target is not ACTIVE.\n- **Observed versus intended**: Observed. Silent no-op on unknown id is observed behavior; intended behavior is unstated in source — flagged as a gap.\n- **Linked EARS IDs**: S-PROJ-002, S-PROJ-003\n\n## R-PROJ-003\n- **ID**: R-PROJ-003\n- **Statement**: POST `/projects` archive with a missing or non-numeric `id` throws NumberFormatException -> HTTP 500.\n- **Source citations**: ProjectServlet.java:34 (`Long.parseLong(req.getParameter(\"id\"))`)\n- **Actors and preconditions**: Authenticated user.\n- **Trigger**: POST /projects action=archive without id, or id=abc.\n- **Effects or refusal**: HTTP 500; no state change.\n- **Observed versus intended**: Observed; refusal path is unhandled (defect candidate D-005 family).\n- **Linked EARS IDs**: S-PROJ-004\n\n## R-PROJ-004\n- **ID**: R-PROJ-004\n- **Statement**: POST `/projects` (no action param) creates a project: name required, blank/null after trim -> HTTP 400 \"Project name is required\"; otherwise name is trimmed and inserted with state 'ACTIVE' and ownerId = session user's id; 302 /projects on success.\n- **Source citations**: ProjectServlet.java:38-50; ProjectDao.java:57-72 (`VALUES (?, ?, 'ACTIVE', ?)`)\n- **Actors and preconditions**: Authenticated user of any role.\n- **Trigger**: POST /projects with name.\n- **Effects or refusal**: New project row (state ACTIVE, owner = current user); 302 /projects; HTTP 400 refusal on blank name.\n- **Observed versus intended**: Observed. Note no name-length pre-check; a name > 128 chars hits the DB VARCHAR(128) and surfaces as HTTP 500 (schema.sql:20).\n- **Linked EARS IDs**: S-PROJ-005, S-PROJ-006\n\n## R-PROJ-005\n- **ID**: R-PROJ-005\n- **Statement**: Project `description` is stored as-submitted: absent -> NULL, blank -> empty string; it is never trimmed and never length-checked in the servlet.\n- **Source citations**: ProjectServlet.java:47; ProjectDao.java:61-62; schema.sql:21 (VARCHAR(1024) NULL)\n- **Actors and preconditions**: Authenticated user.\n- **Trigger**: POST /projects with/without description.\n- **Effects or refusal**: NULL vs '' observable in projects.jsp description column.\n- **Observed versus intended**: Observed.\n- **Linked EARS IDs**: S-PROJ-006\n\n## R-PROJ-006\n- **ID**: R-PROJ-006\n- **Statement**: projects.jsp renders the Archive button only for ACTIVE projects and always renders a \"Delete\" link targeting `/projects/delete?id=\u003cn>` — but no servlet is mapped to `/projects/delete`, so the link yields HTTP 404.\n- **Source citations**: projects.jsp:145-151 (Archive), projects.jsp:152 (Delete link); web.xml:71-78 (only `/projects` is mapped)\n- **Actors and preconditions**: Authenticated user viewing /projects.\n- **Trigger**: Clicking Delete (GET /projects/delete).\n- **Effects or refusal**: HTTP 404 from the container; no mutation.\n- **Observed versus intended**: OBSERVED: dead affordance returning 404. INTENDED: presumably deletion or no link. Defect candidate D-001 with reproducible case.\n- **Linked EARS IDs**: S-PROJ-007\n\n## R-PROJ-007\n- **ID**: R-PROJ-007\n- **Statement**: Archiving a project does NOT restrict any task operation on it: the task form validates project existence only (`exists` matches any id regardless of state), so tasks can be created in and edited while belongin dated` (default) updated_at DESC; `status` status then updated_at DESC; `priority` semantic HIGH>MEDIUM>LOW via CASE (NOT alphabetical) then updated_at DESC; `due` and `due_date` due_date then updated_at DESC (NULLs sort per DB ordering); `title` title then id; `id` id. Any other token silently falls back to the default.\n- **Source citations**: TaskDao.java:56,154-172 (each branch cited: 155-157, 158-161, 162-164, 165-167, 168-170, 171); TaskListServlet.java:36 (sortBy attr)\n- **Actors and preconditions**: Authenticated user.\n- **Trigger**: GET /tasks?sort=\u003ctoken>, alone or combined with status/assignee.\n- **Effects or refusal**: Deterministic ordering per token; no mutation; unknown token = default order, no error.\n- **Observed versus intended**: Observed. Sort token never concatenated from user input (injection-safe by whitelist, TaskDao.java:55-56).\n- **Linked EARS IDs**: S-QUERY-004, S-QUERY-005, S-QUERY-006, S-QUERY-007\n\n## R-QUERY-005\n- **ID**: R-QUERY-005\n- **Statement**: The JSP renders the filter/sort toolbar with auto-submit selects: status options (all) + the four statuses; sort options exactly updated/status/priority/due/title/id; the selected option mirrors the served `sortBy` attribute (raw sort param echoed into the comparison only).\n- **Source citations**: tasks.jsp:15-35; TaskListServlet.java:35-36\n- **Actors and preconditions**: Authenticated user.\n- **Trigger**: GET /tasks render.\n- **Effects or refusal**: Toolbar state reflects current query; no mutation.\n- **Observed versus intended**: Observed.\n- **Linked EARS IDs**: S-QUERY-008\n\n## R-QUERY-006\n- **ID**: R-QUERY-006\n- **Statement**: The task list table renders per row: checkbox, id, linked title (link to /tasks/form?id=), project name, assignee name, status, priority, due date, updatedAt, and transition buttons; assignee/due render blank when NULL (display join via LEFT JOIN person).\n- **Source citations**: tasks.jsp:40-72; TaskDao.java:15-20 (LEFT JOIN), 227-233 (null h round-trip correctly.\n- **Observed versus intended**: OBSERVED: quote/backslash safe, control chars/HTML not. INTENDED: spec-level JSON correctness. Defect candidate — reproducible case in findings/ledger.json.\n- **Linked EARS IDs**: S-API-005\n=== rules/DATA.md ===\n# DATA — database constraints / DAO mappings / technical & unreachable branches\n\n## R-DATA-001\n- **ID**: R-DATA-001\n- **Statement**: The schema (three tables, identity PKs) is owned by the Postgres container init, not the app: the app only waits for connectivity (30 x 1s retries, then RuntimeException).\n- **Source citations**: schema.sql:1-7; Database.java:12-14,42-59; BootstrapListener.java:10-13\n- **Actors and preconditions**: Container orchestration; app startup.\n- **Trigger**: contextInitialized.\n- **Effects or refusal**: App refuses to start if DB unreachable after ~30s; never creates or migrates tables.\n- **Observed versus intended**: Observed.\n- **Linked EARS IDs**: S-DATA-001\n\n## R-DATA-002\n- **ID**: R-DATA-002\n- **Statement**: `person`: username VARCHAR(64) NOT NULL UNIQUE, full_name VARCHAR(128) NOT NULL, password VARCHAR(128) NOT NULL, role CHECK in (ADMIN,MANAGER,MEMBER,VIEWER). Seeded: admin/mgr/dev/view with passwords equal to usernames.\n- **Source citations**: schema.sql:9-16; seed.sql:44-48; Role.java:7-11\n- **Actors and preconditions**: DB init.\n- **Trigger**: Any person write outside these bounds.\n- **Effects or refusal**: Constraint violation -> SQLException -> RuntimeException -> HTTP 500 via the calling servlet.\n- **Observed versus intended**: Observed. Passwords stored/compared in plaintext (PersonDao.java:18) — legacy smell, defect D-008.\n- **Linked EARS IDs**: S-DATA-002, S-AUTH-004\n\n## R-DATA-003\n- **ID**: R-DATA-003\n- **Statement**: `project`: name VARCHAR(128) NOT NULL, description VARCHAR(1024) NULL, state NOT NULL DEFAULT 'ACTIVE' CHECK (ACTIVE,ARCHIVED), owner_id NOT NULL FK -> person. The servlet forces 'ACTIVE' on create; only archive() writes ter), so a mechanical S-ACT-→S-LIFE- / S-LIST-→S-QUERY- rename would\n  have produced wrong mappings. Instead the reconciliation table lives in\n  `tests/build_mapping.py` (keyed by full test id — provisional ids are not unique,\n  e.g. two S-PROJ-009s) and `python3 tests/build_mapping.py` regenerates the\n  reconciled mapping.json deterministically, with drift guards: it fails if a\n  discovered test has no reconciliation entry, if the table has stale entries, or if\n  any accepted id is outside the spec universe (AUTH 1-10, PROJ 1-8, FORM 1-10,\n  LIFE 1-9, BULK 1-5, QUERY 1-8, API 1-5, DATA 1-8).\n- Note: the dispatch's family tallies (AUTH 9, PROJ 7, FORM 9, QUERY 6) undercount\n  the actual accepted specs (AUTH 10, PROJ 8, FORM 10, QUERY 8); the spec files are\n  authoritative and were used as-is.\n\n## 3. Conflicts (observed behavior vs accepted spec — tests NOT changed)\nBoth are spec-text/seed discrepancies, not app defects; the passing tests assert the\napp's actual output. Flagged per-entry in mapping.json (`conflicts`) and adjudication\nis requested.\n\n1. **S-QUERY-003** (test_s_list_018_assignee_filter_returns_that_users_tasks_only):\n   S-QUERY-003's fixtures/observables say `assignee=3` matches \"tasks 1,2\" →\n   \"Rows 1,2 only\", but `seed.sql:18-20` assigns tasks 1, 2 **and 3** to person 3.\n   The app returns [3, 2, 1] (updated DESC), which the test asserts and which passes.\n   The EARS statement itself (\"only tasks assigned to that person\") is not\n   contradicted — only the enumerated seed row set.\n2. **S-QUERY-005** (test_s_list_004_sort_priority_is_semantic_high_medium_low):\n   S-QUERY-005's observable enumerates \"Row order 1,2,3,4 (HIGH group newest-first)\",\n   internally inconsistent with its own EARS statement (\"updated_at DESC within a\n   group\"): seed task 2 (12:00) is newer than task 1 (09:00) within the HIGH group,\n   so the app returns and the test asserts [2, 1, 3, 4].\n\n## 4. Tests with no matching accepted spec (ear=nu
