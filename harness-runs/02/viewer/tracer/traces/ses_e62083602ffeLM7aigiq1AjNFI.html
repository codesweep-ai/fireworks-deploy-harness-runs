:   \"mapping\": \"reports/tests/mapping.json\",\n35:   \"inventory\": \"rules/app-inventory.json\",\n36:   \"findings\": \"findings/ledger.json\",\n37:   \"runSummary\": \"reports/run-summary.json\",\n38:   \"continuationPolicy\": \"preserve existing IDs; add new stable IDs; retain supersession or correction rationale\"\n39: }\n\n(End of file - total 39 lines)\n\u003c/content>","isError":false,"ts":"2026-11-02T20:33:55.064Z","durationMs":15},"tokens":{"input":2801,"output":97,"reasoning":313,"cacheRead":8192,"cacheWrite":0},"reportedCostUSD":0.00785532,"i":13,"workMs":15},{"kind":"meta","ts":"2026-11-02T20:33:55.069Z","text":"step finish — tool-calls","i":14},{"kind":"thinking","ts":"2026-11-02T20:33:56.435Z","text":"Now let me read the inherited artifacts: `rules/R-APR.md`, `specs/S-APR.md`, `findings/ledger.json`, `reports/tests/mapping.json`, `tests/test_approval_slice.py`, `history/01/reports/run-summary.json`.","startTs":"2026-11-02T20:33:56.116Z","i":15,"workMs":1371},{"kind":"tool_call","ts":"2026-11-02T20:33:56.565Z","tool":{"name":"read","callId":"chatcmpl-tool-9aeccdfd08b11e60","input":{"filePath":"/home/rishi/outputs/rules/R-APR.md"},"command":"home/rishi/outputs/rules/R-APR.md"},"result":{"text":"\u003cpath>/home/rishi/outputs/rules/R-APR.md\u003c/path>\n\u003ctype>file\u003c/type>\n\u003ccontent>\n1: # Approval-slice rules — task-tracker-demo @ eee783057ec28d28fb36ec05484de9b4b40ceb9c (frozen ~/app)\n2: \n3: Slice: `approve`/`reject` on `POST /tasks/action`. All paths relative to `src/main/java/com/acme/tracker/` unless noted. Current behavior only; no intended-policy claims.\n4: \n5: ## R-APR-001 — Filter-level approver gate on /tasks/action\n6: - **Source:** `web/AuthFilter.java:40-47` (mapped to `/*` by `src/main/webapp/WEB-INF/web.xml:20-23`)\n7: - **Actors:** any authenticated user (session attribute `user` non-null; unauthenticated is handled earlier at `AuthFilter.java:33-38` by 302 redirect to `/login`).\n8: - **Preconditions:** request reached the filter; path is `/tasks/action` (not one of the `/login`, `/api/*`, `*.css` exemptions at `AuthFilter.java:28-31`); user authenticated.\n9: - **Trigger:** `POST /tasks/action` with `action` = `approve` or `reject`.\n10: - **Effects:** if `user.getRole().canApprove()` is false → `403 Forbidden`, body message `\"Only managers or admins may approve or reject tasks\"`; request never reaches the servlet. Otherwise chain continues.\n11: - **Refusal behavior:** 403, no DB write (filter runs before any DAO call).\n12: - **Confidence:** high (direct code). Ambiguity: none.\n13: \n14: ## R-APR-002 — Servlet-level approver re-check (defense-in-depth duplicate)\n15: - **Source:** `web/TaskActionServlet.java:91-98` (`requireApprover`), invoked at `:49` (approve) and `:54` (reject).\n16: - **Actors/preconditions:** user already passed the filter (authenticated) AND task `id` parsed and found (404 at `:31-36` happens first).\n17: - **Trigger:** approve/reject switch cases.\n18: - **Effects:** if `user == null || !user.getRole().canApprove()` → `403`, message `\"Approval requires a manager or admin\"`.\n19: - **Refusal behavior:** 403, no DB write (checked before `guard` and `updateStatus`).\n20: - **Confidence:** high. **Disagreement record (filter vs servlet):** the two layers use the *same predicate* (`Role.canApprove()`) but different messages, and the filter fires first on every normal route to `/tasks/action` (no exemption covers it), so the servlet's 403 message is unreachable through the standard route. No outcome-level disagreement — only duplicated enforcement and divergent refusal text. Also note check **ordering**: existence (404) precedes the servlet role check, but the filter role check precedes existence — so a non-approver probing a nonexistent id sees 403 (filter), not 404; an approver sees 404.\n21: \n22: ## R-APR-003 — Definition of \"may approve\" (the deciding code path)\n23: - **Source:** `model/Role.java:13-16` — `canApprove()` returns `this == ADMIN || this == MANAGER`.\n24: - **Actors:** roles ADMIN, MANAGER pass; MEMBER, VIEWER refuse. This is decided by this method (called from `AuthFilter.java:42` and `TaskActionServlet.java:93`), **not** inferred from role names.\n25: - **Preconditions/trigger:** n/a (pure predicate).\n26: - **Effects:** defines the approver set for R-APR-001/002.\n27: - **Refusal behavior:** n/a.\n28: - **Confidence:** high. Related but non-deciding: `db/schema.sql:14-15` CHECK only constrains `person.role` to the four legal values — it grants no approval rights and does not mirror `canApprove`.\n29: \n30: ## R-APR-004 — Starting-state guard: approve/reject require PENDING_APPROVAL\n31: - **Source:** `web/TaskActionServlet.java:48-57` (approve `:48-52`, reject `:53-57`) + `guard()` at `:100-109`; invoked at `:50` and `:55` with `expected = TaskStatus.PENDING_APPROVAL`.\n32: - **Actors:** any user who passed the approver checks (R-APR-001/002).\n33: - **Preconditions:** task exists; user is an approver.\n34: - **Trigger:** approve or reject on a task whose `status != 'PENDING_APPROVAL'`.\n35: - **Effects:** `409 Conflict`, message `\"Cannot \u003caction> a task in status \u003ccurrent> (expected PENDING_APPROVAL)\"`; no DB write.\n36: - **Refusal behavior:** 409; task row untouched (observable via oracle `SELECT id,status FROM task ORDER BY id`).\n37: - **Confidence:** high. Ambiguity: none.\n38: \n39: ## R-APR-005 — Transitions and persistence for successful approve/reject\n40: - **Source:** `web/TaskActionServlet.java:51` (approve → `TaskStatus.DONE`), `:56` (reject → `TaskStatus.IN_PROGRESS`); write via `dao/TaskDao.java:115-125` `updateStatus` — unconditional `UPDATE task SET status=?, updated_at=CURRENT_TIMESTAMP WHERE id=?`.\n41: - **Preconditions:** R-APR-001..004 all passed.\n42: - **Effects:** new status persisted; `updated_at` bumped; response `302` redirect to `/tasks` (or `/tasks/form?id=\u003cid>` when `return=detail`, `:66-73`).\n43: - **Refusal behavior:** n/a (success rule).\n44: - **Confidence:** high. **Note:** the status precondition lives *only* in the servlet; neither `updateStatus` SQL nor `db/schema.sql:33` (CHECK enumerates the four statuses, not transitions) enforces it. DAO/DB would accept any legal status from any current status — the guard is single-point in `TaskActionServlet`.\n45: \n46: ## Gaps (discovered, deliberately not expanded into this pilot)\n47: - **G-APR-001:** `bulkClose` (`web/TaskActionServlet.java:26-29, 76-88`; `dao/TaskDao.java:128-147`) sets any non-DONE task to DONE in one UPDATE with **no** `canApprove` check and **no** PENDING_APPROVAL guard — a MEMBER/VIEWER can reach DONE (approve-equivalent) via `POST /tasks/action?action=bulkClose&ids=…`. Out of slice; flagged for orchestrator.\n48: - **G-APR-002:** `Long.parseLong(req.getParameter(\"id\"))` at `TaskActionServlet.java:31` throws NumberFormatException (unhandled → 500) on missing/malformed `id`. Out of slice.\n49: - **G-APR-003:** `/api/*` is exempt from `AuthFilter` (`AuthFilter.java:28`) but `web/ApiTaskServlet.java` is GET-only read-back — no approval bypass there (verified).\n\n(End of file - total 49 lines)\n\u003c/content>","isError":false,"ts":"2026-11-02T20:33:56.576Z","durationMs":11},"i":16,"workMs":141},{"kind":"tool_call","ts":"2026-11-02T20:33:56.713Z","tool":{"name":"read","callId":"chatcmpl-tool-87b4901b5a59af6a","input":{"filePath":"/home/rishi/outputs/specs/S-APR.md"},"command":"home/rishi/outputs/specs/S-APR.md"},"result":{"text":"\u003cpath>/home/rishi/outputs/specs/S-APR.md\u003c/path>\n\u003ctype>file\u003c/type>\n\u003ccontent>\n1: # EARS specs — approval slice — task-tracker-demo @ eee783057ec28d28fb36ec05484de9b4b40ceb9c\n2: \n3: System under specification: the task-tracker web app (frozen ~/app). All specs are **current behavior**, derived from the sources cited in `rules/R-APR.md`.\n4: \n5: ## S-APR-001 — approve success (state + event driven)\n6: **While** the authenticated user's role satisfies `canApprove()` (ADMIN or MANAGER, per `model/Role.java:14-16`) **and** the target task's status is `PENDING_APPROVAL`, **when** the system receives `POST /tasks/action` with `action=approve` and `id` of that task, **the system shall** set that task's status to `DONE`, refresh its `updated_at`, and respond `302` redirecting to `/tasks`.\n7: - Observable: HTTP 302 with `Location: /tasks`; oracle `SELECT id,status FROM task ORDER BY id` shows the task `DONE`.\n8: \n9: ## S-APR-002 — reject success (state + event driven)\n10: **While** the authenticated user's role satisfies `canApprove()` **and** the target task's status is `PENDING_APPROVAL`, **when** the system receives `POST /tasks/action` with `action=reject` and `id` of that task, **the system shall** set that task's status to `IN_PROGRESS`, refresh its `updated_at`, and respond `302` redirecting to `/tasks`.\n11: - Observable: HTTP 302; oracle shows the task `IN_PROGRESS`.\n12: \n13: ## S-APR-003 — role refusal (unwanted behavior)\n14: **When** the system receives `POST /tasks/action` with `action=approve` or `action=reject`, **if** the authenticated user's role does not satisfy `canApprove()` (MEMBER or VIEWER), **then the system shall** respond `403 Forbidden` and leave the task's status unchanged.\n15: - Observable: HTTP 403; body contains `\"Only managers or admins may approve or reject tasks\"` (filter message, `web/AuthFilter.java:42-45` — fires before the servlet's own check); oracle shows task status unchanged. (If the filter were bypassed, the servlet's `requireApprover`, `web/TaskActionServlet.java:93-95`, yields 403 with `\"Approval requires a manager or admin\"` — same outcome, different text; see rules/R-APR.md disagreement record.)\n16: \n17: ## S-APR-004 — wrong-starting-state refusal (unwanted behavior)\n18: **When** an authenticated user whose role satisfies `canApprove()` sends `POST /tasks/action` with `action=approve` or `action=reject`, **if** the target task's status is not `PENDING_APPROVAL`, **then the system shall** respond `409 Conflict` and leave the task's status unchanged.\n19: - Observable: HTTP 409; body matches `Cannot \u003caction> a task in status \u003ccurrent> (expected PENDING_APPROVAL)` (`web/TaskActionServlet.java:101-108`); oracle shows task status unchanged.\n20: \n21: ## S-APR-005 — unauthenticated request (supporting precondition)\n22: **When** the system receives `POST /tasks/action` with `action=approve` or `action=reject`, **if** no authenticated user is bound to the session, **then the system shall** respond `302` redirecting to `/login` and leave the task's status unchanged.\n23: - Observable: HTTP 302 `Location: /login` (`web/AuthFilter.java:33-38`); oracle unchanged.\n24: \n25: All five cases are source-supported; none was unsupported. Coverage note: (a)=S-APR-001/002, (b)=S-APR-003, (c)=S-APR-004 per dispatch item 2.\n\n(End of file - total 25 lines)\n\u003c/content>","isError":false,"ts":"2026-11-02T20:33:56.720Z","durationMs":7},"i":17,"workMs":144},{"kind":"tool_call","ts":"2026-11-02T20:33:56.818Z","tool":{"name":"read","callId":"chatcmpl-tool-aecaea5596dcd826","input":{"filePath":"/home/rishi/outputs/findings/ledger.json"},"command":"home/rishi/outputs/findings/ledger.json"},"result":{"text":"\u003cpath>/home/rishi/outputs/findings/ledger.json\u003c/path>\n\u003ctype>file\u003c/type>\n\u003ccontent>\n1: {\n2:   \"run\": \"task-tracker-02\",\n3:   \"frozenAppCommit\": \"eee783057ec28d28fb36ec05484de9b4b40ceb9c\",\n4:   \"adjudicator\": \"orchestrator\",\n5:   \"findings\": [\n6:     {\n7:       \"id\": \"F-001\",\n8:       \"origin\": \"G-APR-001 (rules/R-APR.md, rule-analyst A1)\",\n9:       \"title\": \"bulkClose lets non-approvers reach DONE without a state guard\",\n10:       \"classification\": \"suspected defect\",\n11:       \"expected\": \"Under the approval policy established by R-APR-001/R-APR-004 (only ADMIN/MANAGER may approve; only PENDING_APPROVAL may become DONE), a MEMBER/VIEWER bulk-closing tasks, or bulk-closing a non-PENDING_APP :91-98 requireApprover, invoked :49 and :54. Correct.\n- R-APR-005: TaskDao.java:115-125 updateStatus. Actually updateStatus is at lines 115-125. Correct.\n\nThings I noticed that may need correction or additions:\n- R-APR.md says \"9 tests, 233/500 lines, 75/188 branches\" — that's run history, fine.\n- The mapping.json has \"dispatch\": \"d003\" — odd but that's the engineer's artifact, not mine.\n\nNew observations for the new families (defect candidates and disagreements):\n\nAUTH:\n- LoginServlet POST: authenticate(username, password) — PersonDao.authenticate uses plaintext password comparison in SQL (PersonDao.java:16-29). Login success → session user attribute set, 302 to /tasks. Failure → forward to login.jsp with error \"Invalid credentials\" — that's a 200 (forward), not 401.\n- Invalid params: username=null or password=null → authenticate SQL with null values → no match → null → \"Invalid credentials\" 200. No NPE since setString(null) is fine in Postgres? Actually ps.setString(1, null) may throw for some drivers but Postgres accepts setString with null? In PostgreSQL JDBC, setString(i, null) is allowed (it sends NULL). Actually, the JDBC spec says setString with null is permitted; some drivers throw, but pgjdbc allows it. Hmm — actually pgjdbc setString with null parameter... In pgjdbc, setString(index, null) works fine (sets NULL). Yes, PG JDBC supports it. So invalid/missing params → \"Invalid credentials\" 200. Good.\n- GET /login → forward to login.jsp (200). Note: GET /login when already authenticated still shows the login page (no redirect).\n- AuthFilter exemptions: path equals \"/login\" OR startsWith \"/api/\" OR endsWith \".css\" (AuthFilter.java:28-31). Note: exemption is by servlet path. `/api/tasks` is exempt — no auth needed. Also anything ending .css. Note that path.equals(\"/login\") — only exact /login; but what about /login/ ? Not matched → redirected. Minor.\n- Protected: everything else including /logout, /tasks, /tasks/form, /tasks/action, /projects, and index.jsp (welcome file at \"/\" — servlet path for welcome file... the welcome-file index.jsp — request to \"/\" resolves to index.jsp; the filter's getServletPath() for a welcome file request \"/\" would be... For Tomcat, welcome file processing: the request is dispatched to /index.jsp — but it's a forward/include? For welcome files, Tomcat internally forwards; the filter is mapped to /* and by default dispatcher REQUEST only, so a forward wouldn't pass through the filter. But actually for welcome files Tomcat does a \"named dispatcher\"-style include? Hmm. In Tomcat, when a request maps to \"/\" and welcome-file index.jsp exists, Tomcat performs a forward to /index.jsp using the RequestDispatcher — the AuthFilter mapped to /* with default dispatcher REQUEST would NOT be invoked on the forward. Actually wait — for welcome files, Tomcat historically does an internal redirect that goes through the standard pipeline again? Let me think. In Tomcat's StandardHostValve, if the request maps to a directory and a welcome file is found, it does `context.getServletContext().getRequestDispatcher(...)`? No — it sets a new request path and re-invokes the pipeline via `request.getRequestDispatcher(file).forward(req, res)`? Tomcat's welcome file processing uses `RequestDispatcher.forward` semantics via `ApplicationHttpRequest`. Filters with dispatcher REQUEST are not triggered on forward.\n\nHmm, but actually, in Tomcat, the welcome file mechanism: StandardHostValve.invoke → if mapped wrapper is default servlet and path ends with \"/\", it tries welcome files and does an internal forward through the Context pipeline... Actually it calls `context.map(request.getMappingData())`? Let me recall: Tomcat's StandardHostValve.welcome() does: `RequestDispatcher rd = servletContext.getRequestDispatcher(file); rd.forward(request, response);`? No, I believe it re-runs the request mapping: `context.getPipeline().getFirst().invoke(request, response)` after rewriting the request URI. Hmm.\n\nActually in Tomcat source, StandardHostValve.welcome() does:\n```java\nRequestDispatcher rd = servletContext.getRequestDispatcher(file);\nrd.forward(request.getRequest(), response.getResponse());\n```\nHmm, no — I recall it uses `context.map()` again and re-invokes. Let me not overcommit here. The safe empirical claim: request \"/\" → index.jsp does `response.sendRedirect(contextPath + \"/tasks\")` → 302 to /tasks. Then browser GETs /tasks, which passes through AuthFilter → if no session → 302 /login. So effectively \"/\" → 302 /tasks (from index.jsp) → then possibly 302 /login. But whether AuthFilter intercepts \"/\" directly is uncertain: the filter is mapped /*, and for a welcome-file forward, REQUEST-dispatcher filters don't run on the forward. But the initial request to \"/\" itself: does it pass through the filter? The initial request URI \"/\" maps to... the mapping: \"/\" doesn't match any servlet mapping; Tomcat resolves welcome file via forward. The initial request would hit the AuthFilter? The filter runs on REQUEST dispatch for path \"/*\" — the request path is \"/\" — the filter runs BEFORE the servlet mapping completes? No — filters run after mapping (filters are selected based on the mapped servlet/path). For welcome-file forwards, Tomcat's own code — I remember now — StandardHostValve does the welcome-file resolution BEFORE invoking filters? Actually no: the flow is Coyote → StandardEngineValve → StandardHostValve → (welcome file resolution happens in StandardHostValve before the context pipeline) → StandardContextValve → StandardWrapperValve. Filters are invoked by StandardWrapperValve (in ApplicationFilterChain), which is AFTER the host valve resolves the welcome file. So for request \"/\": StandardHostValve rewrites the request path to /index.jsp and re-invokes the context pipeline — the filter mapping for the rewritten path /index.jsp would match /*, and AuthFilter would run with servletPath = \"/index.jsp\".\n\nHmm wait, does it re-invoke? In Tomcat's StandardHostValve.welcome():\n\n```java\n// Pass the request to the welcome file processor\nRequestDispatcher rd = servletContext.getRequestDispatcher(file);\nrd.forward(request, response);\n```\n\nHmm, I genuinely don't remember exactly. Tomcat 9's StandardHostValve.welcome file code:\n\n```java\nprivate boolean welcome(RelativePath rp) { ... }\n```\n\nI recall it uses `context.map()` and calls `context.getPipeline().getFirst().invoke(request, response)` — i.e., it re-runs the whole context pipeline including filters on the new path. In that case AuthFilter sees servletPath \"/index.jsp\" — not /login, not /api/*, not .css → requires auth → redirect to /login.\n\nActually — I tested this pattern before in real life: with a filter on /* and an index.jsp welcome file doing sendRedirect, an unauthenticated request to \"/\" typically ends up redirected by the filter to /login (if the filter redirects unauthenticated). But if welcome file processing bypasses REQUEST filters (forward semantics), the response would be index.jsp's sendRedirect to /tasks, and the filter never sees \"/\".\n\nThis is genuinely uncertain from source alone. I should mark it as an uncertainty with two candidate behaviors, and note that either way the observable end state for an unauthenticated user hitting \"/\" is ending at /login (via /tasks redirect chain) OR directly /login. Actually:\n- Case A (filter runs on /index.jsp): unauthenticated \"/\" → 302 /login directly.\n- Case B (welcome forward bypasses filter): unauthenticated \"/\" → 302 /tasks (from index.jsp) → browser follows → /tasks hits AuthFilter → 302 /login.\nEither way the user lands on /login, but the immediate Location header for \"/\" differs: \"/login\" vs \"/tasks\". That's an observable difference a test could pin down. I'll flag it as a characterization gap requiring one probe; the engineer can execute. I'll write the rule with both candidates and mark observed-vs-intended as \"unresolved - needs single probe\". Actually wait — can I probe it myself? The runtime is at ~/runtime? I have a frozen runtime copy. I could potentially run the app and check... but my role says no executable test ownership, and \"The engineer/verifier supply actual execution evidence through the orchestrator; don't invent it.\" I should not execute tests myself. I could do a quick probe but that would be \"execution evidence\"... The dispatch says don't invent execution evidence — the engineer supplies it. A single curl probe would be execution. Better to document as unresolved with a precise probe recipe. That's cleaner and respects the division of labor.\n\nWait — actually, is there something about \"/\"? Let me reconsider: getServletPath() for the welcome file. Hmm, also the ROOT context — contextPath. In the runtime, the app is likely deployed at ROOT. Fine.\n\n- /logout: GET (only doGet defined); invalidates session if present, redirects to /login. Session invalidation: subsequent use of the old session cookie → new session ( getSession(false) null → redirect to /login). POST /logout → 405 (HttpServlet.doPost default: HTTP 405 Method Not Allowed). Wait — does HttpServlet return 405 for unsupported methods? Yes, the default HttpServlet.doPost sends SC_METHOD_NOT_ALLOWED (405) with \"POST not supported\" message... Actually the default HttpServlet implementations of doDelete/doPut/doOptions... For doPost/doGet, HttpServlet's default implementations return 405? Let me recall: javax.servlet.http.HttpServlet.doGet/doPost etc. — the spec says the default implementations return an HTTP 405 error (\"Method not allowed\")? Hmm. HttpServlet.service() dispatches to doGet/doPost/etc., and the default doGet/doPost/doPut/doDelete each respond with `SC_METHOD_NOT_ALLOWED` (405) via sendError. Yes: \"the default implementation of each doXXX method returns HTTP 405\". Correct: `protected void doGet(...) { resp.sendError(HttpServletResponse.SC_METHOD_NOT_ALLOWED); }` essentially (\"GET\" not... the message is like \"HTTP method GET is not supported by this URL\"). So POST /logout → 405. And HEAD /logout? HttpServlet.service handles HEAD by calling doGet with no body — actually the HttpServlet handles TRACE and HEAD specially: HEAD is served by doGet (response body suppressed by the container? no — HttpServlet.service checks method == HEAD and calls doGet, and the response body is written but not sent? Actually Tomcat suppresses the body for HEAD). Minor.\n\nAlso AuthFilter: /logout is NOT exempt → unauthenticated GET /logout → 302 /login (filter). Slightly odd but fine.\n\n- AuthFilter exemptions detail: \"/login\" exact, \"/api/\" prefix, \".css\" suffix. Everything else protected. Note: /styles.css is a real file; also any request ending .css is exempt (e.g. /tasks/action.css — ends with .css → exempt! That means POST /tasks/action.css bypasses auth but then 404s since no servlet maps it... wait — servletPath /tasks/action.css doesn't map to /tasks/action (exact mapping), so it falls to default servlet → 404. So no real bypass. But it's an interesting note: `.css` suffix exemption could theoretically expose a mapped route ending in .css — none exists. Document as observation.\n\n- Also note: AuthFilter only protects by servletPath; JSPs under /WEB-INF are not directly reachable. index.jsp is at webapp root and IS directly reachable: GET /index.jsp → AuthFilter (servletPath \"/index.jsp\") → not exempt → requires login → 302 /login. Authenticated → index.jsp → 302 /tasks. That's a directly-reachable route worth inventorying (not in scope.json's route list — scope lists 7 routes via web.xml servlet mappings; index.jsp is an additional observable route). styles.css also directly reachable (exempt via .css rule).\n\nPROJ:\n- GET /projects → requires auth; lists all projects (ProjectDao.findAll ORDER BY p.name, JOIN person — archived included), plus people list. Renders projects.jsp. Observable: all 3 seeded projects incl. Legacy Archive (ARCHIVED).\n- POST /projects with action=archive → archive(id) → UPDATE project SET state='ARCHIVED' WHERE id=? AND state='ACTIVE' → 302 /projects. Idempotent-ish: archiving an ARCHIVED project → UPDATE matches 0 rows → still 302 /projects (no error). Archive nonexistent id → 0 rows, 302. No role check — ANY authenticated user (even VIEWER) can archive/create. Dispatch says don't infer restrictions from role names — so observed: all roles can create/archive projects.\n- POST /projects create: name required — name == null || name.trim().isEmpty() → 400 \"Project name is required\". No duplicate-name check! Schema: project.name VARCHAR(128) NOT NULL, no UNIQUE constraint (unlike person.username UNIQUE). So duplicate names are accepted → two projects with same name. The dispatch said \"create (valid/blank/duplicate name)\" — observed: duplicate name is ALLOWED (no validation, no DB constraint). Document as observed; intended may be uniqueness but nothing in source says so. Not necessarily a defect — record as observation/unresolved-intent.\n- Create: owner = current session user (owner_id set from session user.getId()). state='ACTIVE' hardcoded in SQL. description optional (nullable).\n- malformed id on archive: Long.parseLong(req.getParameter(\"id\")) → NFE → 500 (same class as F-002).\n- ProjectServlet POST without action and without name → 400 \"Project name is required\".\n- web.xml: /projects maps ProjectServlet — but projects.jsp has a \"Delete\" link to /projects/delete?id=... — NO servlet maps /projects/delete! It's not in web.xml. So GET /projects/delete?id=1 → 404 (unauthenticated → 302 /login first via filter since path /projects/delete not exempt; authenticated → 404). This is a VIEW/SOURCE DISAGREEMENT: the JSP renders a Delete link that has no backing route. Defect candidate (dead link / unimplemented feature). Great catch for findings.\n- Note: /projects/delete is protected by filter (not exempt) — authenticated users get 404.\n\nFORM:\n- GET /tasks/form (no id): blank form; form/error markup `src/main/webapp/WEB-INF/jsp/login.jsp:18-33`.\n- **Actors and preconditions:** any client (anonymous or authenticated); `/login` is exempt from AuthFilter.\n- **Trigger:** `GET /login`.\n- **Effects or refusal:** 200, login form; no error paragraph unless `error` attribute set (login.jsp:20). No session created on GET.\n- **Observed versus intended:** Observed only; no disagreement known.\n- **Linked EARS IDs:** S-AUTH-001.\n\n## R-AUTH-002 — POST /login success binds session user and redirects to /tasks\n- **ID:** R-AUTH-002\n- **Statement:** POST /login with a username+password matching a `person` row stores that Person as session attribute `user` and responds 302 to `\u003cctx>/tasks`.\n- **Source citations:** `web/LoginServlet.java:23-35` (`authenticate` at `:27`, `req.getSession(true).setAttribute(\"user\", user)` `:33`, `sendRedirect(ctx + \"/tasks\")` `:34`); SQL `dao/PersonDao.java:16-29` (`WHERE username = ? AND password = ?` — plaintext comparison, comment `:17`).\n- **Actors and preconditions:** any client; credentials must match a seeded row exactly (seed: `src/main/resources/db/seed.sql:2-6`, password = username).\n- **Trigger:** `POST /login` with valid `username`/`password` form params.\n- **Effects or refusal:** 302 `Location: /tasks`; session cookie issued (JSESSIONID); session attribute `user` set. A second login in the same session replaces the bound user (no rotation; `:33` reuses the existing session from `getSession(true)`).\n- **Observed versus intended:** Observed: passwords stored/compared in plaintext; session not invalidated before re-login (fixation-rotation absent). Recorded as observations for the orchestrator, not adjudicated here.\n- **Linked EARS IDs:** S-AUTH-002.\n\n## R-AUTH-003 — POST /login failure re-renders form with \"Invalid credentials\" (200, not 401)\n- **ID:** R-AUTH-003\n- **Statement:** POST /login with wrong, missing, or null username/password yields 200 re-render of the login page with error text \"Invalid credentials\"; no session is created.\n- **Source citations:** `web/LoginServlet.java:28-32` (user == null → `setAttribute(\"error\",\"Invalid credentials\")` + forward); `dao/PersonDao.java:18-24` (SQL `username = ? AND password = ?`; NULL params can never match — SQL `= NULL` is not true, and both columns are NOT NULL per `src/main/resources/db/schema.sql:11,13`).\n- **Actors and preconditions:** any client.\n- **Trigger:** `POST /login` with non-matching credentials (includes absent params, empty strings, unknown user).\n- **Effects or refusal:** 200 with `\u003cp class=\"error\">Invalid credentials\u003c/p>` (login.jsp:20); no session cookie issued on this path; no redirect.\n- **Observed versus intended:** Observed failure = 200, not 401/403. No disagreement known; characterize as-is.\n- **Linked EARS IDs:** S-AUTH-003.\n\n## R-AUTH-004 — AuthFilter exemptions: exact /login, prefix /api/, suffix .css\n- **ID:** R-AUTH-004\n- **Statement:** Requests whose servlet path equals `/login`, starts with `/api/`, or ends with `.css` bypass authentication entirely; all other paths require a session user.\n- **Source citations:** `web/AuthFilter.java:28-31`; filter mapped `/*` by `src/main/webapp/WEB-INF/web.xml:16-23`.\n- **Actors and preconditions:** any request reaching the filter.\n- **Trigger:** any request; path test at `:28`.\n- **Effects or refusal:** Exempt → chain continues unauthenticated. Note (observed): the `.css` suffix exemption is path-suffix-based, so a hypothetical route ending in `.css` would be unauthenticated — no such mapped route exists today (`/tasks/action.css` etc. fall through to the default servlet → 404). `/api/tasks` exemption = closed finding F-003 (not a defect; GET-only read-back).\n- **Observed versus intended:** Observed; F-003 records the /api/* adjudication.\n- **Linked EARS IDs:** S-AUTH-004 (partial: exemption leg), S-API-001.\n\n## R-AUTH-005 — AuthFilter protects every non-exempt path (302 to /login when no session user)\n- **ID:** R-AUTH-005\n- **Statement:** For any path not exempt under R-AUTH-004, a request without session attribute `user` is redirected 302 to `\u003cctx>/login` and never reaches a servlet; an authenticated request continues.\n- **Source citations:** `web/AuthFilter.java:33-38` (`getSession(false)`, user null → `sendRedirect(ctx + \"/login\")`).\n- **Actors and preconditions:** anonymous client (no JSESSIONID or expired/invalidated session).\n- **Trigger:** GET/POST to `/tasks`, `/tasks/form`, `/tasks/action`, `/projects`, `/projects/delete` (unmapped → 404 after auth), `/logout`, `/index.jsp`, or any other non-exempt path.\n- **Effects or refusal:** 302 `Location: /login`; no DAO access, no DB write. Same behavior for GET and POST.\n- **Observed versus intended:** Observed; matches inherited S-APR-005 evidence (approve/reject leg, run 01).\n- **Linked EARS IDs:** S-AUTH-004, S-AUTH-005.\n\n## R-AUTH-006 — GET /logout invalidates the session and redirects to /login\n- **ID:** R-AUTH-006\n- **Statement:** GET /logout invalidates the current session (if any) and responds 302 to `\u003cctx>/login`; the old session cookie is dead afterwards.\n- **Source citations:** `web/LogoutServlet.java:12-18` (`getSession(false)`; invalidate if non-null; `sendRedirect(ctx + \"/login\")`); mapping `web.xml:35-42`; logout link `src/main/webapp/WEB-INF/jsp/_header.jspf:15`.\n- **Actors and preconditions:** any client; /logout is NOT exempt (R-AUTH-004), so an anonymous GET /logout is first redirected to /login by the filter (R-AUTH-005) — the servlet's own redirect is only observable when authenticated.\n- **Trigger:** `GET /logout` with a live session.\n- **Effects or refusal:** 302 `/login`; session invalidated — replaying the old JSESSIONID on `/tasks` now yields 302 `/login` (R-AUTH-005). No DB write.\n- **Observed versus intended:** Observed; no disagreement known.\n- **Linked EARS IDs:** S-AUTH-006.\n\n## R-AUTH-007 — /logout is GET-only; other methods get 405\n- **ID:** R-AUTH-007\n- **Statement:** Only doGet is implemented on LogoutServlet; POST (and other non-HEAD methods) fall through to HttpServlet's default and respond 405.\n- **Source citations:** `web/LogoutServlet.java:12-18` (doGet only; no doPost override); javax.servlet.http.HttpServlet default doPost → 405 (container behavior, no app source).\n- **Actors and preconditions:** authenticated client (passes filter).\n- **Trigger:** `POST /logout` (also PUT/DELETE).\n- **Effects or refusal:** 405, no session invalidation (observable: pre-logout session still works on /tasks).\n- **Observed versus intended:** Observed container default; flagged so tests don't assume 302.\n- **Linked EARS IDs:** S-AUTH-006 (companion refusal leg).\n\n## R-AUTH-008 — Root/index redirect behavior (welcome-file dispatch uncertainty)\n- **ID:** R-AUTH-008\n- **Statement:** `index.jsp` unconditionally sends 302 to `\u003cctx>/tasks` (src/main/webapp/index.jsp:1). Direct `GET /index.jsp` passes AuthFilter (path `/index.jsp` is not exempt) → anonymous 302 `/login`, authenticated 302 `/tasks`. For the bare `/` welcome-file request, whether AuthFilter runs before index.jsp depends on container welcome-file dispatch semantics and is NOT decidable from app source alone.\n- **Source citations:** `src/main/webapp/index.jsp:1`; welcome-file `web.xml:89-91`; filter mapping `web.xml:20-23`; exemption list `web/AuthFilter.java:28-31`.\n- **Actors and preconditions:** any client; ROOT context assumed (ctx = \"\").\n- **Trigger:** `GET /` or `GET /index.jsp`.\n- **Effects or refusal:** Two candidate outcomes for `GET /` anonymous: (a) filter sees the welcome-file target → 302 `/login` immediately, or (b) welcome-file forward bypasses REQUEST-dispatcher filters → index.jsp's own 302 `/tasks`, after which the browser's /tasks request hits the filter → 302 `/login`. Either way an anonymous user ends at /login; the immediate `Location` for `GET /` differs (`/login` vs `/tasks`). `GET /index.jsp` is deterministic: anonymous → 302 `/login`; authenticated → 302 `/tasks`.\n- **Observed versus intended:** UNRESOLVED observed detail — single probe needed (recipe in evidence/analyst/d002-run02-notes.md §AUTH-008). Intended is uncontroversial (end at login/tasks); only the first hop is in question.\n- **Linked EARS IDs:** S-AUTH-007.\n\n## Corrections to inherited material (explicit, nothing removed)\n- None required in R-APR/S-APR for AUTH: R-APR-001's filter citation (`AuthFilter.java:40-47`) remains the approve/reject gate; this file does not supersede it.\n- Note: run-summary/01 measured \"17 classes\" in coverage while `_campaign/scope.json` lists 18 Java sources — a run-01 measurement discrepancy recorded for the orchestrator in evidence/analyst/d002-run02-notes.md; does not affect AUTH rules.\n"},"command":"home/rishi/outputs/rules/R-AUTH.md"},"result":{"text":"Wrote file successfully.","isError":false,"ts":"2026-11-02T20:37:23.593Z","durationMs":17},"tokens":{"input":16358,"output":2575,"reasoning":145,"cacheRead":41359,"cacheWrite":0},"reportedCostUSD":0.04562254,"i":75,"workMs":17},{"kind":"meta","ts":"2026-11-02T20:37:23.598Z","text":"step finish — tool-calls","i":76},{"kind":"tool_call","ts":"2026-11-02T20:37:45.517Z","tool":{"name":"write","callId":"chatcmpl-tool-aee6d1486b88fd63","input":{"content":"# PROJ rules — projects list/create/archive/validation — task-tracker-demo @ eee783057ec28d28fb36ec05484de9b4b40ceb9c (frozen ~/app)\n\nScope: `ProjectServlet`, `ProjectDao`, `projects.jsp`, `project` table. No restriction is inferred from role names or project archival state. Paths relative to `src/main/java/com/acme/tracker/` unless noted.\n\n## R-PROJ-001 — GET /projects lists every project, including ARCHIVED, ordered by name\n- **ID:** R-PROJ-001\n- **Statement:** GET /projects (authenticated) renders all projects ordered by `p.name` with owner full names; archived projects are included and shown.\n- **Source citations:** `web/ProjectServlet.java:23-28`; `dao/ProjectDao.java:19-31` (`BASE ... JOIN person o` `:15-17`, `ORDER BY p.name` `:22`); view `src/main/webapp/WEB-INF/jsp/projects.jsp:15-36`.\n- **Actors and preconditions:** any authenticated user (all four roles — no role check in servlet or filter for /projects).\n- **Trigger:** `GET /projects`.\n- **Effects or refusal:** 200 HTML table of all projects (seed: Apollo, Borealis, Legacy Archive — alphabetical); Actions column shows Archive button only for `state == 'ACTIVE'` (projects.jsp:25-31) and a Delete link always (projects.jsp:32, see R-PROJ-007).\n- **Observed versus intended:** Observed; no disagreement known.\n- **Linked EARS IDs:** S-PROJ-001.\n\n## R-PROJ-002 — POST /projects create: valid name → new ACTIVE project owned by the session user\n- **ID:** R-PROJ-002\n- **Statement:** POST /projects (no `action` param) with a non-blank `name` creates a project with state ACTIVE, owner = session user, optional description, and redirects 302 to /projects.\n- **Source citations:** `web/ProjectServlet.java:38-50` (name validation `:40-43`; owner from session `:44-48`); `dao/ProjectDao.java:57-72` (INSERT hardcodes `'ACTIVE'` `:58`, RETURN_GENERATED_KEYS); schema `src/main/resources/db/schema.sql:18-26`.\n- **Actors and preconditions:** any authenticated user — observed: no role gate (VIEWER can create projects).\n- **Trigger:** `POST /projects` with `name` non-blank after trim (name is stored trimmed, `ProjectServlet.java:46`).\n- **Effects or refusal:** 302 `/projects`; new row `state='ACTIVE'`, `owner_id` = session user id; description may be null (column nullable, schema.sql:21). Name > 128 chars → SQLException → unhandled 500 (VARCHAR(128), schema.sql:20).\n- **Observed versus intended:** Observed; intended unknown for role policy (none in source).\n- **Linked EARS IDs:** S-PROJ-002.\n\n## R-PROJ-003 — POST /projects create with blank/missing name → 400 \"Project name is required\"\n- **ID:** R-PROJ-003\n- **Statement:** Create with `name` absent, empty, or whitespace-only responds 400 with message \"Project name is required\"; nothing persisted.\n- **Source citations:** `web/ProjectServlet.java:40-43` (`name == null || name.trim().isEmpty()` → `sendError(400, \"Project name is required\")`).\n- **Actors and preconditions:** authenticated user.\n- **Trigger:** `POST /projects` without action and with blank `name` (also `name=\"   \"`).\n- **Effects or refusal:** 400, no DB write. Note: unlike task-form validation (R-FORM-004, 200 re-render), project validation uses sendError (400).\n- **Observed versus intended:** Observed; consistent with 400 used for unknown actions (R-LIFE-007).\n- **Linked EARS IDs:** S-PROJ-003.\n\n## R-PROJ-004 — Duplicate project names are accepted (no app check, no DB uniqueness)\n- **ID:** R-PROJ-004\n- **Statement:** Creating a project whose name equals an existing project's name succeeds (302, second row persisted); neither servlet nor schema rejects duplicates.\n- **Source citations:** `web/ProjectServlet.java:38-50` (no duplicate check); `src/main/resources/db/schema.sql:20` (`name VARCHAR(128) NOT NULL` — no UNIQUE, contrast `person.username UNIQUE` at `:11`).\n- **Actors and preconditions:** authenticated user; an existing project with the same name.\n- **Trigger:** `POST /projects` with `name=Apollo` (existing seed name).\n- **Effects or refusal:** 302 `/projects`; two ACTIVE \"Apollo\" rows; list shows both (R-PROJ-001).\n- **Observed versus intended:** Observed = duplicates allowed. Whether uniqueness is intended is UNRESOLVED (nothing in source states it); recorded, not adjudicated. Flagged so tests characterize, not prescribe.\n- **Linked EARS IDs:** S-PROJ-004 (characterization).\n\n## R-PROJ-005 — POST /projects action=archive: ACTIVE → ARCHIVED, 302, any authenticated role\n- **ID:** R-PROJ-005\n- **Statement:** POST /projects with `action=archive` and an existing ACTIVE project id sets state to ARCHIVED and redirects 302 to /projects; no role check; no guard other than current-state in the WHERE clause.\n- **Source citations:** `web/ProjectServlet.java:33-37`; `dao/ProjectDao.java:75-84` (`UPDATE project SET state='ARCHIVED' WHERE id=? AND state='ACTIVE'`); view button `projects.jsp:25-31`.\n- **Actors and preconditions:** any authenticated user (VIEWER included — observed, no gate).\n- **Trigger:** `POST /projects` `action=archive`, `id` of an ACTIVE project.\n- **Effects or refusal:** 302 `/projects`; row state ACTIVE→ARCHIVED. No route restores ACTIVE (no un-archive anywhere in source). Archiving imposes no restriction on the project's tasks (no code reads project.state outside projects.jsp rendering — verified).\n- **Observed versus intended:** Observed; archival is display-only for tasks (do not infer task-mutation restrictions from archival state).\n- **Linked EARS IDs:** S-PROJ-005.\n\n## R-PROJ-006 — Archive is idempotent-silent: ARCHIVED or nonexistent id still returns 302 with no effect\n- **ID:** R-PROJ-006\n- **Statement:** action=archive on an already-ARCHIVED or nonexistent project id performs a 0-row UPDATE and still responds 302 /projects — no error, no not-found.\n- **Source citations:** `web/ProjectServlet.java:33-37` (no existence check, always redirect); `dao/ProjectDao.java:75-84` (0 rows when `state != 'ACTIVE'` or id absent).\n- **Actors and preconditions:** authenticated user.\n- **Trigger:** `action=archive` with id of Legacy Archive (already ARCHIVED, seed id 3) or id 999.\n- **Effects or refusal:** 302 `/projects`; oracle `SELECT id,state FROM project ORDER BY id` unchanged.\n- **Observed versus intended:** Observed; candidate intended-behavior question (404/409?) recorded as unresolved-intent note, not asserted.\n- **Linked EARS IDs:** S-PROJ-006.\n\n## R-PROJ-007 — View renders a Delete link to /projects/delete, which has no backing route (404)\n- **ID:** R-PROJ-007\n- **Statement:** projects.jsp renders `\u003ca href=\"\u003cctx>/projects/delete?id=N\">Delete\u003c/a>` for every project, but no servlet is mapped to /projects/delete in web.xml — authenticated requests get 404; anonymous get 302 /login first.\n- **Source citations:** `src/main/webapp/WEB-INF/jsp/projects.jsp:32`; servlet mappings `src/main/webapp/WEB-INF/web.xml:26-87` (no /projects/delete); filter `web/AuthFilter.java:28-38`.\n- **Actors and preconditions:** authenticated user clicking Delete.\n- **Trigger:** `GET /projects/delete?id=1`.\n- **Effects or refusal:** 404 (container default servlet); no DB effect. Anonymous: 302 `/login`.\n- **Observed versus intended:** **Source/document disagreement — defect candidate (dead UI control / unimplemented feature).** Repro recipe in evidence/analyst/d002-run02-notes.md §PROJ-007. Suggested finding F-005 (orchestrator adjudicates numbering).\n- **Linked EARS IDs:** S-PROJ-007 (characterization of the 404).\n\n## R-PROJ-008 — Malformed/missing id on archive → unhandled NumberFormatException → 500\n- **ID:** R-PROJ-008\n- **Statement:** action=archive with `id` missing or non-numeric throws NumberFormatException at Long.parseLong → HTTP 500.\n- **Source citations:** `web/ProjectServlet.java:34` (`Long.parseLong(req.getParameter(\"id\"))`, unguarded).\n- **Actors and preconditions:** authenticated user.\n- **Trigger:** `POST /projects` `action=archive` with no `id` or `id=abc`.\n- **Effects or refusal:** 500; no DB write. Same defect class as inherited F-002 (G-APR-002) on /tasks/action — extend the finding's scope, don't fork it silently.\n- **Observed versus intended:** Suspected robustness defect (observed source behavior; execution evidence pending). Candidate 400 intended.\n- **Linked EARS IDs:** S-PROJ-008 (characterization).\n","filePath":"/home/rishi/outputs/rules/R-PROJ.md"},"command":"home/rishi/outputs/rules/R-PROJ.md"},"result":{"text":"Wrote file successfully.","isError":false,"ts":"2026-11-02T20:37:45.529Z","durationMs":12},"tokens":{"input":2730,"output":2205,"reasoning":0,"cacheRead":57716,"cacheWrite":0},"reportedCostUSD":0.02853016,"i":77,"workMs":21936},{"kind":"meta","ts":"2026-11-02T20:37:45.537Z","text":"step finish — tool-calls","i":78},{"kind":"tool_call","ts":"2026-11-02T20:38:15.676Z","tool":{"name":"write","callId":"chatcmpl-tool-a82db1d982064130","input":{"content":"# FORM rules — task form display/create/edit/validation/defaults — task-tracker-demo @ eee783057ec28d28fb36ec05484de9b4b40ceb9c (frozen ~/app)\n\nScope: `TaskFormServlet`, `task-form.jsp`, `TaskDao.create/update`. Paths relative to `src/main/java/com/acme/tracker/` unless noted. Status defaults are FORM-family facts; lifecycle transitions are LIFE (rules/R-LIFE.md).\n\n## R-FORM-001 — GET /tasks/form blank display; UI apparent priority default is LOW while server default is MEDIUM\n- **ID:** R-FORM-001\n- **Statement:** GET /tasks/form without id renders a blank \"New task\" form (200) with project and assignee selects populated; the priority select shows LOW as the visually selected option (first option, no `selected` marker), but a POST that omits the priority field entirely defaults to MEDIUM.\n- **Source citations:** `web/TaskFormServlet.java:26-35` (no `task` attribute set when no id; `projects`/`people` set `:32-33`); `src/main/webapp/WEB-INF/jsp/task-form.jsp:27` (New task title), `:96-103` (priority select iterates LOW,MEDIUM,HIGH — first = LOW; `${task.priority == pr}` empty for blank form); server default `web/TaskFormServlet.java:58,89-91` (`orDefault(priority,\"MEDIUM\")`).\n- **Actors and preconditions:** any authenticated user (filter protects /tasks/form).\n- **Trigger:** `GET /tasks/form`.\n- **Effects or refusal:** 200 blank form. A browser submitting unchanged sends `priority=LOW` (visible selection); a crafted POST without the field gets MEDIUM (`:58`).\n- **Observed versus intended:** **UI/server default disagreement (observed):** displayed default LOW ≠ server-side fallback MEDIUM. Not adjudicated — record; tests should pin both legs separately.\n- **Linked EARS IDs:** S-FORM-001.\n\n## R-FORM-002 — GET /tasks/form?id=N prefill; unknown id silently shows blank form; malformed id → 500\n- **ID:** R-FORM-002\n- **Statement:** With `id` present and non-empty, the servlet loads the task (findById) and prefills the form; an unknown id (null return) leaves the form blank with a \"New task\" heading and no error; a non-numeric id throws NumberFormatException → 500.\n- **Source citations:** `web/TaskFormServlet.java:28-31` (`Long.parseLong(idParam)` at `:30`, unguarded); `dao/TaskDao.java:26-29` (findById → null when absent); `task-form.jsp:6,27` (heading falls back to \"New task\" when task empty).\n- **Actors and preconditions:** authenticated user.\n- **Trigger:** `GET /tasks/form?id=2` (prefill), `?id=999` (blank, 200), `?id=abc` (500).\n- **Effects or refusal:** Prefill: title/description/project-selected/assignee-selected/priority-selected/dueDate populated (`task-form.jsp:64-108`); detail panel with status badge and status-conditional transitions shown (`:32-62`). Unknown id: 200 blank form (misleading but harmless). Malformed: 500 (F-002 class).\n- **Observed versus intended:** Unknown-id silent blank = observed; 404 might be intended — unresolved, record only. Malformed id = F-002-class suspected defect.\n- **Linked EARS IDs:** S-FORM-002.\n\n## R-FORM-003 — POST create happy path: task starts OPEN, priority defaults MEDIUM, assignee nullable, redirect to saved detail\n- **ID:** R-FORM-003\n- **Statement:** POST /tasks/form without id, valid title + existing projectId, creates a task with status OPEN (forced by servlet, not the form), priority MEDIUM when the field is absent/empty, assignee null when absent/empty/\"(unassigned)\" value, and redirects 302 to `/tasks/form?id=\u003cnewId>&saved=1`.\n- **Source citations:** `web/TaskFormServlet.java:55-74` (`setStatus(TaskStatus.OPEN)` `:66`; `orDefault(priority,\"MEDIUM\")` `:58`; assignee null when empty `:60-61`; redirect `:74`); insert `dao/TaskDao.java:75-95` (RETURN_GENERATED_KEYS); DB defaults `src/main/resources/db/schema.sql:32-35` (status DEFAULT OPEN, priority DEFAULT MEDIUM — never used by this path since the servlet always sets both); saved banner `task-form.jsp:29` (`param.saved == '1'`).\n- **Actors and preconditions:** any authenticated user (no role gate — VIEWER can create tasks; observed).\n- **Trigger:** `POST /tasks/form` title=\"X\" projectId=1 [assigneeId= [priority= [dueDate=]]].\n- **Effects or refusal:** 302 `Location: /tasks/form?id=\u003cgenerated>&saved=1`; new row status OPEN; `updated_at` = CURRENT_TIMESTAMP; \"(unassigned)\" select option posts empty string → stored NULL (schema allows, `schema.sql:36`).\n- **Observed versus intended:** Observed; no disagreement known.\n- **Linked EARS IDs:** S-FORM-003.\n\n## R-FORM-004 — POST with blank title → 200 re-render \"Title is required\"; entered input is lost\n- **ID:** R-FORM-004\n- **Statement:** Title is required: absent, empty, or whitespace-only title (after trim) re-renders the form (200) with error \"Title is required\"; the fail path does not echo back any submitted fields.\n- **Source citations:** `web/TaskFormServlet.java:41-48` (trim + `title.isEmpty()` → fail); `fail()` `:77-83` (sets error + projects + people; does NOT set task/title/description attributes); `task-form.jsp:28` (error paragraph), `:69,74` (inputs bound to `${task.*}` — empty on fail path).\n- **Actors and preconditions:** authenticated user.\n- **Trigger:** `POST /tasks/form` with `title=\"\"` or `title=\"   \"` (with description text filled in).\n- **Effects or refusal:** 200, \"Title is required\" shown; description and other entered values NOT preserved (re-render is blank); no DB write.\n- **Observed versus intended:** Observed = 200 (contrast R-PROJ-003's 400). Input-loss on validation failure is an observed UX defect candidate (recorded; low severity, not adjudicated).\n- **Linked EARS IDs:** S-FORM-004.\n\n## R-FORM-005 — POST with missing/nonexistent projectId → 200 re-render \"A task must belong to an existing project\"; archived projects accepted; malformed id → 500\n- **ID:** R-FORM-005\n- **Statement:** projectId must be present and belong to an existing project (existence checked via ProjectDao.exists, which ignores state); blank or unknown projectId re-renders with \"A task must belong to an existing project\"; an ARCHIVED project passes the check; non-numeric projectId throws NFE → 500.\n- **Source citations:** `web/TaskFormServlet.java:49-53` (`projectIdParam == null || isEmpty || !projects.exists(parseLong(...))` → fail); `dao/ProjectDao.java:45-55` (exists — no state filter); archived seed project `src/main/resources/db/seed.sql:12` (id 3 ARCHIVED).\n- **Actors and preconditions:** authenticated user.\n- **Trigger:** `projectId` absent / empty / `999` (200 re-render), `projectId=3` (accepted, archived), `projectId=abc` (500 at `:50` parseLong inside the condition).\n- **Effects or refusal:** 200 re-render for blank/unknown; 302 saved for archived project (task created in an ARCHIVED project — observed, allowed); 500 for malformed.\n- **Observed versus intended:** Archived-project acceptance is observed behavior; per the no-inference rule, no task-creation restriction is inferred from archival state. Intended policy unresolved — record.\n- **Linked EARS IDs:** S-FORM-005.\n\n## R-FORM-006 — POST edit happy path: fields updated, status preserved, but project_id is silently NOT updated\n- **ID:** R-FORM-006\n- **Statement:** POST /tasks/form with a valid id updates title, description, priority, assignee_id, due_date and bumps updated_at; the UPDATE statement does not include project_id, so a project change made in the form is silently ignored; status is also outside the SET list and thus preserved.\n- **Source citations:** `web/TaskFormServlet.java:64-72` (edit branch sets id, calls `tasks.update(t)` — projectId set on the object at `:59` but never persisted); `dao/TaskDao.java:97-112` (`UPDATE task SET title=?, description=?, priority=?, assignee_id=?, due_date=?, updated_at=CURRENT_TIMESTAMP WHERE id=?` — no `project_id`, no `status`); form offers Project select on edit `task-form.jsp:79-84`.\n- **Actors and preconditions:** authenticated user; existing task id.\n- **Trigger:** `POST /tasks/form` id=1 projectId=2 title=\"...\" (project changed 1→2).\n- **Effects or refusal:** 302 `/tasks/form?id=1&saved=1` (\"Saved.\" banner shown) but oracle `SELECT project_id FROM task WHERE id=1` still 1; detail panel still shows old project. Status unchanged by edit (observable via oracle).\n- **Observed versus intended:** **Defect candidate (observed): form offers a project change that never persists, while the UI confirms \"Saved.\"** Intended presumably to move the task. Repro recipe in evidence/analyst/d002-run02-notes.md §FORM-006; suggested finding F-006 (orchestrator adjudicates). The status-preservation half is benign/intended-looking (status is lifecycle-owned).\n- **Linked EARS IDs:** S-FORM-006 (characterization-of-suspect for the project_id leg).\n\n## R-FORM-007 — POST edit of a nonexistent id → 302 \"saved=1\" with nothing persisted (silent no-op)\n- **ID:** R-FORM-007\n- **Statement:** The edit branch performs no existence check: updating id 999 runs a 0-row UPDATE and still redirects to `/tasks/form?id=999&saved=1`, showing the Saved banner; a follow-up GET shows a blank form.\n- **Source citations:** `web/TaskFormServlet.java:68-74` (savedId = parseLong(idParam); update; redirect unconditionally); `dao/TaskDao.java:97-112` (executeUpdate result ignored); `task-form.jsp:29` (Saved banner on param).\n- **Actors and preconditions:** authenticated user.\n- **Trigger:** `POST /tasks/form` id=999 title=\"Ghost\" projectId=1.\n- **Effects or refusal:** 302 `Location: /tasks/form?id=999&saved=1`; oracle row count for task unchanged (no row 999); banner \"✓ Saved.\" displayed on a task that does not exist.\n- **Observed versus intended:** **Defect candidate (observed): misleading success confirmation for a no-op.** 404 would arguably be intended — unresolved; repro recipe in notes §FORM-007; suggested finding F-007.\n- **Linked EARS IDs:** S-FORM-007 (characterization-of-suspect).\n\n## R-FORM-008 — Crafted inputs that violate DB constraints or formats → unhandled 500\n- **ID:** R-FORM-008\n- **Statement:** The form layer validates only title presence and project existence; other invalid inputs surface as exceptions → 500: nonexistent assigneeId (FK violation), invalid dueDate format (IllegalArgumentException in java.sql.Date.valueOf), non-whitelisted priority (CHECK violation), overlong title (>256) or description (>4000) (VARCHAR limits).\n- **Source citations:** `web/TaskFormServlet.java:55-62` (assignee parsed with no existence check `:60-61`; dueDate passed raw `:62`; priority passed raw `:58`); FKs `src/main/resources/db/schema.sql:40-41`; CHECKs `:33,35`; lengths `:30-31`; `java.sql.Date.valueOf` throws IllegalArgumentException (JDK); SQLExceptions are wrapped and rethrown as RuntimeException in `dao/TaskDao.java:92-94,109-111`.\n- **Actors and preconditions:** authenticated user crafting requests (the browser UI cannot produce these).\n- **Trigger:** e.g. `assigneeId=999`, `dueDate=2026-13-45`, `priority=URGENT`, 300-char title.\n- **Effects or refusal:** HTTP 500; no partial DB write (single INSERT/UPDATE). Malformed id on edit (`id=abc`) → NFE 500 (`:69`), F-002 class.\n- **Observed versus intended:** Suspected robustness defects (F-002 class, server-side validation gaps). Observed from source; execution evidence pending. Characterize as-is.\n- **Linked EARS IDs:** S-FORM-008 (characterization).\n","filePath":"/home/rishi/outputs/rules/R-FORM.md"},"command":"home/rishi/outputs/rules/R-FORM.md"},"result":{"text":"Wrote file successfully.","isError":false,"ts":"2026-11-02T20:38:15.682Z","durationMs":6},"tokens":{"input":2215,"output":2946,"reasoning":0,"cacheRead":60445,"cacheWrite":0},"reportedCostUSD":0.0317791,"i":79,"workMs":30153},{"kind":"meta","ts":"2026-11-02T20:38:15.694Z","text":"step finish — tool-calls","i":80},{"kind":"thinking","ts":"2026-11-02T20:38:18.591Z","text":"Now the specs for AUTH, PROJ, FORM. Required fields: ID, EARS statement, Linked rule IDs, Fixtures and inputs, Observable assertions, Executable test IDs (planned T-*).","startTs":"2026-11-02T20:38:18.307Z","i":81,"workMs":2909},{"kind":"assistant","ts":"2026-11-02T20:38:32.054Z","text":"Now specs for A1:","startTs":"2026-11-02T20:38:18.593Z","i":82,"workMs":13463},{"kind":"tool_call","ts":"2026-11-02T20:38:32.017Z","tool":{"name":"write","callId":"chatcmpl-tool-bb1afe2cf2ab1dd6","input":{"content":"# EARS specs — AUTH — task-tracker-demo @ eee783057ec28d28fb36ec05484de9b4b40ceb9c\n\nPlanned test IDs (T-AUTH-*) are placeholders — the engineer/verifier supply real executed IDs via the orchestrator; none of the results below are executed evidence. Fixtures: seeded users admin/mgr/dev/view (password = username), seed.sql:2-6.\n\n## S-AUTH-001 — login form display\n- **ID:** S-AUTH-001\n- **EARS statement:** **When** the system receives `GET /login`, **the system shall** respond 200 with the sign-in form and no error message.\n- **Linked rule IDs:** R-AUTH-001\n- **Fixtures and inputs:** none required; fresh anonymous session.\n- **Observable assertions:** HTTP 200; body contains `Sign in` and a form posting to `/login`; body does NOT contain `Invalid credentials`; no JSESSIONID needed/issued.\n- **Executable test IDs:** T-AUTH-001 (planned).\n\n## S-AUTH-002 — login success\n- **ID:** S-AUTH-002\n- **EARS statement:** **When** the system receives `POST /login` with `username` and `password` matching a seeded person, **the system shall** create a session carrying that person as `user` and respond 302 to `/tasks`.\n- **Linked rule IDs:** R-AUTH-002\n- **Fixtures and inputs:** `mgr`/`mgr` (MANAGER) — repeat for `admin`/`admin`, `dev`/`dev`, `view`/`view`.\n- **Observable assertions:** HTTP 302 `Location: /tasks`; Set-Cookie JSESSIONID; subsequent `GET /tasks` with the cookie returns 200 (not a redirect to /login); header shows `Morgan Manager (MANAGER)` (_header.jspf:13).\n- **Executable test IDs:** T-AUTH-002 (planned; parametrize per user).\n\n## S-AUTH-003 — login failure (unwanted behavior)\n- **ID:** S-AUTH-003\n- **EARS statement:** **When** the system receives `POST /login` with credentials matching no person (wrong password, unknown user, or missing/null fields), **then the system shall** respond 200 re-rendering the login page with `Invalid credentials` and issue no working session.\n- **Linked rule IDs:** R-AUTH-003\n- **Fixtures and inputs:** `mgr`/`wrong`; `nobody`/`x`; empty username; both fields absent.\n- **Observable assertions:** HTTP 200 (not 401); body contains `Invalid credentials`; a following `GET /tasks` (same cookie jar, if any) redirects 302 `/login`.\n- **Executable test IDs:** T-AUTH-003 (planned).\n\n## S-AUTH-004 — anonymous access to protected routes (unwanted behavior)\n- **ID:** S-AUTH-004\n- **EARS statement:** **When** the system receives a GET or POST to any non-exempt path (`/tasks`, `/tasks/form`, `/tasks/action`, `/projects`, `/logout`, `/index.jsp`) without an authenticated session, **then the system shall** respond 302 to `/login` and not invoke any servlet logic.\n- **Linked rule IDs:** R-AUTH-004, R-AUTH-005\n- **Fixtures and inputs:** anonymous jar; probe each path incl. `POST /tasks/action action=approve id=3` (inherits S-APR-005 evidence from run 01).\n- **Observable assertions:** HTTP 302 `Location: /login` for every probe; oracle `SELECT id,status FROM task ORDER BY id` unchanged after the POST probes.\n- **Executable test IDs:** T-AUTH-004 (planned).\n\n## S-AUTH-005 — exempt paths reachable without authentication\n- **ID:** S-AUTH-005\n- **EARS statement:** **When** the system receives a request to `/login`, any path starting `/api/`, or any path ending `.css`, **the system shall** apply no authentication gate.\n- **Linked rule IDs:** R-AUTH-004 (cross-family: R-API-001)\n- **Fixtures and inputs:** anonymous `GET /api/tasks`, `GET /styles.css`, `GET /login`.\n- **Observable assertions:** none of the three returns 302 `/login` (API returns JSON, css returns 200 stylesheet, login returns the form).\n- **Executable test IDs:** T-AUTH-005 (planned).\n\n## S-AUTH-006 — logout invalidates the session\n- **ID:** S-AUTH-006\n- **EARS statement:** **While** a session is authenticated, **when** the system receives `GET /logout`, **the system shall** invalidate that session and respond 302 to `/login`; **and when** it receives `POST /logout`, **the system shall** respond 405 and leave the session valid.\n- **Linked rule IDs:** R-AUTH-006, R-AUTH-007\n- **Fixtures and inputs:** login `dev`/`dev`; then `GET /logout` with the cookie; replay the same cookie on `/tasks`. Separately: fresh login then `POST /logout`, then `GET /tasks` with same cookie.\n- **Observable assertions:** GET leg: 302 `/login`; replayed cookie on `/tasks` → 302 `/login` (session dead). POST leg: 405; `/tasks` with same cookie → 200 (session still alive).\n- **Executable test IDs:** T-AUTH-006 (planned; two legs).\n\n## S-AUTH-007 — root redirect (characterization with one unresolved hop)\n- **ID:** S-AUTH-007\n- **EARS statement:** **When** the system receives `GET /` without a session, **the system shall** redirect such that the client ends at `/login` (first hop `/login` or `/tasks` — container welcome-file dispatch, unresolved, see R-AUTH-008); **and when** it receives `GET /index.jsp` without a session, **the system shall** respond 302 `/login` directly.\n- **Linked rule IDs:** R-AUTH-008\n- **Fixtures and inputs:** anonymous `GET /`; anonymous `GET /index.jsp`; authenticated `GET /index.jsp`.\n- **Observable assertions:** `GET /index.jsp` anonymous → 302 `Location: /login`; authenticated → 302 `Location: /tasks` (index.jsp:1). `GET /` anonymous → 302 whose Location is one of {`/login`, `/tasks`} — record which, and that following redirects ends at the login form. **This spec deliberately leaves the first-hop Location th state ACTIVE and owner = that user, and respond 302 to `/projects`.\n- **Linked rule IDs:** R-PROJ-002\n- **Fixtures and inputs:** login `view`/`view` (VIEWER — pins the no-role-gate observation); `name=Zeta`, `description=probe`.\n- **Observable assertions:** HTTP 302 `/projects`; oracle shows new row (`Zeta`, `ACTIVE`, owner_id 4); next GET /projects lists Zeta. Reset DB after.\n- **Executable test IDs:** T-PROJ-002 (planned).\n\n## S-PROJ-003 — create refusal on blank name (unwanted behavior)\n- **ID:** S-PROJ-003\n- **EARS statement:** **When** the system receives `POST /projects` with `name` absent, empty, or whitespace-only, **then the system shall** respond 400 with `Project name is required` and persist nothing.\n- **Linked rule IDs:** R-PROJ-003\n- **Fixtures and inputs:** login `mgr`; `name=` and `name=%20%20%20` and no name field.\n- **Observable assertions:** HTTP 400; body contains `Project name is required`; oracle row count unchanged.\n- **Executable test IDs:** T-PROJ-003 (planned).\n\n## S-PROJ-004 — duplicate name accepted (characterization; intent unresolved)\n- **ID:** S-PROJ-004\n- **EARS statement:** **When** the system receives `POST /projects` with `name` equal to an existing project's name, **the system shall** create a second project with that name (observed; **characterization-of-unresolved-intent** — no uniqueness rule exists in source or schema).\n- **Linked rule IDs:** R-PROJ-004\n- **Fixtures and inputs:** login `mgr`; `name=Apollo` (seed duplicate).\n- **Observable assertions:** HTTP 302; oracle contains two ACTIVE rows named Apollo; list renders both. Reset DB after.\n- **Executable test IDs:** T-PROJ-004 (planned, labelled characterization).\n\n## S-PROJ-005 — archive success\n- **ID:** S-PROJ-005\n- **EARS statement:** **When** the system receives `POST /projects` with `action=archive` and the id of an ACTIVE project from any authenticated user, **the system shall** set that project's state to ARCHIVED and respond 302 to `/projects`.\n- **Linked rule IDs:** R-PROJ-005\n- **Fixtures and inputs:** login `view`/VIEWER (pins no role gate); `action=archive`, `id=1` (Apollo).\n- **Observable assertions:** HTTP 302 `/projects`; oracle project 1 state ACTIVE→ARCHIVED; its tasks untouched (`SELECT id,status FROM task` unchanged — archival does not cascade). Reset DB after.\n- **Executable test IDs:** T-PROJ-005 (planned).\n\n## S-PROJ-006 — archive idempotence / unknown id (characterization)\n- **ID:** S-PROJ-006\n- **EARS statement:** **When** the system receives `POST /projects` with `action=archive` and the id of a project that is ARCHIVED or does not exist, **the system shall** respond 302 to `/projects` with no state change and no error (observed; characterization — intended 404/409 unresolved).\n- **Linked rule IDs:** R-PROJ-006\n- **Fixtures and inputs:** login `mgr`; `action=archive&id=3` (already ARCHIVED); `action=archive&id=999`.\n- **Observable assertions:** HTTP 302 `/projects` both times; oracle unchanged both times.\n- **Executable test IDs:** T-PROJ-006 (planned, characterization).\n\n## S-PROJ-007 — Delete link 404 (characterization-of-suspect)\n- **ID:** S-PROJ-007\n- **EARS statement:** **When** an authenticated user follows the Delete link rendered by `/projects` (`GET /projects/delete?id=N`), **the system shall** respond 404, because no route is mapped (observed; **characterization-of-suspect** — dead UI control, defect candidate R-PROJ-007).\n- **Linked rule IDs:** R-PROJ-007\n- **Fixtures and inputs:** login `mgr`; `GET /projects/delete?id=1`; also anonymous variant.\n- **Observable assertions:** authenticated → 404; anonymous → 302 `/login` (filter first). Oracle unchanged.\n- **Executable test IDs:** T-PROJ-007 (planned, characterization-of-suspect).\n\n## S-PROJ-008 — malformed archive id → 500 (characterization-of-suspect)\n- **ID:** S-PROJ-008\n- **EARS statement:** **When** the system receives `POST /projects` with `action=archive` and a missing or non-numeric `id`, **t s intended:** Observed; matches the same guard shape already accepted for approve/reject (R-APR-004).\n- **Linked EARS IDs:** S-LIFE-001.\n\n## R-LIFE-002 — submit: IN_PROGRESS → PENDING_APPROVAL, any authenticated role\n- **ID:** R-LIFE-002\n- **Statement:** action=submit on an IN_PROGRESS task sets PENDING_APPROVAL; no role check; guard refuses other statuses 409.\n- **Source citations:** `web/TaskActionServlet.java:44-47` (guard IN_PROGRESS `:45`, `updateStatus(PENDING_APPROVAL)` `:46`).\n- **Actors and preconditions:** any authenticated user; task exists.\n- **Trigger:** `action=submit`, id of an IN_PROGRESS task (seed task 2).\n- **Effects or refusal:** success: 302, PENDING_APPROVAL, updated_at bumped; wrong state (e.g. OPEN) → 409 `Cannot submit a task in status OPEN (expected IN_PROGRESS)`.\n- **Observed versus intended:** Observed.\n- **Linked EARS IDs:** S-LIFE-002.\n\n## R-LIFE-003 — reopen: DONE → OPEN, any authenticated role\n- **ID:** R-LIFE-003\n- **Statement:** action=reopen on a DONE task sets OPEN; no role check; guard refuses other statuses 409.\n- **Source citations:** `web/TaskActionServlet.java:58-61` (guard DONE `:59`, `updateStatus(OPEN)` `:60`).\n- **Actors and preconditions:** any authenticated user (VIEWER can reopen — observed); task exists.\n- **Trigger:** `action=reopen`, id of a DONE task (seed task 4).\n- **Effects or refusal:** success: 302, OPEN, updated_at bumped; wrong state → 409 `Cannot reopen a task in status \u003ccurrent> (expected DONE)`.\n- **Observed versus intended:** Observed; explicitly: VIEWER is NOT read-only anywhere in this servlet (only approve/reject are gated, by filter/servlet R-APR-001/002).\n- **Linked EARS IDs:** S-LIFE-003.\n\n## R-LIFE-004 — approve/reject remain governed by R-APR-001..005 (cross-reference only)\n- **ID:** R-LIFE-004\n- **Statement:** The approve and reject transitions keep their inherited rules and IDs: role gates R-APR-001/002/003, state guard R-APR-004, effects R-APR-005. Nothing in run 02 supersedes them.\n- **Source citations:** `web/TaskActionServlet.java:48-57`; see `rules/R-APR.md` (stable).\n- **Actors and preconditions:** per R-APR.\n- **Trigger:** action=approve / action=reject.\n- **Effects or refusal:** per R-APR (DONE / IN_PROGRESS; 403/409/404).\n- **Observed versus intended:** unchanged; run-01 verifier evidence (ACCEPTED at 340dc91) still applies.\n- **Linked EARS IDs:** S-APR-001..005.\n\n## R-LIFE-005 — General wrong-state guard shape (409, no write) for all single-task actions\n- **ID:** R-LIFE-005\n- **Statement:** Every single-task action checks current status equals its expected value before writing; on mismatch: 409 `Cannot \u003caction> a task in status \u003ccurrent> (expected \u003cexpected>)`, no DAO write, updated_at untouched.\n- **Source citations:** `web/TaskActionServlet.java:100-109` (guard), invoked `:41,45,50,55,59`; expectations OPEN/IN_PROGRESS/PENDING_APPROVAL×2/DONE.\n- **Actors and preconditions:** authenticated; task exists.\n- **Trigger:** any lifecycle action on a task whose status differs from the action's expectation.\n- **Effects or refusal:** 409; oracle row byte-identical (no updated_at bump — no write occurs).\n- **Observed versus intended:** Observed; generalizes the accepted R-APR-004 behavior.\n- **Linked EARS IDs:** S-LIFE-004.\n\n## R-LIFE-006 — Nonexistent task id → 404 \"No such task\" (after action-specific gates)\n- **ID:** R-LIFE-006\n- **Statement:** An unknown id yields 404 `No such task`; for start/submit/reopen any authenticated role gets 404; for approve/reject a non-approver gets 403 first (filter, R-APR-001/R-APR-002 ordering note).\n- **Source citations:** `web/TaskActionServlet.java:31-36` (parse + findById + 404); filter ordering `web/AuthFilter.java:40-47` vs `:31-36` (documented in R-APR-002 disagreement record).\n- **Actors and preconditions:** authenticated.\n- **Trigger:** `action=start`, `id=999` (any role) — 404; `action=approve`, `id=999` as dev — 403.\n- **Effects or refusal:** 404 `No such task` / 403 per ordering; no DB write.\n- **Observed versus intended:** Observed; ordering cross-checks already in evidence/analyst/fixtures.md (run 01).\n- **Linked EARS IDs:** S-LIFE-005.\n\n## R-LIFE-007 — Unknown or missing action → 400 \"Unknown action: \u003caction>\" (incl. literal \"null\")\n- **ID:** R-LIFE-007\n- **Statement:** An action value outside {start,submit,approve,reject,reopen} (bulkClose handled separately, R-BULK-001..005) responds 400 `Unknown action: \u003caction>`; a missing action parameter produces the literal message `Unknown action: null` (switch default on \"\").\n- **Source citations:** `web/TaskActionServlet.java:39` (`switch (action == null ? \"\" : action)`), `:62-64` (default → 400 `\"Unknown action: \" + action` — null concatenates as \"null\").\n- **Actors and preconditions:** authenticated (and, for approve/reject-shaped values only, filter gate; unknown strings pass the filter untouched, `web/AuthFilter.java:42`).\n- **Trigger:** `action=pause`; no action param but `id=1`.\n- **Effects or refusal:** 400 with the exact message; no DB write. Note: unknown action + missing id → the 500 at `:31` fires BEFORE the switch (parse precedes dispatch) — only requests carrying a parseable id reach the 400.\n- **Observed versus intended:** Observed; 400 for unknown action is the app's own convention (contrast PROJ/FORM).\n- **Linked EARS IDs:** S-LIFE-006.\n\n## R-LIFE-008 — Missing/malformed id → unhandled NumberFormatException → 500\n- **ID:** R-LIFE-008\n- **Statement:** For non-bulkClose actions, `id` absent or non-numeric throws at `Long.parseLong` → 500 (inherited F-002, unchanged).\n- **Source citations:** `web/TaskActionServlet.java:31`.\n- **Actors and preconditions:** authenticated.\n- **Trigger:** `action=start` without id, or `id=abc`.\n- **Effects or refusal:** 500; no DB write.\n- **Observed versus intended:** Suspected defect (F-002) — observed source behavior, reproduction pending (recipe in findings/ledger n- **ID:** R-BULK-001\n- **Statement:** POST /tasks/action action=bulkClose with no `ids` parameter values responds 302 to /tasks and changes nothing.\n- **Source citations:** `web/TaskActionServlet.java:77-81` (`getParameterValues(\"ids\")` null or length 0 → redirect); bulk form only submits checked boxes (`src/main/webapp/WEB-INF/jsp/tasks.jsp:47` — unchecked boxes are not sent).\n- **Actors and preconditions:** any authenticated user.\n- **Trigger:** `POST /tasks/action` `action=bulkClose` (no ids) — the natural \"no checkbox checked\" case.\n- **Effects or refusal:** 302 `/tasks`; oracle unchanged. Note: `ids=` (param present with a single empty-string value) is NOT this case — it parses \"\" → NFE → 500 (R-BULK-004).\n- **Observed versus intended:** Observed.\n- **Linked EARS IDs:** S-BULK-001.\n\n## R-BULK-002 — Selected non-DONE ids → DONE with updated_at bump; DONE ids untouched; unknown ids ignored (characterization-of-suspect)\n- **ID:** R-BULK-002\n- **Statement:** With ids selected, every id whose row exists and is not already DONE is set to DONE with updated_at bumped, regardless of its current status (OPEN/IN_PROGRESS/PENDING_APPROVAL) — in a single UPDATE; already-DONE rows are not touched (no bump); nonexistent ids are silently ignored; the response is always 302 /tasks.\n- **Source citations:** `web/TaskActionServlet.java:82-87` (parse loop, `tasks.bulkClose(ids)`, redirect); `dao/TaskDao.java:128-147` (`UPDATE task SET status='DONE', updated_at=CURRENT_TIMESTAMP WHERE status \u003c> 'DONE' AND id IN (...)`, return value ignored).\n- **Actors and preconditions:** any authenticated user; mixed selection allowed.\n- **Trigger:** `action=bulkClose`, `ids=1&ids=3` (OPEN + PENDING_APPROVAL), or `ids=4&ids=999` (DONE + unknown).\n- **Effects or refusal:** 302 `/tasks`; oracle: non-DONE selected → DONE (+updated_at), DONE selected unchanged, unknown ids no error.\n- **Observed versus intended:** **OBSERVED = characterization-of-suspect (F-001):** a PENDING_APPROVAL task reaches DONE without approval. INTENDED (recorded separately, UNRESOLVED — needs product decision, do not test as requirement): under the approval policy of R-APR-001/R-APR-004 only ADMIN/MANAGER and only PENDING_APPROVAL tasks should reach DONE. See R-BULK-003.\n- **Linked EARS IDs:** S-BULK-002 (characterization-of-suspect).\n\n## R-BULK-003 — No canApprove gate and no PENDING_APPROVAL guard on bulkClose (characterization-of-suspect; intended unresolved)\n- **ID:** R-BULK-003\n- **Statement:** The bulkClose path performs no role check (the AuthFilter gate covers only approve/reject — `web/AuthFilter.java:42`) and no status guard other than `status \u003c> 'DONE'`; therefore MEMBER and VIEWER users can drive any task to DONE in bulk, including PENDING_APPROVAL tasks.\n- **Source citations:** `web/AuthFilter.java:40-47` (gate limited to approve/reject strings); `web/TaskActionServlet.java:26-29` (bulkClose branches BEFORE the id/404 logic and before requireApprover — no gate on this path); `dao/TaskDao.java:136-137` (only `status \u003c> 'DONE'`).\n- **Actors and preconditions:** any authenticated user, any roles, any task states.\n- **Trigger:** login dev/dev; `POST /tasks/action` `action=bulkClose`, `ids=3` (PENDING_APPROVAL).\n- **Effects or refusal:** 302 `/tasks`; task 3 DONE (if the suspected behavior is real — reproduction pending, recipe in findings/ledger.json F-001).\n- **Observed versus intended:** **OBSERVED (from source) = characterization-of-suspect, F-001.** INTENDED, recorded separately and explicitly NOT speced as a requirement: bulkClose should arguably enforce canApprove + a legal-state guard consistent with the approve path. Unresolved until the orchestrator/product adjudicates; tests must assert observed behavior labelled characterization, never the intended one.\n- **Linked EARS IDs:** S-BULK-003 (characterization-of-suspect).\n\n## R-BULK-004 — Malformed ids value → unhandled NumberFormatException → 500\n- **ID:** R-BULK-004\n-
