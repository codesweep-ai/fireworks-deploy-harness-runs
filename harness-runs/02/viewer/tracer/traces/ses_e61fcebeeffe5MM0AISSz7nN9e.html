0 (not a redirect to /login); header shows `Morgan Manager (MANAGER)` (_header.jspf:13).\n- **Executable test IDs:** T-AUTH-002 (planned; parametrize per user).\n\n## S-AUTH-003 — login failure (unwanted behavior)\n- **ID:** S-AUTH-003\n- **EARS statement:** **When** the system receives `POST /login` with credentials matching no person (wrong password, unknown user, or missing/null fields), **then the system shall** respond 200 re-rendering the login page with `Invalid credentials` and issue no working session.\n- **Linked rule IDs:** R-AUTH-003\n- **Fixtures and inputs:** `mgr`/`wrong`; `nobody`/`x`; empty username; both fields absent.\n- **Observable assertions:** HTTP 200 (not 401); body contains `Invalid credentials`; a following `GET /tasks` (same cookie jar, if any) redirects 302 `/login`.\n- **Executable test IDs:** T-AUTH-003 (planned).\n\n## S-AUTH-004 — anonymous access to protected routes (unwanted behavior)\n- **ID:** S-AUTH-004\n- **EARS statement:** **When** the system receives a GET or POST to any non-exempt path (`/tasks`, `/tasks/form`, `/tasks/action`, `/projects`, `/logout`, `/index.jsp`) without an authenticated session, **then the system shall** respond 302 to `/login` and not invoke any servlet logic.\n- **Linked rule IDs:** R-AUTH-004, R-AUTH-005\n- **Fixtures and inputs:** anonymous jar; probe each path incl. `POST /tasks/action action=approve id=3` (inherits S-APR-005 evidence from run 01).\n- **Observable assertions:** HTTP 302 `Location: /login` for every probe; oracle `SELECT id,status FROM task ORDER BY id` unchanged after the POST probes.\n- **Executable test IDs:** T-AUTH-004 (planned).\n\n## S-AUTH-005 — exempt paths reachable without authentication\n- **ID:** S-AUTH-005\n- **EARS statement:** **When** the system receives a request to `/login`, any path starting `/api/`, or any path ending `.css`, **the system shall** apply no authentication gate.\n- **Linked rule IDs:** R-AUTH-004 (cross-family: R-API-001)\n- **Fixtures and inputs:** anonymous `GET /api/tasks`, `GET /styles.css`, `GET /login`.\n- **Observable assertions:** none of the three returns 302 `/login` (API returns JSON, css returns 200 stylesheet, login returns the form).\n- **Executable test IDs:** T-AUTH-005 (planned).\n\n## S-AUTH-006 — logout invalidates the session\n- **ID:** S-AUTH-006\n- **EARS statement:** **While** a session is authenticated, **when** the system receives `GET /logout`, **the system shall** invalidate that session and respond 302 to `/login`; **and when** it receives `POST /logout`, **the system shall** respond 405 and leave the session valid.\n- **Linked rule IDs:** R-AUTH-006, R-AUTH-007\n- **Fixtures and inputs:** login `dev`/`dev`; then `GET /logout` with the cookie; replay the same cookie on `/tasks`. Separately: fresh login then `POST /logout`, then `GET /tasks` with same cookie.\n- **Observable assertions:** GET leg: 302 `/login`; replayed cookie on `/tasks` → 302 `/login` (session dead). POST leg: 405; `/tasks` with same cookie → 200 (session still alive).\n- **Executable test IDs:** T-AUTH-006 (planned; two legs).\n\n## S-AUTH-007 — root redirect (characterization with one unresolved hop)\n- **ID:** S-AUTH-007\n- **EARS statement:** **When** the system receives `GET /` without a session, **the system shall** redirect such that the client ends at `/login` (first hop `/login` or `/tasks` — container welcome-file dispatch, unresolved, see R-AUTH-008); **and when** it receives `GET /index.jsp` without a session, **the system shall** respond 302 `/login` directly.\n- **Linked rule IDs:** R-AUTH-008\n- **Fixtures and inputs:** anonymous `GET /`; anonymous `GET /index.jsp`; authenticated `GET /index.jsp`.\n- **Observable assertions:** `GET /index.jsp` anonymous → 302 `Location: /login`; authenticated → 302 `Location: /tasks` (index.jsp:1). `GET /` anonymous → 302 whose Location is one of {`/login`, `/tasks`} — record which, and that following redirects ends at the login form. **This spec deliberately leaves the first-hop Location unasserted pending the probe; the engineer's executed result resolves R-AUTH-008's open question.**\n- **Executable test IDs:** T-AUTH-007 (planned; first-hop recording).\n=== S-PROJ ===\n# EARS specs — PROJ — task-tracker-demo @ eee783057ec28d28fb36ec05484de9b4b40ceb9c\n\nPlanned test IDs (T-PROJ-*) are placeholders. Oracle: `SELECT id,name,state,owner_id FROM project ORDER BY id`. Seed projects: 1 Apollo ACTIVE owner 2; 2 Borealis ACTIVE owner 1; 3 Legacy Archive ARCHIVED owner 1 (seed.sql:9-12).\n\n## S-PROJ-001 — projects list shows all projects including archived\n- **ID:** S-PROJ-001\n- **EARS statement:** **When** the system receives `GET /projects` from an authenticated user, **the system shall** respond 200 listing every project ordered by name, including ARCHIVED ones, with owner names.\n- **Linked rule IDs:** R-PROJ-001\n- **Fixtures and inputs:** login any role (assert once with `view`/VIEWER to pin no role gate); seeded DB.\n- **Observable assertions:** HTTP 200; body contains `Apollo`, `Borealis`, `Legacy Archive` in that order (ORDER BY p.name); `ARCHIVED` state visible; Archive button absent for Legacy Archive row (projects.jsp:25-31).\n- **Executable test IDs:** T-PROJ-001 (planned).\n\n## S-PROJ-002 — create project success\n- **ID:** S-PROJ-002\n- **EARS statement:** **When** the system receives `POST /projects` with a non-blank `name` from an authenticated user, **the system shall** create a project with state ACTIVE and owner = that user, and respond 302 to `/projects`.\n- **Linked rule IDs:** R-PROJ-002\n- **Fixtures and inputs:** login `view`/`view` (VIEWER — pins the no-role-gate observation); `name=Zeta`, `description=probe`.\n- **Observable assertions:** HTTP 302 `/projects`; oracle shows new row (`Zeta`, `ACTIVE`, owner_id 4); next GET /projects lists Zeta. Reset DB after.\n- **Executable test IDs:** T-PROJ-002 (planned).\n\n## S-PROJ-003 — create refusal on blank name (unwanted behavior)\n- **ID:** S-PROJ-003\n- **EARS statement:** **When** the system receives `POST /projects` with `name` absent, empty, or whitespace-only, **then the system shall** respond 400 with `Project name is required` and persist nothing.\n- **Linked rule IDs:** R-PROJ-003\n- **Fixtures and inputs:** login `mgr`; `name=` and `name=%20%20%20` and no name field.\n- **Observable assertions:** HTTP 400; body contains `Project name is required`; oracle row count unchanged.\n- **Executable test IDs:** T-PROJ-003 (planned).\n\n## S-PROJ-004 — duplicate name accepted (characterization; intent unresolved)\n- **ID:** S-PROJ-004\n- **EARS statement:** **When** the system receives `POST /projects` with `name` equal to an existing project's name, **the system shall** create a second project with that name (observed; **characterization-of-unresolved-intent** — no uniqueness rule exists in source or schema).\n- **Linked rule IDs:** R-PROJ-004\n- **Fixtures and inputs:** login `mgr`; `name=Apollo` (seed duplicate).\n- **Observable assertions:** HTTP 302; oracle contains two ACTIVE rows named Apollo; list renders both. Reset DB after.\n- **Executable test IDs:** T-PROJ-004 (planned, labelled characterization).\n\n## S-PROJ-005 — archive success\n- **ID:** S-PROJ-005\n- **EARS statement:** **When** the system receives `POST /projects` with `action=archive` and the id of an ACTIVE project from any authenticated user, **the system shall** set that project's state to ARCHIVED and respond 302 to `/projects`.\n- **Linked rule IDs:** R-PROJ-005\n- **Fixtures and inputs:** login `view`/VIEWER (pins no role gate); `action=archive`, `id=1` (Apollo).\n- **Observable assertions:** HTTP 302 `/projects`; oracle project 1 state ACTIVE→ARCHIVED; its tasks untouched (`SELECT id,status FROM task` unchanged — archival does not cascade). Reset DB after.\n- **Executable test IDs:** T-PROJ-005 (planned).\n\n## S-PROJ-006 — archive idempotence / unknown id (characterization)\n- **ID:** S-PROJ-006\n- **EARS statement:** **When** the system receives `POST /projects` with `action=archive` and the id of a project that is ARCHIVED or does not exist, **the system shall** respond 302 to `/projects` with no state change and no error (observed; characterization — intended 404/409 unresolved).\n- **Linked rule IDs:** R-PROJ-006\n- **Fixtures and inputs:** login `mgr`; `action=archive&id=3` (already ARCHIVED); `action=archive&id=999`.\n- **Observable assertions:** HTTP 302 `/projects` both times; oracle unchanged both times.\n- **Executable test IDs:** T-PROJ-006 (planned, characterization).\n\n## S-PROJ-007 — Delete link 404 (characterization-of-suspect)\n- **ID:** S-PROJ-007\n- **EARS statement:** **When** an authenticated user follows the Delete link rendered by `/projects` (`GET /projects/delete?id=N`), **the system shall** respond 404, because no route is mapped (observed; **characterization-of-suspect** — dead UI control, defect candidate R-PROJ-007).\n- **Linked rule IDs:** R-PROJ-007\n- **Fixtures and inputs:** login `mgr`; `GET /projects/delete?id=1`; also anonymous variant.\n- **Observable assertions:** authenticated → 404; anonymous → 302 `/login` (filter first). Oracle unchanged.\n- **Executable test IDs:** T-PROJ-007 (planned, characterization-of-suspect).\n\n=== S-FORM ===\n# EARS specs — FORM — task-tracker-demo @ eee783057ec28d28fb36ec05484de9b4b40ceb9c\n\nPlanned test IDs (T-FORM-*) are placeholders. Oracle: `SELECT id,title,status,priority,assignee_id,project_id,due_date FROM task ORDER BY id` (extend with description when needed). Seed tasks 1..4 (seed.sql:17-21). Login `mgr` unless stated.\n\n## S-FORM-001 — blank form display and defaults (characterization of the LOW/MEDIUM split)\n- **ID:** S-FORM-001\n- **EARS statement:** **When** the system receives `GET /tasks/form` without `id`, **the system shall** respond 200 with a blank form titled \"New task\", populated project and assignee selects, and LOW as the visually preselected priority option.\n- **Linked rule IDs:** R-FORM-001\n- **Fixtures and inputs:** login `dev`; GET /tasks/form.\n- **Observable assertions:** HTTP 200; body contains `New task`; no task detail panel; project select lists Apollo/Borealis/Legacy Archive; assignee select lists `(unassigned)` + 4 people; the `LOW` option is the first and none carries `selected` (pin: the browser-visible default is LOW, and the server-side fallback for an absent field is MEDIUM — asserted separately in S-FORM-003 leg 2).\n- **Executable test IDs:** T-FORM-001 (planned).\n\n## S-FORM-002 — edit prefill and unknown/malformed id\n- **ID:** S-FORM-002\n- **EARS statement:** **When** the system receives `GET /tasks/form?id=2`, **the system shall** respond 200 with task 2's values prefilled and a detail panel; **and when** the id is unknown (999), **the system shall** respond 200 with a blank \"New task\" form; **and when** the id is non-numeric, **the system shall** respond 500 (characterization-of-suspect, F-002 class).\n- **Linked rule IDs:** R-FORM-002\n- **Fixtures and inputs:** login `mgr`; `?id=2`, `?id=999`, `?id=abc`.\n- **Observable assertions:** id=2: title `Wire up SSO`, status badge IN_PROGRESS, project Apollo selected, assignee Devon Member selected, priority HIGH selected, due 2026-06-20; transitions show only Submit-for-approval (task-form.jsp:49-51). id=999: 200, `New task`, no detail panel. id=abc: 500.\n- **Executable test IDs:** T-FORM-002 (planned; three legs).\n\n## S-FORM-003 — create success with defaults and null assignee\n- **ID:** S-FORM-003\n- **EARS statement:** **When** the system receives `POST /tasks/form` (no id) with a valid title and existing projectId, **the system shall** create the task with status OPEN and respond 302 to `/tasks/form?id=\u003cnew>&saved=1`; **and when** `priority` is absent, **the system shall** store MEDIUM; **and when** `assigneeId` is empty, **the system shall** store NULL.\n- **Linked rule IDs:** R-FORM-003, R-FORM-001 (server-default leg)\n- **Fixtures and inputs:** login `view` (pins no role gate on create); `title=Probe task`, `projectId=1`, no priority, no assignee, no dueDate; follow redirect.\n- **Observable assertions:** 302 Location `/tasks/form?id=5&saved=1` (next identity id); GET of it shows `Saved.` banner + detail panel status OPEN + `(unassigned)`; oracle row 5: status OPEN, priority MEDIUM, assignee_id NULL, project_id 1, due_date NULL. Reset DB after.\n- **Executable test IDs:** T-FORM-003 (planned).\n\n## S-FORM-004 — blank title refusal (unwanted behavior; input loss characterized)\n- **ID:** S-FORM-004\n- **EARS statement:** **When** the system receives `POST /tasks/form` with `title` absent, empty, or whitespace-only, **then the system shall** respond 200 re-rendering the form with `Title is required`, persist nothing, and not echo the submitted description (observed input-loss, characterization).\n- **Linked rule IDs:** R-FORM-004\n- **Fixtures and inputs:** login `mgr`; `title=`, `description=should vanish`, `projectId=1`; repeat `title=%20%20`.\n- **Observable assertions:** HTTP 200 (not 400); body contains `Title is required`; textarea empty; oracle row count unchanged.\n- **Executable test IDs:** T-FORM-004 (planned).\n\n## S-FORM-005 — project validation leg\n- **ID:** S-FORM-005\n- **EARS statement:** **When** the system receives `POST /tasks/form` with `projectId` absent, empty, or unknown (999), **then the system shall** respond 200 with `A task must belong to an existing project`; **and when** `projectId=3` (ARCHIVED), **the system shall** accept and create the task there (observed; no archival restriction); **and when** `projectId=abc`, **the system shall** respond 500 (characterization-of-suspect).\n- **Linked rule IDs:** R-FORM-005\n- **Fixtures and inputs:** login `mgr`; three refusal probes + `title=In archive`, `projectId=3`.\n- **Observable assertions:** refusals: 200 + message, oracle unchanged; archived accept: 302 saved, oracle new row project_id=3. Reset DB after.\n- **Executable test IDs:** T-FORM-005 (planned).\n\n## S-FORM-006 — edit persists fields but not project (characterization-of-suspect)\n- **ID:** S-FORM-006\n- **EARS statement:** **When** the system receives `POST /tasks/form` with `id=1`, a valid title, and `projectId=2`, **the system shall** respond 302 `/tasks/form?id=1&saved=1`, update title/description/priority/assignee/due_date and bump `updated_at`, leave `status` unchanged, and leave `project_id` at its previous value (observed; **characterization-of-suspect** — the form offers a project change that never persists; intended move-to-project behavior is unresolved, defect candidate R-FORM-006).\n- **Linked rule IDs:** R-FORM-006\n- **Fixtures and inputs:** login `mgr`; `id=1`, `title=Design login page v2`, `projectId=2`, `priority=LOW`, `assigneeId=` (unassign).\n- **Observable assertions:** 302 + `Saved.` banner; oracle task 1: title updated, project_id still 1 (NOT 2), status still OPEN, priority LOW, assignee_id NULL, updated_at bumped; detail panel still shows project Apollo.\n- **Executable test IDs:** T-FORM-006 (planned, characterization-of-suspect).\n\n## S-FORM-007 — edit of nonexistent id confirms a no-op save (characterization-of-suspect)\n- **ID:** S-FORM-007\n- **EARS statement:** **When** the system receives `POST /tasks/form` with `id=999` and valid fields, **the system shall** respond 302 `/tasks/form?id=999&saved=1` and persist nothing (observed; **characterization-of-suspect** — misleading Saved banner; intended 404 unresolved, defect candidate R-FORM-007).\n- **Linked rule IDs:** R-FORM-007\n- **Fixtures and inputs:** login `mgr`; `id=999`, `title=Ghost`, `projectId=1`; follow redirect.\n- **Observable assertions:** 302 with saved=1; GET shows `Saved.` banner on a blank \"New task\" form; oracle contains no row 999 and rows 1-4 unchanged.\n- **Executable test IDs:** T-FORM-007 (planned, characterization-of-suspect).\n\n=== S-LIFE ===\n# EARS specs — LIFE — task-tracker-demo @ eee783057ec28d28fb36ec05484de9b4b40ceb9c\n\nPlanned test IDs (T-LIFE-*) are placeholders. Oracle: `SELECT id,status FROM task ORDER BY id`. Reset DB before each mutating case. Login `mgr` unless stated; `view` used where pinning \"no role gate\" matters.\n\n## S-LIFE-001 — start success (any role)\n- **ID:** S-LIFE-001\n- **EARS statement:** **While** a task is OPEN, **when** any authenticated user sends `POST /tasks/action` with `action=start` and that task's id, **the system shall** set it to IN_PROGRESS, bump `updated_at`, and respond 302 to `/tasks`.\n- **Linked rule IDs:** R-LIFE-001, R-LIFE-009\n- **Fixtures and inputs:** login `view` (pins no role gate); task 1 (OPEN).\n- **Observable assertions:** 302 `/tasks`; oracle task 1 IN_PROGRESS; others unchanged.\n- **Executable test IDs:** T-LIFE-001 (planned).\n\n## S-LIFE-002 — submit success (any role)\n- **ID:** S-LIFE-002\n- **EARS statement:** **While** a task is IN_PROGRESS, **when** any authenticated user sends `action=submit` for it, **the system shall** set it to PENDING_APPROVAL, bump `updated_at`, and respond 302.\n- **Linked rule IDs:** R-LIFE-002, R-LIFE-009\n- **Fixtures and inputs:** login `dev`; task 2 (IN_PROGRESS).\n- **Observable assertions:** 302; oracle task 2 PENDING_APPROVAL.\n- **Executable test IDs:** T-LIFE-002 (planned).\n\n## S-LIFE-003 — reopen success (any role)\n- **ID:** S-LIFE-003\n- **EARS statement:** **While** a task is DONE, **when** any authenticated user sends `action=reopen` for it, **the system shall** set it to OPEN, bump `updated_at`, and respond 302.\n- **Linked rule IDs:** R-LIFE-003, R-LIFE-009\n- **Fixtures and inputs:** login `view`; task 4 (DONE); also `return=detail` variant → 302 `/tasks/form?id=4`.\n- **Observable assertions:** 302 (Location variants); oracle task 4 OPEN.\n- **Executable test IDs:** T-LIFE-003 (planned).\n\n## S-LIFE-004 — wrong-state refusal (unwanted behavior)\n- **ID:** S-LIFE-004\n- **EARS statement:** **When** an authenticated user sends start/submit/reopen for a task not in the action's expected status, **then the system shall** respond 409 `Cannot \u003caction> a task in status \u003ccurrent> (expected \u003cexpected>)` and change nothing.\n- **Linked rule IDs:** R-LIFE-005\n- **Fixtures and inputs:** login `mgr`; start on task 2 (IN_PROGRESS) → 409 `Cannot start a task in status IN_PROGRESS (expected OPEN)`; submit on task 1 (OPEN); reopen on task 1 (OPEN).\n- **Observable assertions:** 409 with exact messages; oracle unchanged (no updated_at bump).\n- **Executable test IDs:** T-LIFE-004 (planned; three legs).\n\n## S-LIFE-005 — not-found and ordering versus the approve gate\n- **ID:** S-LIFE-005\n- **EARS statement:** **When** an authenticated user sends a lifecycle action with `id=999`, **then the system shall** respond 404 `No such task` — except approve/reject as a non-approver, which respond 403 first (filter ordering).\n- **Linked rule IDs:** R-LIFE-006 (cross: R-APR-001, R-APR-002)\n- **Fixtures and inputs:** `mgr` start id=999 → 404; `dev` approve id=999 → 403; `mgr` approve id=999 → 404.\n- **Observable assertions:** statuses and messages as stated; oracle unchanged.\n- **Executable test IDs:** T-LIFE-005 (planned; implements run-01 recommendation).\n\n## S-LIFE-006 — unknown / missing action → 400 (unwanted behavior)\n- **ID:** S-LIFE-006\n- **EARS statement:** **When** an authenticated user sends `POST /tasks/action` with an unknown action value (and a parseable id), **then the system shall** respond 400 `Unknown action: \u003cvalue>`; **and when** the action parameter is absent, **the system shall** respond 400 `Unknown action: null`.\n- **Linked rule IDs:** R-LIFE-007\n- **Fixtures and inputs:** login `mgr`; `action=pause&id=1`; `id=1` only.\n- **Observable assertions:** 400 + exact messages; oracle unchanged. (No id → 500, see S-LIFE-007.)\n- **Executable test IDs:** T-LIFE-006 (planned).\n\n## S-LIFE-007 — malformed/missing id → 500 (characterization-of-suspect)\n- **ID:** S-LIFE-007\n- **EARS statement:** **When** an authenticated user sends a non-bulkClose action with `id` absent or non-numeric, **then the system shall** respond 500 (unhandled NumberFormatException; observed; **characterization-of-suspect** — F-002, intended 400 unresolved).\n- **Linked rule IDs:** R-LIFE-008\n- **Fixtures and inputs:** login `mgr`; `action=start` (no id); `action=start&id=abc`. — This executes F-002's pending reproduction.\n- **Observable assertions:** HTTP 500 both; oracle unchanged.\n- **Executable test IDs:** T-LIFE-007 (planned, characterization-of-suspect; doubles as F-002 repro).\n=== S-BULK ===\n# EARS specs — BULK — task-tracker-demo @ eee783057ec28d28fb36ec05484de9b4b40ceb9c\n\nPlanned test IDs (T-BULK-*) are placeholders. Oracle: `SELECT id,status,updated_at FROM task ORDER BY id`. Reset DB before mutating cases. **F-001 policy:** every spec below characterizes OBSERVED behavior, explicitly labelled characterization-of-suspect; the INTENDED requirement (canApprove + PENDING_APPROVAL guard consistent with the approve path) is recorded here as UNRESOLVED and is deliberately NOT asserted.\n\n## S-BULK-001 — empty selection no-op\n- **ID:** S-BULK-001\n- **EARS statement:** **When** an authenticated user sends `POST /tasks/action` with `action=bulkClose` and no `ids` values, **the system shall** respond 302 to `/tasks` and change nothing.\n- **Linked rule IDs:** R-BULK-001\n- **Fixtures and inputs:** login `mgr`; POST without ids field (the unchecked-boxes case).\n- **Observable assertions:** 302 `/tasks`; oracle unchanged.\n- **Executable test IDs:** T-BULK-001 (planned).\n\n## S-BULK-002 — mixed-status selection (characterization-of-suspect; F-001 execution)\n- **ID:** S-BULK-002\n- **EARS statement:** **When** an authenticated user sends `action=bulkClose` with `ids=1&ids=3&ids=4&ids=999`, **the system shall** respond 302 to `/tasks` with tasks 1 (OPEN) and 3 (PENDING_APPROVAL) set to DONE with bumped `updated_at`, task 4 (already DONE) untouched, and no error for 999 (observed; **characterization-of-suspect** — PENDING_APPROVAL reaching DONE without approval is F-001's suspected defect; **INTENDED, unresolved, not asserted**: only approvers, and only from legal states, should reach DONE).\n- **Linked rule IDs:** R-BULK-002, R-BULK-005\n- **Fixtures and inputs:** login `mgr`; reset DB first. — This executes F-001's pending reproduction for the state dimension.\n- **Observable assertions:** 302; oracle: 1 DONE, 3 DONE, 4 DONE with original updated_at, 2 IN_PROGRESS unchanged.\n- **Executable test IDs:** T-BULK-002 (planned, characterization-of-suspect; F-001 repro).\n\n## S-BULK-003 — non-approver role (characterization-of-suspect; F-001 execution)\n- **ID:** S-BULK-003\n- **EARS statement:** **When** a MEMBER or VIEWER sends `action=bulkClose` with `ids=3` (PENDING_APPROVAL), **the system shall** respond 302 and set task 3 to DONE (observed; **characterization-of-suspect** — F-001's role dimension: no canApprove gate on this path; **INTENDED, unresolved, not asserted**: MEMBER/VIEWER should be refused like approve/reject).\n- **Linked rule IDs:** R-BULK-003 (cross: R-APR-001, R-APR-004)\n- **Fixtures and inputs:** login `dev`; reset DB; `ids=3`; repeat as `view`.\n- **Observable assertions:** 302 (no 403); oracle task 3 DONE; contrast control: `action=approve&id=3` as dev → 403 (S-APR-003).\n- **Executable test IDs:** T-BULK-003 (planned, characterization-of-suspect; F-001 repro).\n\n## S-BULK-004 — malformed ids value → 500 (characterization-of-suspect)\n- **ID:** S-BULK-004\n- **EARS statement:** **When** an authenticated user sends `action=bulkClose` with any non-numeric `ids` value (including the single empty string), **then the system shall** respond 500 and write nothing (observed; **characterization-of-suspect**, F-002 class).\n- **Linked rule IDs:** R-BULK-004\n- **Fixtures and inputs:** login `mgr`; `ids=abc`; `ids=1&ids=abc`; `ids=`.\n- **Observable assertions:** 500 all three; oracle unchanged (parse precedes the UPDATE).\n- **Executable test IDs:** T-BULK-004 (planned, characterization-of-suspect).\n\n## S-BULK-005 — all-DONE selection → 302, zero changes\n- **ID:** S-BULK-005\n- **EARS statement:** **When** an authenticated user sends `action=bulkClose` with `ids=4` (only a DONE task), **the system shall** respond 302 with no status or `updated_at` change to task 4.\n- **Linked rule IDs:** R-BULK-005\n- **Fixtures and inputs:** login `mgr`; `ids=4`.\n- **Observable assertions:** 302; oracle task 4 status DONE and updated_at byte-identical.\n- **Executable test IDs:** T-BULK-005 (planned).\n=== S-QUERY ===\n# EARS specs — QUERY — task-tracker-demo @ eee783057ec28d28fb36ec05484de9b4b40ceb9c\n\nPlanned test IDs (T-QUERY-*) are placeholders. Seed default order is ids 4,3,2,1 (updated_at 18:00/15:00/12:00/09:00, seed.sql:18-21). Order assertions read the ID column sequence of GET /tasks HTML (first data row = first). Login `mgr`.\n\n## S-QUERY-001 — default listing and ordering\n- **ID:** S-QUERY-001\n- **EARS statement:** **When** an authenticated user requests `GET /tasks` with no parameters, **the system shall** respond 200 listing all tasks in `updated_at DESC` order (seed: 4,3,2,1) with the toolbar showing \"(all)\" and \"Recently updated\".\n- **Linked rule IDs:** R-QUERY-001\n- **Fixtures and inputs:** reset DB; GET /tasks.\n- **Observable assertions:** 200; task id sequence 4,3,2,1; status select shows \"(all)\" selected; sort select \"updated\" selected.\n- **Executable test IDs:** T-QUERY-001 (planned).\n\n## S-QUERY-002 — status filter legs\n- **ID:** S-QUERY-002\n- **EARS statement:** **When** the system receives `GET /tasks?status=\u003cS>`, **the system shall** list only tasks with status exactly S (200) — with S=`OPEN` → task 1, S=`BOGUS` → empty table (200, no error), S empty → all tasks; filter values are parameterized (injection probes have no SQL effect).\n- **Linked rule IDs:** R-QUERY-002, R-QUERY-007\n- **Fixtures and inputs:** `?status=OPEN`, `?status=BOGUS`, `?status=`, `?status=OPEN'--`.\n- **Observable assertions:** 200 each; row sets as stated; select echoes the raw value.\n- **Executable test IDs:** T-QUERY-002 (planned; four legs).\n\n## S-QUERY-003 — assignee filter legs (incl. 500 characterization)\n- **ID:** S-QUERY-003\n- **EARS statement:** **When** the system receives `GET /tasks?assignee=\u003cid>`, **the system shall** list only that person's tasks (id 3 → tasks 1,2,3; id 999 → empty); **and when** assignee is empty, **the system shall** list all; **and when** assignee is non-numeric, **the system shall** respond 500 (observed; **characterization-of-suspect**, F-002 class). There is no value meaning \"unassigned\" (capability gap, observed).\n- **Linked rule IDs:** R-QUERY-003\n- **Fixtures and inputs:** `?assignee=3`, `?assignee=999`, `?assignee=`, `?assignee=abc`.\n- **Observable assertions:** as stated per leg; 200/200/200/500.\n- **Executable test IDs:** T-QUERY-003 (planned; four legs).\n\n## S-QUERY-004 — combined filters\n- **ID:** S-QUERY-004\n- **EARS statement:** **When** the system receives `GET /tasks?status=OPEN&assignee=3`, **the system shall** list tasks matching BOTH (task 1); **and when** the combination matches nothing (`status=OPEN&assignee=1`), **the system shall** render an empty table (200).\n- **Linked rule IDs:** R-QUERY-004\n- **Fixtures and inputs:** the two probes on seeded data.\n- **Observable assertions:** 200; row sets as stated.\n- **Executable test IDs:** T-QUERY-004 (planned).\n\n## S-QUERY-005 — every whitelisted sort token\n- **ID:** S-QUERY-005\n- **EARS statement:** **When** the system receives `GET /tasks?sort=\u003ctoken>`, **the system shall** order rows exactly per the whitelist: `status` → 4,2,1,3; `priority` → 2,1,3,4; `due` → 3,1,2,4 (NULL due last); `due_date` (server-only token) → same as `due`; `title` → 4,1,3,2; `id` → 1,2,3,4.\n- **Linked rule IDs:** R-QUERY-005\n- **Fixtures and inputs:** reset DB; one GET per token (six + `due_date` = seven).\n- **Observable assertions:** 200; exact id sequences per token (sources: TaskDao.java:154-172 clauses; Postgres ASC NULLS LAST for due).\n- **Executable test IDs:** T-QUERY-005 (planned; parametrized seven cases).\n\n## S-QUERY-006 — invalid/unknown sort fallback\n- **ID:** S-QUERY-006\n- **EARS statement:** **When** the system receives `GET /tasks?sort=\u003cvalue>` with any non-whitelisted value (bogus, injection-shaped, `updated`, empty, or absent), **the system shall** respond 200 with the default `updated_at DESC` order (4,3,2,1) and no error.\n- **Linked rule IDs:** R-QUERY-006, R-QUERY-007\n- **Fixtures and inputs:** `?sort=bogus`, `?sort=status;--`, `?sort=updated`, `?sort=`, no param.\n- **Observable assertions:** 200; order 4,3,2,1 in every leg.\n- **Executable test IDs:** T-QUERY-006 (planned; five legs).\n=== S-API ===\n# EARS specs — API — task-tracker-demo @ eee783057ec28d28fb36ec05484de9b4b40ceb9c\n\nPlanned test IDs (T-API-*) are placeholders. Anonymous (no login) for all — the route is auth-exempt (F-003 closed). JSON parsed with a strict parser where noted. Seed tasks 1..4.\n\n## S-API-001 — anonymous full readback\n- **ID:** S-API-001\n- **EARS statement:** **When** the system receives `GET /api/tasks` with no session, **the system shall** respond 200 `application/json` with a JSON array of all four tasks in updated_at DESC order (ids 4,3,2,1), each with keys id/title/status/priority/assigneeId/projectId/dueDate/updatedAt and no description key.\n- **Linked rule IDs:** R-API-001, R-API-006\n- **Fixtures and inputs:** reset DB; anonymous GET.\n- **Observable assertions:** 200; Content-Type application/json (UTF-8); parseable array of 4; key set exactly as listed; id order 4,3,2,1; task 4 has `\"assigneeId\":null` and `\"dueDate\":null`.\n- **Executable test IDs:** T-API-001 (planned).\n\n## S-API-002 — status filter\n- **ID:** S-API-002\n- **EARS statement:** **When** the system receives `GET /api/tasks?status=DONE`, **the system shall** return exactly the DONE tasks (task 4); **and when** status is empty, all tasks; **and when** status is unknown (`BOGUS`), `[]` (200).\n- **Linked rule IDs:** R-API-002\n- **Fixtures and inputs:** the three probes, anonymous.\n- **Observable assertions:** 200; array sizes 1/4/0; order default.\n- **Executable test IDs:** T-API-002 (planned; three legs).\n\n## S-API-003 — escaping and readback (incl. suspect control-character leg)\n- **ID:** S-API-003\n- **EARS statement:** **When** a task title contains `\"` or `\\`, **the system shall** emit them JSON-escaped (`\\\"`, `\\\\`) and HTML-special characters (`\u003c>&`) literally; **and when** a title contains a raw newline, **the system shall** emit it unescaped inside the string (observed; **characterization-of-suspect** — strict-JSON validity defect candidate R-API-003 / suggested F-008).\n- **Linked rule IDs:** R-API-003\n- **Fixtures and inputs:** login `mgr`; create tasks titled `He said \"hi\"\\ & \u003cb>b\u003c/b>` and `A%0AB` (form stores titles unmodified); then anonymous GET /api/tasks; reset DB after.\n- **Observable assertions:** escaped leg: title round-trips equal after JSON parse (HTML-specials intact). Newline leg: strict parser REJECTS the body (or body contains a literal 0x0A inside a string) — pin whichever the run observes; label characterization-of-suspect.\n- **Executable test IDs:** T-API-003 (planned, characterization for the newline leg).\n\n## S-API-004 — null-field rendering\n- **ID:** S-API-004\n- **EARS statement:** **When** the read-back includes an unassigned task with no due date, **the system shall** render `\"assigneeId\":null` and `\"dueDate\":null` as bare tokens, while `updatedAt` is always a quoted non-empty timestamp.\n- **Linked rule IDs:** R-API-004\n- **Fixtures and inputs:** create a task with no assignee/due (S-FORM-003 fixture), then GET /api/tasks.\n- **Observable assertions:** bare `null` tokens (not `\"null\"`); updatedAt matches `\\d{4}-\\d{2}-\\d{2} \\d{2}:\\d{2}:\\d{2}` (fraction truncated, R-DATA-005).\n- **Executable test IDs:** T-API-004 (planned).\n\n## S-API-005 — GET-only (unwanted behavior)\n- **ID:** S-API-005\n- **EARS statement:** **When** the system receives `POST /api/tasks` (anonymous), **then the system shall** respond 405 and access no data.\n- **Linked rule IDs:** R-API-005\n- **Fixtures and inputs:** anonymous POST; oracle before/after.\n- **Observable assertions:** HTTP 405; oracle unchanged (supports F-003's no-mutation adjudication).\n- **Executable test IDs:** T-API-005 (planned).\n=== S-DATA ===\n# EARS specs — DATA — task-tracker-demo @ eee783057ec28d28fb36ec05484de9b4b40ceb9c\n\nPlanned test IDs (T-DATA-*) are placeholders. Most DATA rules have no executable HTTP surface; specs below cover the observable legs, and `rules/app-inventory.json` accounts for the no-test-possible remainder.\n\n## S-DATA-001/002/003 — constraint echo via crafted writes (characterization)\n- **ID:** S-DATA-001 (person), S-DATA-002 (project), S-DATA-003 (task)\n- **EARS statement:** **When** a crafted request would violate a DB constraint (duplicate project name → accepted per S-PROJ-004; unknown assignee / bad priority / overlong title → 500 per S-FORM-008; illegal state value in SQL → rejected by CHECK), **the system shall** behave exactly as the linked family specs characterize, and direct SQL probes against the oracle shall confirm the schema (username UNIQUE, state/status/priority CHECKs, FKs, defaults OPEN/MEDIUM).\n- **Linked rule IDs:** R-DATA-001, R-DATA-002, R-DATA-003 (cross: R-PROJ-004, R-FORM-008)\n- **Fixtures and inputs:** reset DB; SQL probe script over the oracle connection (harness `runtime.py sql`): attempt `INSERT INTO project(name,owner_id) VALUES('dup',1)` twice; `UPDATE task SET status='BOGUS' WHERE id=1`; `UPDATE person SET role='EMPEROR' WHERE id=1` — all via SELECT-verified error capture where the harness permits.\n- **Observable assertions:** second duplicate-name insert succeeds (no UNIQUE); BOGUS status and EMPEROR role rejected by CHECK (error messages recorded verbatim) aved=1`, and the header `fullName (ROLE)` + Logout link.\n- **Linked rule IDs:** R-DATA-009\n- **Fixtures and inputs:** seeded DB; login `dev`; GET /tasks; GET /tasks/form?id=2; then a saved redirect (POST edit) for the banner.\n- **Observable assertions:** per-row button sets exactly as the status conditionals (tasks.jsp:57-69; task-form.jsp:46-58); banner `Saved.` appears only with saved=1; header shows `Devon Member (MEMBER)`.\n- **Executable test IDs:** T-DATA-003 (planned).\n","isError":false,"ts":"2026-11-02T20:46:19.847Z","durationMs":21},"tokens":{"input":4179,"output":128,"reasoning":41,"cacheRead":10353,"cacheWrite":0},"reportedCostUSD":0.0181779,"i":14,"workMs":1141},{"kind":"meta","ts":"2026-11-02T20:46:19.902Z","text":"step finish — tool-calls","i":15},{"kind":"thinking","ts":"2026-11-02T20:46:54.972Z","text":"Now I have the final spec IDs. Let me map my placeholder IDs to final IDs. I also need the R-* rule IDs — the mapping.json references R-AUT-001 etc. The dispatch gives families and ranges. Let me also check the rules files to get exact rule IDs. Time is very tight (~2.5 min left). Let me fetch the rules files quickly — actually, the dispatch lists final IDs:\n\n- AUTH: R-AUTH-001..008, S-AUTH-001..007\n- PROJ: R-PROJ-001..008, S-PROJ-001..008\n- FORM: R-FORM-001..008, S-FORM-001..008\n- LIFE: R-LIFE-001..009, S-LIFE-001..007\n- BULK: R-BULK-001..005, S-BULK-001..005\n- QUERY: R-QUERY-001..007, S-QUERY-001..006\n- API: R-API-001..006, S-API-001..005\n- DATA: R-DATA-001..009, S-DATA-001..006\n\nI have the specs which give me \"Linked rule IDs\" for each spec. That's enough for reconciliation. Let me map each test:\n\n**AUTH (S-AUT → S-AUTH):**\n- test_s_aut_001_logout_then_tasks_redirects_to_login → S-AUTH-006 (logout invalidates session), rules R-AUTH-006, R-AUTH-007\n- test_s_aut_002_anonymous_gets_redirect_to_login → S-AUTH-004, rules R-AUTH-004, R-AUTH-005\n- test_s_aut_003_anonymous_posts_redirect_without_mutation → S-AUTH-004, rules R-AUTH-004
